ertical}.columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tablewrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid #e6edf2;text-align:left;vertical-align:middle}.tbl th{background:#f5f8fb;color:#476075;font-size:12px}.tbl tr:hover td{background:#fafcfe}.tag{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:750;background:#eaf1f7;color:#245276}.tag.aprobado{background:#e1f5e8;color:#216b3d}.tag.reprobado{background:#feecec;color:#973132}.tag.en_curso{background:#e5f0ff;color:#315e9c}.tag.pendiente{background:#f0f2f5;color:#57647a}.notice{border-left:4px solid #5e86ad;background:#edf4fb;padding:12px 15px;border-radius:5px;margin:14px 0;color:#2d4b67}.warning{border-left-color:#c38a35;background:#fff6e6;color:#7c571e}.stack{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hide{display:none!important}#toast{position:fixed;right:18px;bottom:20px;border-radius:10px;padding:12px 17px;background:#142b45;color:white;box-shadow:0 10px 30px #101d2d44;display:none;z-index:30;max-width:430px}#toast.show{display:block}#overlay{position:fixed;inset:0;background:#14283c99;display:none;z-index:40;align-items:center;justify-content:center;padding:12px}.modal{background:white;max-width:840px;width:100%;max-height:92vh;overflow:auto;border-radius:14px;padding:22px}.scroll{max-height:430px;overflow:auto}.sep{border:0;border-top:1px solid #e1e7ef;margin:17px 0}.empty{text-align:center;padding:60px 15px;color:#718096}.small{font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button{padding:8px 12px;background:#f2f6fb;border:1px solid #d9e4ee;border-radius:8px}.tabs button.sel{background:#194a78;color:#fff}details{background:#fafcff;border:1px solid #e6ebf0;border-radius:8px;padding:10px;margin:7px 0}summary{cursor:pointer;font-weight:700}.compact{font-size:12px}.bullet{margin:5px 0}#upload{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{padding:12px}.brand,.subbrand{display:none}.navigation{display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;margin:0;width:auto}.top,.content{padding:16px}.heading{font-size:20px}}@media print{.side,.top .bar,.btn,.tabs{display:none!important}.layout{display:block}.card{box-shadow:none}body{background:white}}
.malla{display:grid;grid-template-columns:repeat(10,minmax(145px,1fr));gap:9px;min-width:1020px}.malla-col{display:flex;flex-direction:column;gap:7px}.malla-head{text-align:center;font-size:12px;font-weight:800;padding:9px;background:#dce7f3;border-radius:7px}.malla-course{border:1px solid #d4dee8;border-radius:8px;padding:9px;min-height:94px;text-align:left;background:#f0f2f5;color:#263a4d;cursor:pointer}.malla-course.aprobado{background:#daf3e4;border-color:#8bcaa6}.malla-course.en_curso{background:#dfebff;border-color:#8fb2e7}.malla-course.reprobado{background:#fce1e1;border-color:#df9b9b}.malla-course.pendiente{background:#f1f2f4;border-color:#d6dce3}.malla-course b{display:block;font-size:12px}.malla-course small{display:block;font-size:11px;line-height:1.35;margin-top:5px}.malla-legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.sheet{max-height:68vh;overflow:auto}.sheet table{border-collapse:separate;border-spacing:0}.sheet th{position:sticky;top:0;background:#eef3f8;z-index:1}.sheet th:first-child,.sheet td:first-child{position:sticky;left:0;background:white;z-index:2;min-width:210px}.sheet input[type=number]{width:82px;padding:7px;border:1px solid #c7d3df;border-radius:6px}.sheet td,.sheet th{border-bottom:1px solid #e2e8f0;padding:9px}.course-members{max-height:400px;overflow:auto}#overlay .modal:has(.sheet){max-width:96vw;width:96vw} .cmCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:9px;max-height:52vh;overflow:auto;margin-top:12px}.cmStudent{border:1px solid #d9e2eb;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:#f9fbfe}.cmStudent:has(input:checked){border-color:#416f9c;background:#eaf2fb}.cmScaleGrid{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.cmScaleGrid label{display:flex;align-items:center;gap:7px;background:#f0f5fa;padding:9px;border-radius:8px}.cmScaleGrid input{width:90px;padding:7px;border:1px solid #c7d3df;border-radius:6px}.cm-preview{font- </style></head><body><div class="layout"><aside class="side"><div class="brand">Castellano Maestro</div><div class="subbrand">Pedagogía en Castellano · UCSH</div><nav class="navigation" id="navigation"></nav><div class="subbrand" style="margin-top:30px">Archivo local · Sin conexión a internet<br>Los cambios se exportan en un nuevo JSON.</div></aside><main class="main"><header class="top"><div><div class="heading" id="screenTitle">Inicio</div><div class="muted small" id="loadedLabel">Sin base cargada</div></div><div class="bar"><button class="btn" id="importBtn">Importar JSON</button><button class="btn primary" id="exportBtn" disabled>Exportar base actualizada</button><input type="file" id="upload" accept="application/json,.json"></div></header><div class="content" id="screen"><div class="empty">Importa la Base Maestra Curricular (JSON) para comenzar.</div></div></main></div><div id="toast"></div><div id="overlay"><div class="modal" id="modal"></div></div><script>
'use strict';
let db=null, dirty=false, current='inicio', selectedStudent=null, selectedTeacher=null, selectedCourse=null;
const names={inicio:'Resumen',estudiantes:'Estudiantes',profesores:'Profesores',cursos:'Planes y cursos',perfil:'Perfil de egreso',estandares:'Estándares',eif:'Resultados EIF',hito:'Resultados HITO',analisis:'Análisis y reportes',end:'Resultados END',academica:'Productividad Académica',config:'Validación y exportación'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=id=>document.getElementById(id)?.value ?? '';
const field=(label,id,value='',type='text',opts=null)=>`<div class="field"><label class="label" for="${id}">${esc(label)}</label>${opts?`<select id="${id}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(value)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}">`}</div>`;
const button=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${esc(fn)}">${esc(label)}</button>`;
const row=(arr)=>`<div class="columns">${arr.join('')}</div>`;
const courseList=()=>Object.values(db?.planes_estudio||{}).flatMap(x=>Object.values(x.cursos||{}));
const course=id=>db?.planes_estudio?.[id.split(':')[0]]?.cursos?.[id];
const studentList=()=>Object.values(db?.estudiantes?.por_rut||{});
const student=r=>db?.estudiantes?.por_rut?.[r];
const studentRef=(r)=>student(r)?.rut||r;
const teachers=()=>db?.profesores||[];
const entries=o=>Object.entries(o||{});
const date=()=>new Date().toISOString().slice(0,10);
function toast(msg){let x=$('#toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3700)}
function mark(){dirty=true;$('#exportBtn').disabled=false;updateLabel()}
function updateLabel(){$('#loadedLabel').textContent=db?`${db.carrera?.nombre||'Base Maestra'} · Versión ${db.metadatos?.version||'?'}${dirty?' · Cambios sin exportar':''}`:'Sin base cargada'}
function modal(html){$('#modal').innerHTML=html;$('#overlay').style.display='flex'}
function closeModal(){$('#overlay').style.display='none';$('#modal').innerHTML=''}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
function renderNav(){$('#navigation').innerHTML=entries(names).map(([k,n])=>`<button class="nav ${k===current?'active':''}" onclick="go('${k}')">${esc(n)}</button>`).join('')}
function go(k){current=k;renderNav();$('#screenTitle').textContent=names[k];if(!db){$('#screen').innerHTML=`<div class="card empty"><h3>Bienvenido a Castellano Maestro</h3><p>Importa la Base Maestra JSON v1.9 o una versión compatible para visualizar y alimentar los datos.</p>${button('Seleccionar archivo','document.getElementById("upload").click()','primary')}<p class="small">Por privacidad, la base de estudiantes no se incorpora dentro de este HTML.</p></div><div class="card" style="border-left:4px solid #2563eb"><h3>Base Maestra Curricular · Carpeta institucional</h3><p>La versión vigente del archivo JSON se encuentra en SharePoint. Accede a la carpeta, descarga la Base Maestra y luego utiliza <b>Importar JSON</b> para abrirla en Castellano Maestro.</p><p><a href="https://ucsh.sharepoint.com/:f:/s/EscueladeCastellanoUCSH/IgDNry809lF2Spk58SBjswG9Aesa6naC29Q138UY_AHhmhs?e=cr9pfn" target="_blank" rel="noopener noreferrer" style="font-weight:700;color:#1859b0;text-decoration:underline">Abrir carpeta de la Base Maestra en SharePoint ↗</a></p><p class="small muted">El enlace abre SharePoint en otra pestaña; la aplicación no descarga ni sincroniza automáticamente los datos. Puede requerirse acceso institucional.</p></div>`;return}render()}
$('#importBtn').onclick=()=>$('#upload').click();$('#upload').onchange=async(e)=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.planes_estudio||!obj.perfil_egreso||!obj.estudiantes||!obj.metadatos)throw Error('Este JSON no corresponde a una Base Maestra compatible.');if(db&&dirty&&!confirm('Hay cambios sin exportar. ¿Deseas reemplazar la base actual?'))return;db=obj;db.profesores ||= [];db.resultados_eif ||= {rendiciones:[],catalogo_por_curso:{}};db.resultados_hito ||= {rendiciones:[],catalogo_hitos:{}};db.resultados_eif.rendiciones ||= [];db.resultados_hito.rendiciones ||= [];db.resultados_hito.instrumentos ||= [];db.historial_cambios ||= [];db.resultados_end ||= {periodicidad:'anual',unidad_analisis:'agregado_institucional',asociacion_estudiantes:false,asociacion_cohortes:false,anualidades:{},definiciones_indicadores:[],observaciones:'Estructura reservada; definir indicadores y escalas en una etapa posterior.'};db.historial_cambios ||= [];dirty=false;selectedStudent=null;selectedTeacher=null;$('#exportBtn').disabled=false;updateLabel();go('inicio');toast('Base importada correctamente')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function logChange(tipo,referencia,detalle){db.historial_cambios ||= [];db.historial_cambios.push({fecha:new Date().toISOString(),tipo,referencia,detalle});mark()}
function exportJSON(){if(!db)return;let result=validate();if(result.errors.length){if(!confirm(`Se detectaron ${result.errors.length} errores de integridad. ¿Deseas exportar de todas formas?`))return}let next=structuredClone(db);next.metadatos.version=increment(next.metadatos.version||'1.9');next.metadatos.fecha_ultima_actualizacion=date();next.metadatos.observacion_actualizacion='Actualizada desde Castellano Maestro';next.metadatos.historial_versiones ||= [];next.metadatos.historial_versiones.push({version:next.metadatos.version,fecha:date(),descripcion:'Exportación desde Castellano Maestro'});let blob=new Blob([JSON.stringify(next,null,2)],{type:'application/json'});download(blob,`Base_Maestra_Castellano_UCSH_v${next.metadatos.version.replaceAll('.','_')}.json`);db=next;dirty=false;updateLabel();toast('Nueva versión exportada. Conserva este archivo para tu próxima sesión.')}
function increment(t){let p=t.split('.');p[p.length-1]=String((parseInt(p.at(-1))||0)+1);return p.join('.')}
function download(blob,n){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
$('#exportBtn').onclick=exportJSON;
function metric(title,num,sub=''){return `<div class="card"><div class="muted">${esc(title)}</div><div class="metric">${esc(num)}</div><div class="muted small">${esc(sub)}</div></div>`}
function render(){switch(current){case'inicio':return home();case'estudiantes':return studentsPage();case'profesores':return teachersPage();case'cursos':return coursesPage();case'perfil':return profilePage();case'estandares':return standardsPage();case'eif':return resultPage('eif');case'hito':return resultPage('hito');case'analisis':return analytics();case'end':return cmEndPage();case'academica':return academicPage();case'config':return settings();}}
function home(){let ss=studentList(),cc=courseList(),e=db.resultados_eif.rendiciones,h=db.resultados_hito.rendiciones;$('#screen').innerHTML=`<div class="card" style="border-left:4px solid #2563eb"><h3>Base Maestra Curricular · Carpeta institucional</h3><p>La versión vigente del archivo JSON se encuentra en SharePoint. Accede a la carpeta, descarga la Base Maestra y luego utiliza <b>Importar JSON</b> para abrirla en Castellano Maestro.</p><p><a href="https://ucsh.sharepoint.com/:f:/s/EscueladeCastellanoUCSH/IgDNry809lF2Spk58SBjswG9Aesa6naC29Q138UY_AHhmhs?e=cr9pfn" target="_blank" rel="noopener noreferrer" style="font-weight:700;color:#1859b0;text-decoration:underline">Abrir carpeta de la Base Maestra en SharePoint ↗</a></p><p class="small muted">El enlace abre SharePoint en otra pestaña; la aplicación no descarga ni sincroniza automáticamente los datos. Puede requerirse acceso institucional.</p></div><div class="grid">${metric('Estudiantes',ss.length,'Plan B y Plan C')}${metric('Profesores',teachers().length)}${metric('Cursos',cc.length,'Con ficha curricular')}${metric('Rendiciones registradas',e.length+h.length,`${e.length} EIF · ${h.length} HITO`)}</div><div class="card"><h3>Consultar o actualizar información</h3><div class="grid">${entries(names).filter(([k])=>!['inicio','config'].includes(k)).map(([k,n])=>`<button class="btn" onclick="go('${k}')">${esc(n)} →</button>`).join('')}</div></div><div class="notice"><b>Uso local y confidencial.</b> Los datos permanecen en este navegador durante la sesión; nada se envía a un servidor. Los cambios no persisten hasta descargar la nueva Base Maestra. Evita trabajar con datos identificables en computadores compartidos.</div>`}
function studentsPage(){let ss=studentList(),filter=v('studentSearch')?.toLowerCase()||'',plan=v('studentPlan')||'',sit=v('studentSituation')||'activos';$('#screen').innerHTML=`<div class="card"><div class="row"><h3>Fichas estudiantiles (${ss.length})</h3><div class="bar">${button('Agregar estudiante','editStudent()','primary')}${button('Registrar titulado','cmGraduateEntry()')}${button('Importar titulados desde Excel','cmBulkGraduates()')}</div></div><div class="columns">${field('Buscar nombre o RUT','studentSearch',filter)}${field('Plan','studentPlan',plan,'text',[['','Ambos planes'],['B','Plan B'],['C','Plan C']])}${field('Situación','studentSituation',sit,'text',[['activos','Activos (incluye sin situación informada)'],['retiro_temporal','Retiro temporal'],['retiro_definitivo','Retiro definitivo'],['titulado','Titulados'],['todos','Todos']])}</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Estudiante</th><th>Plan</th><th>Ingreso</th><th>Situación</th><th>Actualización</th><th>Avance</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`;for(let k of ['studentSearch','studentPlan','studentSituation'])$('#'+k)['on'+(k==='studentSearch'?'input':'change')]=fillStudents;fillStudents()}
function fillStudents(){let f=v('studentSearch').toLowerCase(),p=v('studentPlan'),sit=v('studentSituation'),ss=studentList().filter(s=>(s.nombre_completo+' '+s.rut).toLowerCase().includes(f)&&(!p||s.plan_estudio===p)&&cmSituationMatches(s,sit)).sort((a,b)=>a.nombre_completo.localeCompare(b.nombre_completo,'es'));$('#studentRows').innerHTML=ss.slice(0,500).map(s=>`<tr><td><b>${esc(s.nombre_completo)}</b><div class="small muted">${esc(s.rut)}</div></td><td>${esc(s.plan_estudio)}</td><td>${esc(s.ingreso?.periodo||'')}</td><td>${esc(s.situacion_academica||'Activo')}</td><td>${esc(s.fecha_ultima_actualizacion||'')}</td><td>${Object.values(s.avance_curricular||{}).filter(c=>c.estado==='aprobado').length} aprobados</td><td>${button('Abrir',`openStudent(${JSON.stringify(s.rut)})`,'small')}</td></tr>`).join('')||'<tr><td colspan="7">Sin coincidencias</td></tr>'}
function editStudent(r=null){let s=r?student(r):null;modal(`<div class="row"><h3>${s?'Editar estudiante':'Nuevo estudiante'}</h3>${button('Cerrar','closeModal()','small')}</div>${row([field('RUT','se_rut',s?.rut||''),field('Nombre completo','se_name',s?.nombre_completo||''),field('Correo (opcional)','se_email',s?.correo||'','email'),field('Plan','se_plan',s?.plan_estudio||'B','text',[['B','Plan B'],['C','Plan C']]),field('Año de ingreso','se_year',s?.ingreso?.anio||2026,'number'),field('Semestre de ingreso','se_sem',s?.ingreso?.semestre||1,'text',[['1','1'],['2','2']]),field('Fecha de última actualización','se_date',s?.fecha_ultima_actualizacion||date(),'date')])}<div class="bar">${button('Guardar estudiante',`saveStudent(${JSON.stringify(r)})`,'primary')}</div>`)}
function saveStudent(old){let rut=v('se_rut').trim(),name=v('se_name').trim(),plan=v('se_plan');if(!rut||!name)return alert('RUT y nombre son obligatorios');if(student(rut)&&rut!==old)return alert('Ya existe un estudiante con ese RUT');let s=old?student(old):cmNewStudent(rut,name,plan);if(old&&s.plan_estudio!==plan&&!confirm('Cambiar el plan no convierte los avances curriculares existentes. ¿Continuar?'))return;if(old&&old!==rut){delete db.estudiantes.por_rut[old];for(let k of ['resultados_eif','resultados_hito'])for(let r of db[k].rendiciones||[])if(r.estudiante_ref===old)r.estudiante_ref=rut}s.rut=rut;s.nombre_completo=name;s.plan_estudio=plan;s.correo=v('se_email').trim()||null;s.ingreso={periodo:`${v('se_year')}-${v('se_sem')}`,anio:+v('se_year'),semestre:+v('se_sem')};s.fecha_ultima_actualizacion=v('se_date');db.estudiantes.por_rut[rut]=s;logChange('estudiante',rut,old?'Ficha modificada':'Ficha incorporada');closeModal();studentsPage();openStudent(rut)}
function countStates(s){let out={aprobado:0,en_curso:0,pendiente:0,reprobado:0};for(let a of Object.values(s.avance_curricular||{}))out[a.estado]=(out[a.estado]||0)+1;return out}
function mallaHTML(s){let cc=courseList().filter(c=>c.plan_id===s.plan_estudio),cols=[];for(let yr=1;yr<=5;yr++){for(let sem=1;sem<=2;sem++){let level=((yr-1)*2+sem)*100;let items=cc.filter(c=>Number(c.nivel)===level);let cards=items.map(c=>{let st=s.avance_curricular?.[c.id]?.estado||'pendiente';return `<button class="malla-course ${esc(st)}" onclick='editProgress(${JSON.stringify(s.rut)},${JSON.stringify(c.id)})'><b>${esc(c.sigla)} · ${esc(c.creditos)} cr</b><small>${esc(c.nombre)}</small><small>${esc(st)}</small></button>`}).join('');cols.push(`<div class="malla-col"><div class="malla-head">Año ${yr} · S${sem}</div>${cards||'<span class="small muted">Sin ficha</span>'}</div>`);}}return `<div class="malla-legend">${['aprobado','en_curso','pendiente','reprobado'].map(st=>`<span class="tag ${st}">${st.replace('_',' ')}</span>`).join('')}</div><div class="tablewrap"><div class="malla">${cols.join('')}</div></div>`}

function editProgress(r,id=null){let s=student(r),a=id?s.avance_curricular[id]:null;modal(`<div class="row"><h3>Actualizar avance curricular</h3>${button('Cerrar','closeModal()','small')}</div>${field('Curso (identificador Plan:Sigla)','pr_id',id||'', 'text',id?null:courseList().filter(c=>c.plan_id===s.plan_estudio).map(c=>[c.id,c.id+' · '+c.nombre]))}${field('Estado','pr_state',a?.estado||'pendiente','text',[['aprobado','Aprobado'],['en_curso','En curso'],['pendiente','Pendiente'],['reprobado','Reprobado']])}${field('Fecha de actualización','pr_date',date(),'date')}<p class="small muted">El estado anterior se registrará en el historial. Esta modificación no almacena notas.</p>${button('Guardar',`saveProgress(${JSON.stringify(r)},${JSON.stringify(id)})`,'primary')}`)}
function saveProgress(r,oldid){let id=oldid||v('pr_id'),s=student(r);if(!id||!id.startsWith(s.plan_estudio+':'))return alert('Selecciona un curso del plan del estudiante');let old=s.avance_curricular[id]?.estado||null,newstate=v('pr_state');s.avance_curricular[id]={...(s.avance_curricular[id]||{}),estado:newstate,creditos:s.avance_curricular[id]?.creditos??course(id)?.creditos??0};s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=entries(s.avance_curricular).filter(([id,a])=>a.estado==='aprobado').reduce((t,[id,a])=>t+(+a.creditos||0),0);s.fecha_ultima_actualizacion=v('pr_date');s.historial_avance ||= [];s.historial_avance.push({curso_id:id,estado_anterior:old,estado_nuevo:newstate,fecha:v('pr_date')});logChange('avance_curricular',r+' / '+id,`${old||'sin registro'} → ${newstate}`);closeModal();openStudent(r);toast('Avance actualizado')}
function editObservation(r,i=null){let o=i===null?{}:student(r).observaciones_planificacion?.[i]||{};modal(`<div class="row"><h3>Observación de planificación</h3>${button('Cerrar','closeModal()','small')}</div>${field('Tipo','ob_tipo',o.tipo||'restriccion_horaria','text',[['restriccion_horaria','Restricción horaria'],['preferencia','Preferencia'],['otro','Otra observación']])}${field('Descripción','ob_texto',o.texto||'','textarea')}${field('Cursos involucrados (IDs separados por coma)','ob_cursos',(o.cursos_ids||[]).join(', '))}${field('Vigencia hasta (opcional)','ob_fecha',o.vigencia_hasta||'','date')}${button('Guardar',`saveObservation(${JSON.stringify(r)},${i===null?'null':i})`,'primary')} ${i!==null?button('Eliminar',`deleteObservation(${JSON.stringify(r)},${i})`,'danger'):''}`)}
function saveObservation(r,i){if(!v('ob_texto').trim())return alert('Escribe la observación');let s=student(r);s.observaciones_planificacion ||= [];let o={tipo:v('ob_tipo'),texto:v('ob_texto').trim(),cursos_ids:v('ob_cursos').split(',').map(x=>x.trim()).filter(Boolean),vigencia_hasta:v('ob_fecha')||null,fecha_registro:date()};if(i===null)s.observaciones_planificacion.push(o);else s.observaciones_planificacion[i]=o;logChange('observacion_estudiante',r,'Observación guardada');closeModal();openStudent(r)}

function saveTeacher(id){let a=v('t_last').trim(),n=v('t_first').trim(),mail=v('t_email').trim();if(!a||!n)return alert('Ingresa nombres y apellidos');let t=id?teachers().find(x=>x.id===id):{id:'DOC-'+String(Math.max(0,...teachers().map(x=>Number(x.id?.match(/DOC-(\d+)/)?.[1])||0))+1).padStart(3,'0')};Object.assign(t,{apellidos:a,nombres:n,nombre_completo:a+', '+n,correo:mail,rut:v('t_rut').trim()||null});if(!id)db.profesores.push(t);logChange('profesor',t.id,id?'Ficha actualizada':'Profesor incorporado');closeModal();teachersPage()}
function coursesPage(){let plan=v('coursePlan')||'B',q=v('courseSearch')?.toLowerCase()||'';$('#screen').innerHTML=`<div class="card"><h3>Catálogo de actividades curriculares</h3>${row([field('Plan','coursePlan',plan,'text',[['B','Plan B'],['C','Plan C']]),field('Buscar','courseSearch',q)])}<div id="courseRows"></div></div>`;$('#coursePlan').onchange=fillCourses;$('#courseSearch').oninput=fillCourses;fillCourses()}
function fillCourses(){let plan=v('coursePlan'),q=v('courseSearch').toLowerCase(),cc=Object.values(db.planes_estudio[plan].cursos).filter(c=>(c.sigla+' '+c.nombre).toLowerCase().includes(q));$('#courseRows').innerHTML=`<div class="tablewrap"><table class="tbl"><thead><tr><th>Sigla</th><th>Nombre</th><th>Nivel / Año</th><th>Créditos</th><th>IA</th><th></th></tr></thead><tbody>${cc.map(c=>`<tr><td>${esc(c.sigla)}</td><td>${esc(c.nombre)}</td><td>${esc(c.nivel)} / ${esc(c.anio)}</td><td>${esc(c.creditos)}</td><td>${(c.indicadores_aprendizaje_ids||[]).length}</td><td>${button('Ficha',`editCourse(${JSON.stringify(c.id)})`,'small')} ${button('Estudiantes',`courseStudents(${JSON.stringify(c.id)})`,'small')}</td></tr>`).join('')}</tbody></table></div>`}
function courseStudents(id){let c=course(id);if(!c)return;let ss=studentList().filter(s=>s.plan_estudio===c.plan_id&&cmSituationMatches(s,'activos')),groups={aprobado:[],en_curso:[],pendiente:[],reprobado:[]};for(let s of ss){let st=s.avance_curricular?.[id]?.estado||'pendiente';(groups[st]||groups.pendiente).push(s)}modal(`<div class="row"><h3>${esc(c.sigla)} · ${esc(c.nombre)} (Plan ${esc(c.plan_id)})</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted">Solamente estudiantes del Plan ${esc(c.plan_id)}. Pendiente incluye cursos sin estado registrado.</p><div class="grid">${Object.entries(groups).map(([k,v])=>metric(k.replace('_',' '),v.length)).join('')}</div>${Object.entries(groups).map(([k,v])=>`<details ${k==='en_curso'?'open':''}><summary>${esc(k.replace('_',' '))} · ${v.length}</summary><div class="course-members"><table class="tbl">${v.map(s=>`<tr><td>${esc(s.nombre_completo)}</td><td>${button('Ver perfil',`closeModal();openStudent(${JSON.stringify(s.rut)})`,'small')}</td></tr>`).join('')||'<tr><td>Sin estudiantes</td></tr>'}</table></div></details>`).join('')}`)}
function editCourse(id){let c=course(id);modal(`<div class="row"><h3>${esc(id)} · ${esc(c.nombre)}</h3>${button('Cerrar','closeModal()','small')}</div>${row([field('Nombre','c_name',c.nombre),field('Nivel curricular (100–1000)','c_level',c.nivel,'number'),field('Año','c_year',c.anio,'number'),field('Créditos','c_credits',c.creditos,'number')])}${field('Descriptor','c_desc',c.descriptor||'','textarea')}${field('Prerrequisitos (IDs separados por coma)','c_pre',(c.prerrequisitos_ids||[]).join(', '))}${field('Mínimo de créditos aprobados (opcional)','c_mincredits',c.prerrequisito_creditos_aprobados??'','number')}${field('Equivalencias (IDs separados por coma)','c_eq',(c.equivalencias||[]).join(', '))}<p class="small muted">Puedes combinar cursos prerrequisito y un mínimo de créditos aprobados, o utilizar únicamente una de estas condiciones. No equivale a créditos inscritos.</p><div class="notice small">IA vinculados: ${esc((c.indicadores_aprendizaje_ids||[]).join(', ')||'Pendientes')}.</div>${button('Guardar cambios',`saveCourse(${JSON.stringify(id)})`,'primary')}`)}
function saveCourse(id){let c=course(id),pr=v('c_pre').split(',').map(x=>x.trim()).filter(Boolean),eq=v('c_eq').split(',').map(x=>x.trim()).filter(Boolean),raw=v('c_mincredits').trim(),credits=raw===''?null:Number(raw);if(raw!==''&&(!Number.isInteger(credits)||credits<0))return alert('Los créditos mínimos deben ser un número entero no negativo');if([...pr,...eq].some(x=>!course(x)))return alert('Hay referencias a cursos que no existen en la base. Corrige antes de guardar.');Object.assign(c,{nombre:v('c_name').trim(),nivel:+v('c_level'),anio:+v('c_year'),creditos:+v('c_credits'),descriptor:v('c_desc').trim()||null,prerrequisitos_ids:pr,prerrequisito_creditos_aprobados:credits,equivalencias:eq});logChange('curso',id,'Datos curriculares y prerrequisitos por créditos actualizados');closeModal();coursesPage()}
function cmSituationMatches(s,status){let z=s.situacion_academica||'activo';return status==='todos'||!status||(status==='activos'&&!['retiro_temporal','retiro_definitivo','titulado'].includes(z))||z===status}
function cmNewStudent(rut,name,plan){return {rut,nombre_completo:name,plan_estudio:plan,correo:null,ingreso:{},situacion_academica:'activo',retiros:[],titulacion:{anio:null,fecha:null},historial_situaciones:[],avance_curricular:{},seguimiento_perfil_egreso:{hitos:{HITO_400:{rendiciones:[]},HITO_800:{rendiciones:[]},HITO_1000:{rendiciones:[]}}}}}
function cmSituationDetails(s){let z=s.situacion_academica||'activo';if(z==='retiro_temporal')return 'Retiro temporal: '+(s.retiro_temporal_actual?.anio||'—')+' · semestre '+(s.retiro_temporal_actual?.semestre||'—')+'. Inscripciones suspendidas para ese período.';if(z==='retiro_definitivo')return 'Retiro definitivo: registro histórico conservado, excluido de listados activos.';if(z==='titulado')return 'Titulado'+(s.titulacion?.anio?' en '+s.titulacion.anio:'')+'. Plan marcado como aprobado; avance original respaldado. Los resultados HITO y EIF se conservan íntegros.';return ''}
function cmStatusDialog(r){let s=student(r);modal(`<div class="row"><h3>Situación académica · ${esc(s.nombre_completo)}</h3>${button('Cerrar','closeModal()','small')}</div>${field('Acción','st_action',s.situacion_academica||'activo','text',[['activo','Activo / Reincorporado'],['retiro_temporal','Retiro temporal'],['retiro_definitivo','Retiro definitivo'],['titulado','Titulado']])}${row([field('Año del retiro / titulación','st_year',s.retiro_temporal_actual?.anio||s.titulacion?.anio||new Date().getFullYear(),'number'),field('Semestre de retiro temporal','st_sem',s.retiro_temporal_actual?.semestre||1,'text',[['1','Primero'],['2','Segundo']])])}${field('Fecha de registro','st_date',date(),'date')}<p class="small muted">El retiro definitivo no borra la ficha. Al titularse, se marca completa la malla y se respalda el avance previo; se conservan íntegros los resultados individuales HITO y EIF, sin alterarlos.</p>${button('Aplicar cambio de situación',`cmApplyStatus(${JSON.stringify(r)})`,'primary')}`)}
function cmApprovedCredits(s){return Object.values(s.avance_curricular||{}).filter(x=>x.estado==='aprobado').reduce((a,b)=>a+(Number(b.creditos)||0),0)}
function cmApplyStatus(r){let s=student(r),z=v('st_action'),year=Number(v('st_year')),sem=Number(v('st_sem')),when=v('st_date');if(!Number.isInteger(year)||year<1900||year>2200)return alert('Ingresa un año válido');if(z==='titulado'&&!confirm('Se marcarán como aprobados todos los cursos de la malla de su plan y se respaldará el avance previo. ¿Continuar?'))return;if(z==='retiro_definitivo'&&!confirm('El estudiante dejará de aparecer como activo, pero su perfil e historial no se eliminarán. ¿Continuar?'))return;let previous=s.situacion_academica||'activo';s.situacion_academica=z;s.fecha_situacion_academica=when;s.historial_situaciones ||= [];s.historial_situaciones.push({situacion_anterior:previous,situacion:z,fecha:when,anio:year,semestre:z==='retiro_temporal'?sem:null});if(z==='retiro_temporal'){s.retiros ||= [];let o={tipo:'temporal',anio:year,semestre:sem,fecha_registro:when};s.retiros.push(o);s.retiro_temporal_actual=o;s.matricula_suspendida_periodos ||= [];if(!s.matricula_suspendida_periodos.some(p=>p.anio===year&&p.semestre===sem))s.matricula_suspendida_periodos.push({anio:year,semestre:sem});s.avance_antes_retiro_temporal ||= structuredClone(s.avance_curricular||{})}else if(z==='retiro_definitivo'){s.retiros ||= [];s.retiros.push({tipo:'definitivo',fecha_registro:when,anio:year});s.fecha_retiro_definitivo=when}else if(z==='titulado'){if(!s.avance_curricular_pre_titulacion)s.avance_curricular_pre_titulacion=structuredClone(s.avance_curricular||{});for(let c of courseList().filter(c=>c.plan_id===s.plan_estudio)){s.avance_curricular[c.id]={...(s.avance_curricular[c.id]||{}),estado:'aprobado',creditos:c.creditos}}for(let a of Object.values(s.avance_curricular||{}))a.estado='aprobado';s.titulacion={anio:year,fecha:when};}else if(z==='activo'){s.retiro_temporal_actual=null}s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=cmApprovedCredits(s);s.fecha_ultima_actualizacion=when;logChange('situacion_estudiante',r,previous+' → '+z);closeModal();openStudent(r);toast('Situación actualizada')}

function cmBulkGraduates(){modal(`<div class="row"><h3>Incorporar titulados desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">Pega la tabla con encabezados. Columnas admitidas: RUT, nombre, plan, año de ingreso, semestre de ingreso, año de titulación y correo. Cada estudiante debe identificarse con RUT. No se modifica ningún registro ya existente sin confirmación.</p><textarea id="grad_paste" rows="11" placeholder="rut\tnombre\tplan\tanio_ingreso\tsemestre_ingreso\tanio_titulacion\tcorreo"></textarea><div class="bar">${button('Revisar importación',`cmPreviewGraduates()`,'primary')}</div><div id="grad_preview"></div>`)}
let cmGradDraft=[];
function cmNormalizeHeader(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}

function analytics(){let es=studentList(),b=es.filter(s=>s.plan_estudio==='B'),c=es.filter(s=>s.plan_estudio==='C'),h=db.resultados_hito.rendiciones,e=db.resultados_eif.rendiciones;$('#screen').innerHTML=`<div class="grid">${metric('Estudiantes Plan B',b.length)}${metric('Estudiantes Plan C',c.length)}${metric('Rendiciones HITO',h.length)}${metric('Rendiciones EIF',e.length)}</div><div class="card"><h3>Avance curricular por plan</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Plan</th><th>Aprobados</th><th>En curso</th><th>Pendientes</th><th>Reprobados</th><th>Estudiantes</th></tr></thead><tbody>${[['B',b],['C',c]].map(([p,ss])=>{let counts={aprobado:0,en_curso:0,pendiente:0,reprobado:0};ss.forEach(s=>Object.entries(countStates(s)).forEach(([k,n])=>counts[k]+=n));return `<tr><td>${p}</td><td>${counts.aprobado}</td><td>${counts.en_curso}</td><td>${counts.pendiente}</td><td>${counts.reprobado}</td><td>${ss.length}</td></tr>`}).join('')}</tbody></table></div><div class="bar" style="margin-top:12px">${button('Descargar avance agregado (CSV)','exportProgressSummary()')}</div></div><div class="card"><h3>Comparación de resultados HITO y EIF</h3><p class="muted small">Se comparan exclusivamente niveles de logro (%), tras convertir las escalas originales.</p>${row([field('Tipo','a_kind','hito','text',[['hito','HITO'],['eif','EIF']]),field('Año (vacío = todos)','a_year',''),field('HITO / Curso (opcional)','a_type',''),field('RA o IA (opcional)','a_code',''),field('Escala exacta','a_scale','')])}<div class="bar">${button('Comparar','compareResults()','primary')}${button('Descargar resultados individuales (CSV)','exportResultsCSV()')}${button('Exportar todos los resultados EIF a Excel',"cmExportExcel('eif')")}${button('Exportar todos los resultados HITO a Excel',"cmExportExcel('hito')")}</div><div id="comparison" style="margin-top:13px"></div></div>`}
function resultFiltered(){let kind=v('a_kind'),arr=db[kind==='eif'?'resultados_eif':'resultados_hito'].rendiciones,year=v('a_year'),type=v('a_type').toLowerCase(),code=v('a_code'),scale=v('a_scale');return arr.filter(r=>(!year||String(r.anio_rendicion)===year)&&(!type||String(r.curso_id||r.tipo_hito||'').toLowerCase().includes(type))&&(!scale||String(r.escala)===scale)).flatMap(r=>entries(r.puntajes_por_ia||r.puntajes_por_ra).filter(([k])=>!code||k===code).map(([k,value])=>({anio:r.anio_rendicion,codigo:k,value:Number(value),escala:String(r.escala||''),tipo:r.curso_id||r.tipo_hito,estudiante:r.estudiante_ref,cohorte:student(r.estudiante_ref)?.ingreso?.anio||''}))).filter(r=>Number.isFinite(r.value))}
function compareResults(){let rr=resultFiltered(),scales=[...new Set(rr.map(r=>r.escala))];if(scales.length>1){$('#comparison').innerHTML='<div class="notice warning">Hay resultados con distintas escalas. Filtra una escala exacta antes de comparar.</div>';return}let groups={};for(let r of rr){let k=r.anio+'|'+r.codigo;groups[k]||=[];groups[k].push(r)}$('#comparison').innerHTML=`<div class="muted">${rr.length} puntajes correspondientes a ${Object.keys(groups).length} grupos año × RA/IA. Media descriptiva sin normalización.</div><div class="tablewrap"><table class="tbl"><tr><th>Año</th><th>RA / IA</th><th>N</th><th>Promedio</th><th>Escala</th></tr>${entries(groups).sort().map(([k,vv])=>{let z=stats(vv);return `<tr><td>${esc(k.split('|')[0])}</td><td>${esc(k.split('|')[1])}</td><td>${z.n}</td><td>${z.mean?.toFixed(2)||'—'}</td><td>${esc(scales[0]||'No indicada')}</td></tr>`}).join('')}</table></div>`}
function csv(rows){const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download(new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Castellano_Maestro_reporte.csv')}
function exportProgressSummary(){let rr=[['Plan','Estudiantes','Aprobados','En curso','Pendientes','Reprobados']];for(let p of ['B','C']){let ss=studentList().filter(s=>s.plan_estudio===p),z={aprobado:0,en_curso:0,pendiente:0,reprobado:0};ss.forEach(s=>entries(countStates(s)).forEach(([k,n])=>z[k]+=n));rr.push([p,ss.length,z.aprobado,z.en_curso,z.pendiente,z.reprobado])}csv(rr)}
function exportResultsCSV(){let rr=resultFiltered();csv([['Año','Tipo / Curso','RA / IA','Puntaje','Escala','Cohorte','RUT estudiante'],...rr.map(x=>[x.anio,x.tipo,x.codigo,x.value,x.escala,x.cohorte,x.estudiante])]);toast('Reporte individual generado. Manténlo bajo acceso restringido.')}
function validate(){let errors=[],warnings=[],courseids=new Set(courseList().map(c=>c.id)),ras=new Set(Object.keys(db.perfil_egreso.resultados_aprendizaje||{})),ias=new Set(Object.keys(db.perfil_egreso.indicadores_aprendizaje||{}));for(let c of courseList()){for(let id of c.equivalencias||[])if(!courseids.has(id))warnings.push(`${c.id}: equivalencia sin ficha ${id}`);for(let id of c.prerrequisitos_ids||[])if(!courseids.has(id))warnings.push(`${c.id}: prerrequisito sin ficha ${id}`);for(let id of c.indicadores_aprendizaje_ids||[])if(!ias.has(id))errors.push(`${c.id}: IA desconocido ${id}`)}for(let s of studentList()){if(!['B','C'].includes(s.plan_estudio))errors.push(`${s.rut}: plan inválido`);for(let [id,a] of entries(s.avance_curricular))if(!['aprobado','en_curso','pendiente','reprobado'].includes(a.estado))errors.push(`${s.rut}: estado desconocido ${id}`)}for(let [type,key,valid] of [['EIF','resultados_eif',ias],['HITO','resultados_hito',ras]])for(let r of db[key].rendiciones){if(!student(r.estudiante_ref))errors.push(`${type}: estudiante inexistente ${r.estudiante_ref}`);if(type==='EIF'&&!course(r.curso_id))errors.push(`EIF: curso inexistente ${r.curso_id}`);if(type==='HITO'&&!['HITO_400','HITO_800','HITO_1000'].includes(r.tipo_hito))errors.push('HITO: tipo inválido');for(let id of Object.keys(r.puntajes_por_ia||r.puntajes_por_ra||{}))if(!valid.has(id))errors.push(`${type}: código no reconocido ${id}`)}return {errors,warnings}}
function settings(){let x=validate();$('#screen').innerHTML=`<div class="grid">${metric('Errores de referencia',x.errors.length)}${metric('Advertencias',x.warnings.length)}${metric('Cambios registrados',(db.historial_cambios||[]).length)}</div><div class="card"><h3>Validación de integridad</h3>${x.errors.length?`<div class="notice warning">${x.errors.slice(0,40).map(esc).join('<br>')}</div>`:'<div class="notice">Sin errores estructurales detectados por esta validación básica.</div>'}${x.warnings.length?`<details><summary>${x.warnings.length} advertencias de referencias</summary><div class="scroll small">${x.warnings.map(s=>`<p>${esc(s)}</p>`).join('')}</div></details>`:''}</div><div class="card"><h3>Exportación y respaldo</h3><p>Guarda una copia actualizada del JSON para continuar luego. El archivo HTML no guarda automáticamente cambios entre sesiones.</p>${button('Exportar nueva versión JSON','exportJSON()','primary')} ${button('Descargar historial de cambios (CSV)','exportHistory()')}<div class="notice warning">La descarga puede contener RUT y resultados académicos. No publiques el JSON ni los CSV individuales en GitHub Pages o repositorios públicos.</div></div><div class="card"><h3>Historial de modificaciones de este archivo</h3><div class="scroll"><table class="tbl"><tr><th>Fecha</th><th>Tipo</th><th>Referencia</th><th>Detalle</th></tr>${(db.historial_cambios||[]).slice(-80).reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.tipo)}</td><td>${esc(x.referencia)}</td><td>${esc(x.detalle)}</td></tr>`).join('')}</table></div></div>`}
function exportHistory(){csv([['Fecha','Tipo','Referencia','Detalle'],...(db.historial_cambios||[]).map(x=>[x.fecha,x.tipo,x.referencia,x.detalle])])}

/* Castellano Maestro v3: evaluaciones de columnas múltiples, logro y selector masivo */
let cmColumns=[],cmChosen=new Set(),cmSelectorKind='';
function cmBounds(str){let m=String(str||'').trim().replace(/,/g,'.').match(/^\s*(-?\d+(?:\.\d+)?)\s*(?:-|a|–|—|:)\s*(-?\d+(?:\.\d+)?)\s*$/i);if(!m)return null;let lo=Number(m[1]),hi=Number(m[2]);return hi>lo?{lo,hi}:null}
function cmPct(score,scale){let b=cmBounds(scale);return b&&Number.isFinite(Number(score))?(Number(score)-b.lo)/(b.hi-b.lo)*100:null}
function cmMean(a){let xs=a.filter(x=>x!==''&&x!==null&&x!==undefined&&Number.isFinite(Number(x))).map(Number);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}
function cmScores(r,kind){let out={},key=kind==='eif'?'puntajes_por_ia':'puntajes_por_ra',multi=kind==='eif'?'desglose_por_ia':'desglose_por_ra';for(let [c,val] of Object.entries(r[multi]||{})){out[c]=Array.isArray(val)?val:[]}for(let [c,val] of Object.entries(r[key]||{}))if(!out[c]?.length)out[c]=[val];return out}
function cmScale(r,c){return r.escalas_por_codigo?.[c]||r.escala||''}
function cmSourceRows(kind){let arr=db[kind==='eif'?'resultados_eif':'resultados_hito'].rendiciones;return arr}
function cmGetContext(kind){let eif=kind==='eif';return {eif,type:v('batch_type'),year:Number(v('batch_year')),semester:eif?Number(v('batch_sem')):null,courseid:eif?v('batch_type'):v('batch_course')}}
function prepareBatch(kind){let ctx=cmGetContext(kind),c=course(ctx.courseid);if(!Number.isInteger(ctx.year)||ctx.year<1900||ctx.year>2200)return alert('Año inválido');if(!c)return alert('Selecciona una asignatura válida');batchDraft={};batchCodes=[];cmColumns=[];let inst=kind==='hito'?cmInstrument(ctx):null;let rs=cmSourceRows(kind).filter(r=>r.anio_rendicion===ctx.year&&(ctx.eif?r.curso_id===ctx.courseid&&Number(r.semestre_rendicion)===ctx.semester:r.tipo_hito===ctx.type&&r.curso_grupo_id===ctx.courseid));let previous=rs.length?rs:cmSourceRows(kind).filter(r=>r.anio_rendicion===ctx.year&&(ctx.eif?r.curso_id===ctx.courseid&&Number(r.semestre_rendicion)===ctx.semester:r.tipo_hito===ctx.type));let historical=[...new Set(previous.map(r=>r.estudiante_ref))];let current=studentList().filter(s=>s.plan_estudio===c.plan_id&&s.avance_curricular?.[ctx.courseid]?.estado==='en_curso').map(s=>s.rut);batchMembers=[...new Set([...(inst?.estudiantes||[]),...historical,...(inst?[]:current)])].filter(rut=>student(rut)?.plan_estudio===c.plan_id).sort((a,b)=>(student(a)?.nombre_completo||'').localeCompare(student(b)?.nombre_completo||'','es'));renderBatch(kind)}
function renderBatch(kind){let x=cmGetContext(kind),c=course(x.courseid);if(!c)return;let all=x.eif?(db.resultados_eif.catalogo_por_curso[x.type]?.ia_evaluables_ids||c.indicadores_aprendizaje_ids||[]):Object.keys(db.perfil_egreso.resultados_aprendizaje);let rs=cmSourceRows(kind).filter(r=>r.anio_rendicion===x.year&&(x.eif?r.curso_id===x.courseid&&Number(r.semestre_rendicion)===x.semester:r.tipo_hito===x.type));let savedForView=!x.eif?cmInstrument(x):null;let base=rs[0]||{},scale=base.escala||'1-7';$('#batchArea').innerHTML=`<div class="card"><div class="row"><h3>${esc(x.eif?c.nombre:x.type)} · ${x.year}${x.eif?' · Semestre '+x.semester:''}</h3><span class="tag">${batchMembers.length} estudiantes</span></div><div class="notice">Los puntajes se ingresan por columna; cada ${x.eif?'IA':'RA'} tiene una única escala para todo el grupo. El promedio simple se convierte a porcentaje de logro. <b>La conversión es (puntaje − mínimo) / (máximo − mínimo) × 100.</b></div><div class="bar">${button('Seleccionar estudiantes…',`cmOpenStudents('${kind}')`,'primary')}${button('Elegir RA/IA',`chooseBatchCodes('${kind}')`)}${button('Añadir columna del mismo RA/IA',`cmOpenAddColumn('${kind}')`)}${!x.eif?button('Configurar instrumento',"cmOpenInstrument()",'primary'):''}${!x.eif?button('Guardar instrumento sin puntajes',"cmSaveInstrument()") :''}${!x.eif?button('Descargar plantilla Excel',"cmInstrumentExcel()") :''}${button('Pegar puntajes desde Excel',`cmOpenPaste('${kind}')`)}${button('Exportar resultados a Excel',`cmExportExcel('${kind}')`)}</div><div class="columns">${field('Escala inicial (ej. 1-7 o 0-100)','batch_scale',scale)}${field('Versión del instrumento','batch_version',savedForView?.version_instrumento||base.version_instrumento||'')}${field('Instancia','batch_attempt',savedForView?.instancia||base.instancia||1,'number')}</div><div id="cmScales"></div><div id="batchTable"></div><div class="bar" style="margin-top:12px">${button('Guardar todos los resultados',`saveBatch('${kind}')`,'primary')}</div></div>`;
if(!cmColumns.length){let savedInst=!x.eif?cmInstrument(x):null;if(savedInst?.items?.length){cmColumns=savedInst.items.flatMap(item=>Array.from({length:item.cantidad},(_,i)=>({code:item.ra,n:i+1})));}else{let used=[...new Set(rs.flatMap(r=>Object.keys(cmScores(r,kind))))].filter(q=>all.includes(q));batchCodes=used.length?used:all.slice();cmColumns=batchCodes.flatMap(code=>{let mx=Math.max(1,...rs.map(r=>(cmScores(r,kind)[code]||[]).length));return Array.from({length:mx},(_,i)=>({code,n:i+1}))})}}else cmColumns=cmColumns.filter(c=>all.includes(c.code));batchCodes=[...new Set(cmColumns.map(c=>c.code))];drawBatchTable(kind)}
function cmOpenStudents(kind){captureBatchDraft();let ctx=cmGetContext(kind),c=course(ctx.courseid);cmSelectorKind=kind;cmChosen=new Set(batchMembers);let ss=studentList().filter(s=>s.plan_estudio===c.plan_id);let yrs=[...new Set(ss.map(s=>String(s.ingreso?.anio||'')).filter(Boolean))].sort();modal(`<div class="row"><h3>Seleccionar estudiantes · Plan ${esc(c.plan_id)}</h3>${button('Cerrar','closeModal()','small')}</div><div class="columns">${field('Buscar nombre o RUT','cmSearch','')}${field('Año de ingreso','cmYear','','text',[['','Todos'],...yrs.map(y=>[y,y])])}${field('Estado en la asignatura','cmStatus','','text',[['','Todos'],['en_curso','En curso'],['aprobado','Aprobado'],['pendiente','Pendiente'],['reprobado','Reprobado']])}</div><div class="bar">${button('Seleccionar visibles','cmSelectVisible()')}${button('Desmarcar visibles','cmDeselectVisible()')}<span id="cmCount" class="tag"></span></div><div id="cmCards" class="cmCards"></div><div class="bar" style="margin-top:12px">${button('Incorporar seleccionados',`cmApplyStudents('${kind}')`,'primary')}</div>`);['cmSearch','cmYear','cmStatus'].forEach(id=>$('#'+id).addEventListener('input',cmDrawStudents));cmDrawStudents()}
function cmVisibleStudents(){let ctx=cmGetContext(cmSelectorKind),c=course(ctx.courseid),q=(v('cmSearch')||'').toLocaleLowerCase('es'),yr=v('cmYear'),st=v('cmStatus');return studentList().filter(s=>s.plan_estudio===c.plan_id&&(!yr||String(s.ingreso?.anio)===yr)&&(!st||s.avance_curricular?.[ctx.courseid]?.estado===st)&&(!q||(s.nombre_completo+' '+s.rut).toLocaleLowerCase('es').includes(q))).sort((a,b)=>a.nombre_completo.localeCompare(b.nombre_completo,'es'))}
function cmDrawStudents(){let ss=cmVisibleStudents();$('#cmCards').innerHTML=ss.map(s=>`<label class="cmStudent"><input type="checkbox" class="cmPick" data-rut="${esc(s.rut)}" ${cmChosen.has(s.rut)?'checked':''}><div><b>${esc(s.nombre_completo)}</b><div class="small muted">${esc(s.rut)} · Ingreso ${esc(s.ingreso?.anio||'—')} · ${esc(s.avance_curricular?.[cmGetContext(cmSelectorKind).courseid]?.estado||'sin registro')}</div></div></label>`).join('')||'<p class="muted">No se encontraron estudiantes.</p>';document.querySelectorAll('.cmPick').forEach(el=>el.onchange=()=>{el.checked?cmChosen.add(el.dataset.rut):cmChosen.delete(el.dataset.rut);cmUpdateCount()});cmUpdateCount()}
function cmUpdateCount(){$('#cmCount').textContent=cmChosen.size+' seleccionados'}
function cmSelectVisible(){cmVisibleStudents().forEach(s=>cmChosen.add(s.rut));cmDrawStudents()}
function cmDeselectVisible(){cmVisibleStudents().forEach(s=>cmChosen.delete(s.rut));cmDrawStudents()}
function cmApplyStudents(kind){captureBatchDraft();batchMembers=[...cmChosen].sort((a,b)=>(student(a)?.nombre_completo||'').localeCompare(student(b)?.nombre_completo||'','es'));closeModal();drawBatchTable(kind)}
function chooseBatchCodes(kind){captureBatchDraft();let x=cmGetContext(kind),codes=x.eif?(db.resultados_eif.catalogo_por_curso[x.type]?.ia_evaluables_ids||course(x.type)?.indicadores_aprendizaje_ids||[]):Object.keys(db.perfil_egreso.resultados_aprendizaje);let selected=new Set(cmColumns.map(x=>x.code));modal(`<div class="row"><h3>Seleccionar ${x.eif?'IA':'RA'}</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">Cada código seleccionado se muestra al menos una vez. Puedes repetirlo desde «Añadir columna».</p><div class="scroll">${codes.map(code=>`<label style="display:block;padding:8px"><input class="batch-code" type="checkbox" value="${esc(code)}" ${selected.has(code)?'checked':''}> <b>${esc(code)}</b> · ${esc((x.eif?db.perfil_egreso.indicadores_aprendizaje[code]:db.perfil_egreso.resultados_aprendizaje[code])?.descripcion||'')}</label>`).join('')}</div>${button('Aplicar',`cmApplyCodes('${kind}')`,'primary')}`)}
function cmApplyCodes(kind){let chosen=new Set([...document.querySelectorAll('.batch-code:checked')].map(x=>x.value));cmColumns=cmColumns.filter(c=>chosen.has(c.code));for(let code of chosen)if(!cmColumns.some(c=>c.code===code))cmColumns.push({code,n:1});batchCodes=[...chosen];closeModal();drawBatchTable(kind)}
function cmOpenAddColumn(kind){captureBatchDraft();if(!cmColumns.length)return alert('Primero selecciona RA o IA');let codes=[...new Set(cmColumns.map(c=>c.code))];modal(`<h3>Añadir una columna</h3>${field('Resultado de aprendizaje / Indicador','cmAddCode',codes[0],'text',codes.map(x=>[x,x]))}<p>Se conservarán todas las columnas del mismo código y se calculará su promedio simple.</p><div class="bar">${button('Añadir',`cmAddColumn('${kind}')`,'primary')}${button('Cancelar','closeModal()')}</div>`)}
function cmAddColumn(kind){let code=v('cmAddCode'),mx=Math.max(0,...cmColumns.filter(c=>c.code===code).map(c=>c.n));cmColumns.push({code,n:mx+1});closeModal();drawBatchTable(kind)}
function cmDropColumn(kind,code,n){captureBatchDraft();cmColumns=cmColumns.filter(c=>!(c.code===code&&c.n===n));drawBatchTable(kind)}
function captureBatchDraft(){document.querySelectorAll('.batch-score').forEach(el=>{batchDraft[el.dataset.student+'|'+el.dataset.code+'|'+el.dataset.col]=el.value})}
function cmColumnVal(r,kind,code,n,rut){let k=rut+'|'+code+'|'+n;if(Object.prototype.hasOwnProperty.call(batchDraft,k))return batchDraft[k];let vals=cmScores(r||{},kind)[code]||[];return vals[n-1]??''}
function drawBatchTable(kind){let x=cmGetContext(kind),rs=cmSourceRows(kind),codes=[...new Set(cmColumns.map(c=>c.code))],c=course(x.courseid);if(!$('#batchTable'))return;let matching=rs.filter(r=>r.anio_rendicion===x.year&&(x.eif?r.curso_id===x.courseid&&Number(r.semestre_rendicion)===x.semester:r.tipo_hito===x.type));let existing=new Map(matching.map(r=>[r.estudiante_ref,r]));let scalebox=$('#cmScales');let prior={};scalebox?.querySelectorAll('.cm-scale').forEach(el=>prior[el.dataset.code]=el.value);let fallback=matching[0]?.escala||v('batch_scale')||'1-7';scalebox.innerHTML='<h4>Escala por '+(x.eif?'IA':'RA')+' (una para todos los estudiantes)</h4><div class="cmScaleGrid">'+codes.map(code=>{let configured=!x.eif?cmInstrument(x)?.items?.find(z=>z.ra===code):null;let sc=prior[code]||(configured?'0-'+configured.maximo:null)||matching.find(r=>cmScale(r,code))?.escalas_por_codigo?.[code]||fallback;return `<label><b>${esc(code)}</b><input class="cm-scale" data-code="${esc(code)}" value="${esc(sc)}" placeholder="1-7"></label>`}).join('')+'</div><p class="small muted">Ejemplos: 1-7, 0-100, 0-4. El límite inferior representa 0% y el superior 100%.</p>';scalebox.querySelectorAll('.cm-scale').forEach(el=>el.oninput=()=>cmRefreshPreview(kind));let heads=cmColumns.map(col=>`<th><span>${esc(col.code)} · ${col.n}</span><div>${button('×',`cmDropColumn('${kind}',${JSON.stringify(col.code)},${col.n})`,'small')}</div></th>`).join('');let rows=batchMembers.map(rut=>{let r=existing.get(rut);return `<tr><td><b>${esc(student(rut)?.nombre_completo||rut)}</b><div class="small muted">${esc(rut)}</div></td>${cmColumns.map(col=>`<td><input class="batch-score" type="number" step="any" data-student="${esc(rut)}" data-code="${esc(col.code)}" data-col="${col.n}" value="${esc(cmColumnVal(r,kind,col.code,col.n,rut))}"></td>`).join('')}${codes.map(code=>`<td class="cm-preview" data-student="${esc(rut)}" data-code="${esc(code)}">—</td>`).join('')}</tr>`}).join('');$('#batchTable').innerHTML=cmColumns.length?`<div class="sheet"><table><thead><tr><th>Estudiante</th>${heads}${codes.map(c=>`<th>${esc(c)}<div>Logro %</div></th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="20">Selecciona estudiantes para comenzar.</td></tr>'}</tbody></table></div>`:'<div class="notice warning">Selecciona al menos un RA / IA.</div>';document.querySelectorAll('.batch-score').forEach(el=>el.addEventListener('input',()=>cmRefreshPreview(kind)));cmRefreshPreview(kind)}
function cmRefreshPreview(kind){let scales=Object.fromEntries([...document.querySelectorAll('.cm-scale')].map(el=>[el.dataset.code,el.value]));document.querySelectorAll('.cm-preview').forEach(td=>{let cells=[...document.querySelectorAll('.batch-score')].filter(el=>el.dataset.student===td.dataset.student&&el.dataset.code===td.dataset.code&&el.value.trim()!=='');let nums=cells.map(el=>Number(el.value)),mean=cmMean(nums),pct=mean===null?null:cmPct(mean,scales[td.dataset.code]);td.textContent=pct===null?'—':pct.toFixed(1)+' %';td.title=mean===null?'Sin datos':'Promedio: '+mean.toFixed(2)})}
function saveBatch(kind){if(kind==='hito')cmSaveInstrument();let x=cmGetContext(kind),c=course(x.courseid),scales={};for(let el of document.querySelectorAll('.cm-scale')){let b=cmBounds(el.value);if(!b)return alert('Escala inválida para '+el.dataset.code+'. Indica mínimo y máximo, por ejemplo 1-7');scales[el.dataset.code]=el.value.trim()}if(!cmColumns.length)return alert('Selecciona RA/IA');let attempt=Number(v('batch_attempt'));if(!Number.isInteger(attempt)||attempt<1)return alert('Instancia inválida');let records={};for(let el of document.querySelectorAll('.batch-score')){if(el.value.trim()==='')continue;let n=Number(el.value),b=cmBounds(scales[el.dataset.code]);if(!Number.isFinite(n)||n<b.lo||n>b.hi)return alert(`El puntaje de ${el.dataset.code} debe estar entre ${b.lo} y ${b.hi}`);let r=records[el.dataset.student] ||= {};let z=r[el.dataset.code] ||= [];z[Number(el.dataset.col)-1]=n}let ar=cmSourceRows(kind),count=0;for(let [rut,data] of Object.entries(records)){if(student(rut)?.plan_estudio!==c.plan_id)return alert('Estudiante de otro plan');let existing=ar.find(r=>r.estudiante_ref===rut&&r.anio_rendicion===x.year&&Number(r.instancia||1)===attempt&&(x.eif?r.curso_id===x.courseid&&Number(r.semestre_rendicion)===x.semester:r.tipo_hito===x.type&&(!r.curso_grupo_id||r.curso_grupo_id===x.courseid)));let r=existing||{id_rendicion:`${x.eif?'EIF':'HITO'}-${Date.now()}-${Math.random().toString(36).slice(2)}`,estudiante_ref:rut,anio_rendicion:x.year,instancia:attempt};let multi=x.eif?'desglose_por_ia':'desglose_por_ra',summary=x.eif?'puntajes_por_ia':'puntajes_por_ra',ach=x.eif?'logro_por_ia':'logro_por_ra';r[multi] ||= {};r[summary] ||= {};r[ach] ||= {};r.escalas_por_codigo ||= {};for(let [code,vals] of Object.entries(data)){let fixed=Array.from({length:cmColumns.filter(z=>z.code===code).length},(_,i)=>vals[i]??null);let mean=cmMean(fixed);if(mean===null)continue;r[multi][code]=fixed;r[summary][code]=mean;r[ach][code]=cmPct(mean,scales[code]);r.escalas_por_codigo[code]=scales[code]}if(x.eif){r.curso_id=x.courseid;r.semestre_rendicion=x.semester;r.ia_evaluados_ids=Object.keys(r[summary])}else{r.tipo_hito=x.type;r.curso_grupo_id=x.courseid;r.semestre_rendicion=null;r.ra_evaluados_ids=Object.keys(r[summary])}r.version_instrumento=v('batch_version')||null;r.escala=v('batch_scale')||'1-7';r.fecha_registro=date();if(!existing)ar.push(r);count++}if(!count)return alert('Ingresa al menos un puntaje');logChange('lote_'+kind,x.type,`${count} estudiantes · ${x.year}`);resultPage(kind);toast(count+' rendiciones guardadas con desgloses y porcentajes de logro. Exporta la base.')}

function cmOpenInstrument(){captureBatchDraft();let ctx=cmGetContext('hito'),saved=cmInstrument(ctx),all=Object.keys(db.perfil_egreso.resultados_aprendizaje||{});let entries=(saved?.items?.length?saved.items: [...new Set(cmColumns.map(z=>z.code))].map(ra=>({ra,cantidad:cmColumns.filter(z=>z.code===ra).length,maximo:Number(cmBounds(document.querySelector(`.cm-scale[data-code="${ra}"]`)?.value||'0-7')?.hi||7)})));let prev=new Map(entries.map(z=>[z.ra,z]));modal(`<div class="row"><h3>Configurar instrumento ${esc(ctx.type)} · ${ctx.year}</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted small">Selecciona los RA que evalúa el instrumento, número de ítems por RA y puntaje máximo de <b>cada ítem</b>. No necesitas registrar resultados para guardar esta configuración.</p><div class="columns">${field('Nombre o versión del instrumento','ins_version',saved?.version_instrumento||v('batch_version')||'')}${field('Instancia de rendición','ins_attempt',saved?.instancia||v('batch_attempt')||1,'number')}</div><div class="scroll"><table class="tbl"><thead><tr><th>RA</th><th>Evaluar</th><th>N.º de ítems</th><th>Máximo por ítem</th></tr></thead><tbody>${all.map(ra=>{let z=prev.get(ra);return `<tr><td><b>${esc(ra)}</b></td><td><input type="checkbox" class="ins-on" data-ra="${esc(ra)}" ${z?'checked':''}></td><td><input type="number" min="1" max="50" value="${z?.cantidad||1}" class="ins-num" data-ra="${esc(ra)}" style="width:80px"></td><td><input type="number" min="0.01" step="any" value="${z?.maximo||7}" class="ins-max" data-ra="${esc(ra)}" style="width:95px"></td></tr>`}).join('')}</tbody></table></div><div class="bar" style="margin-top:12px">${button('Aplicar configuración', 'cmApplyInstrument()', 'primary')}${button('Cancelar','closeModal()')}</div>`)}
function cmApplyInstrument(){
 captureBatchDraft();let ctx=cmGetContext('hito'),attempt=Number(v('ins_attempt')),version=v('ins_version')||'';
 if(!Number.isInteger(attempt)||attempt<1)return alert('La instancia debe ser un entero positivo.');
 let items=[];document.querySelectorAll('.ins-on:checked').forEach(el=>{let ra=el.dataset.ra,n=Number(document.querySelector(`.ins-num[data-ra="${ra}"]`).value),max=Number(document.querySelector(`.ins-max[data-ra="${ra}"]`).value);items.push({ra,cantidad:n,maximo:max})});
 if(!items.length)return alert('Selecciona al menos un RA');
 if(items.some(z=>!Number.isInteger(z.cantidad)||z.cantidad<1||z.cantidad>50||!Number.isFinite(z.maximo)||z.maximo<=0))return alert('Revisa cantidades y máximos de los ítems.');
 let list=db.resultados_hito.instrumentos ||= [];
 let ins=list.find(z=>z.tipo_hito===ctx.type&&Number(z.anio_rendicion)===ctx.year&&z.curso_grupo_id===ctx.courseid&&Number(z.instancia||1)===attempt);
 if(!ins){ins={tipo_hito:ctx.type,anio_rendicion:ctx.year,curso_grupo_id:ctx.courseid,instancia:attempt};list.push(ins)}
 Object.assign(ins,{items,estudiantes:[...batchMembers],version_instrumento:version,fecha_actualizacion:date(),estado:'configurado_sin_puntajes_o_parcial'});
 $('#batch_attempt').value=String(attempt);$('#batch_version').value=version;
 cmColumns=items.flatMap(z=>Array.from({length:z.cantidad},(_,i)=>({code:z.ra,n:i+1})));
 closeModal();drawBatchTable('hito');items.forEach(z=>{let el=[...document.querySelectorAll('.cm-scale')].find(e=>e.dataset.code===z.ra);if(el)el.value='0-'+z.maximo});cmRefreshPreview('hito');
 logChange('instrumento_hito',ctx.type,`Instrumento ${ctx.year} · ${ctx.courseid} · instancia ${attempt}`);
 toast('Instrumento configurado y guardado en la sesión. Descarga la plantilla y exporta la Base Maestra para conservarlo.');
}
function cmSaveInstrument(){
 let x=cmGetContext('hito'),c=course(x.courseid);if(!c)return alert('Selecciona un curso');if(!cmColumns.length)return alert('Configura al menos un RA.');
 let attempt=Number(v('batch_attempt'));if(!Number.isInteger(attempt)||attempt<1)return alert('Instancia inválida');
 let items=[];for(let ra of [...new Set(cmColumns.map(z=>z.code))]){let cnt=cmColumns.filter(z=>z.code===ra).length,el=[...document.querySelectorAll('.cm-scale')].find(e=>e.dataset.code===ra),sc=el?.value||'0-7',b=cmBounds(sc);if(!b||b.lo!==0){alert('La escala del RA '+ra+' debe ir de 0 al puntaje máximo por ítem.');return false}items.push({ra,cantidad:cnt,maximo:b.hi})}
 let list=db.resultados_hito.instrumentos ||= [],inst=list.find(z=>z.tipo_hito===x.type&&Number(z.anio_rendicion)===x.year&&z.curso_grupo_id===x.courseid&&Number(z.instancia||1)===attempt);
 if(!inst){inst={tipo_hito:x.type,anio_rendicion:x.year,curso_grupo_id:x.courseid,instancia:attempt};list.push(inst)}
 Object.assign(inst,{items,estudiantes:[...batchMembers],version_instrumento:v('batch_version')||'',fecha_actualizacion:date(),estado:'configurado_sin_puntajes_o_parcial'});
 logChange('instrumento_hito',x.type,`Configuración ${x.year} · ${x.courseid} · ${batchMembers.length} estudiantes`);

}

function cmPasteCleanRut(s){return String(s||'').replace(/[^0-9kK]/g,'').toUpperCase()}
function cmOpenPaste(kind){
 if(!cmColumns.length)return alert('Configura primero las columnas.');captureBatchDraft();
 modal(`<div class="row"><h3>Pegar resultados desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">En Excel, copia la tabla completa, incluidos encabezados y la fila PUNTAJE MÁXIMO. También se admite copiar solo las filas de estudiantes. Se coteja cada fila por RUT y cada columna por código e ítem, independientemente del orden. Las celdas vacías no se transforman en cero.</p><textarea id="cmPasteText" rows="9" style="width:100%;font-family:monospace" placeholder="Pega aquí las celdas copiadas desde Excel (Ctrl+V)"></textarea><div class="bar">${button('Revisar datos',`cmPreviewPaste('${kind}')`,'primary')}</div><div id="cmPastePreview"></div>`)
}
let cmPasteReady=[];
function cmPreviewPaste(kind){
 let raw=v('cmPasteText'),lines=raw.replace(/\r/g,'').split('\n').filter(q=>q.trim());
 if(!lines.length)return alert('Pega primero los datos copiados de Excel.');
 let grid=lines.map(line=>line.split('\t').map(t=>t.trim().replace(/^"|"$/g,'')));
 let first=grid[0].map(x=>x.toLowerCase()),hasHeader=first.some(x=>x.includes('rut'));
 let header=hasHeader?grid.shift():null;
 if(grid[0]?.[0]?.toUpperCase()==='PUNTAJE MÁXIMO')grid.shift();
 let cols=cmColumns.map(z=>({code:z.code,n:z.n,label:`${z.code} · Ítem ${z.n}`}));
 let keypos=header?header.findIndex(x=>/^rut$/i.test(x)):1;
 if(keypos<0)return alert('No se encuentra la columna RUT.');
 let mappings=[];
 if(header){for(let z of cols){let matching=header.map((h,i)=>({h,i})).filter(o=>o.h.includes(z.code)&&new RegExp('Ítem\\s*'+z.n+'(?:\\D|$)','i').test(o.h));if(matching.length!==1)return alert('No pude identificar inequívocamente la columna '+z.label+'; utiliza la plantilla descargada.');mappings.push(matching[0].i)}}else mappings=cols.map((_,i)=>i+4);
 let seen=new Set(),errors=[],valid=[];
 let context=cmGetContext(kind),c=course(context.courseid),scales=Object.fromEntries([...document.querySelectorAll('.cm-scale')].map(el=>[el.dataset.code,cmBounds(el.value)]));
 for(let [i,row] of grid.entries()){
  if(row.every(x=>x===''))continue;let rut=cmPasteCleanRut(row[keypos]),stu=studentList().find(s=>cmPasteCleanRut(s.rut)===rut);
  if(!rut){errors.push(`Fila ${i+1}: RUT vacío`);continue}if(seen.has(rut)){errors.push(`Fila ${i+1}: RUT repetido`);continue}seen.add(rut);
  if(!stu){errors.push(`Fila ${i+1}: RUT no encontrado`);continue}if(stu.plan_estudio!==c.plan_id){errors.push(`Fila ${i+1}: estudiante de otro plan`);continue}
  let values=[],bad=false;
  for(let [j,col] of cols.entries()){let val=(row[mappings[j]]||'').replace(',','.');if(val===''){values.push(null);continue}let num=Number(val),b=scales[col.code];if(!Number.isFinite(num)||!b||num<b.lo||num>b.hi){errors.push(`Fila ${i+1}, ${col.label}: puntaje ${val} fuera de escala`);bad=true;break}values.push(num)}
  if(!bad)valid.push({rut:stu.rut,nombre:stu.nombre_completo,values});
 }
 cmPasteReady=errors.length?[]:valid;
 $('#cmPastePreview').innerHTML=`<div class="notice ${errors.length?'warning':''}"><b>${valid.length} estudiantes listos</b> · ${errors.length} observaciones. ${errors.length?'Corrige antes de aplicar.':'Revisa antes de incorporar.'}</div>${errors.length?`<div class="scroll">${errors.map(e=>`<p>${esc(e)}</p>`).join('')}</div>`:''}<div class="tablewrap"><table class="tbl"><thead><tr><th>Estudiante</th><th>RUT</th><th>Valores válidos</th></tr></thead><tbody>${valid.slice(0,30).map(r=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.rut)}</td><td>${r.values.filter(x=>x!==null).length} / ${cols.length}</td></tr>`).join('')}</tbody></table></div>${!errors.length&&valid.length?button('Incorporar puntajes revisados',`cmApplyPaste('${kind}')`,'primary'):''}`;
}
function cmApplyPaste(kind){
 if(!cmPasteReady.length)return;
 captureBatchDraft();let add=cmPasteReady.filter(x=>!batchMembers.includes(x.rut)).map(x=>x.rut);
 batchMembers=[...batchMembers,...add].sort((a,b)=>(student(a)?.nombre_completo||'').localeCompare(student(b)?.nombre_completo||'','es'));
 for(let r of cmPasteReady)cmColumns.forEach((col,i)=>{if(r.values[i]!==null)batchDraft[r.rut+'|'+col.code+'|'+col.n]=String(r.values[i])});
 let n=cmPasteReady.length;cmPasteReady=[];closeModal();drawBatchTable(kind);toast(n+' estudiantes incorporados. Revisa la tabla y pulsa Guardar todos los resultados.');
}

function cmExportExcel(kind){let data=cmSourceRows(kind),rows=[['Tipo','Plan','Curso de agrupación','Año','Semestre','Instancia','Estudiante','RUT','Cohorte','RA/IA','Columna','Puntaje original','Escala','Promedio por RA/IA','Nivel de logro (%)']];for(let r of data){let stu=student(r.estudiante_ref),multi=cmScores(r,kind),cc=r.curso_id||r.curso_grupo_id||'';for(let [code,vals] of Object.entries(multi)){let mean=cmMean(vals),scale=cmScale(r,code),pct=cmPct(mean,scale);vals.forEach((n,i)=>rows.push([r.curso_id||r.tipo_hito,stu?.plan_estudio||'',cc,r.anio_rendicion,r.semestre_rendicion??'',r.instancia||1,stu?.nombre_completo||'',r.estudiante_ref,stu?.ingreso?.anio||'',code,i+1,n??'',scale,mean??'',pct??'']))}}cmExcelFile(rows,'Castellano_Maestro_resultados_'+kind+'.xls')}
function cmExcelFile(rows,name){let xmlEsc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');let out='<?xml version="1.0" encoding="UTF-8"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Resultados"><Table>'+rows.map((r,i)=>'<Row>'+r.map(v=>`<Cell><Data ss:Type="${typeof v==='number'&&Number.isFinite(v)?'Number':'String'}">${xmlEsc(v)}</Data></Cell>`).join('')+'</Row>').join('')+'</Table></Worksheet></Workbook>';download(new Blob([out],{type:'application/vnd.ms-excel'}),name);toast('Excel generado. Contiene nombres, RUT y resultados: acceso restringido.')}
function resultFiltered(){let kind=v('a_kind'),arr=cmSourceRows(kind),year=v('a_year'),type=v('a_type').toLowerCase(),code=v('a_code'),scale=v('a_scale');return arr.filter(r=>(!year||String(r.anio_rendicion)===year)&&(!type||String(r.curso_id||r.tipo_hito||'').toLowerCase().includes(type))).flatMap(r=>Object.entries(cmScores(r,kind)).filter(([k])=>!code||k===code).map(([k,vals])=>{let escale=cmScale(r,k),mean=cmMean(vals);return {anio:r.anio_rendicion,codigo:k,value:cmPct(mean,escale),original:mean,escala:escale,tipo:r.curso_id||r.tipo_hito,estudiante:r.estudiante_ref,cohorte:student(r.estudiante_ref)?.ingreso?.anio||''}}).filter(z=>z.value!==null&&(!scale||z.escala===scale)))}
function compareResults(){let rr=resultFiltered(),groups={};rr.forEach(r=>{let k=r.anio+'|'+r.codigo;(groups[k] ||= []).push(r)});$('#comparison').innerHTML=`<p class="muted">${rr.length} resultados normalizados a porcentaje de logro. Promedios simples por RA/IA y estudiante.</p><div class="tablewrap"><table class="tbl"><tr><th>Año</th><th>RA / IA</th><th>Estudiantes</th><th>Promedio logro (%)</th></tr>${Object.entries(groups).sort().map(([k,z])=>{let x=cmMean(z.map(r=>r.value));return `<tr><td>${esc(k.split('|')[0])}</td><td>${esc(k.split('|')[1])}</td><td>${z.length}</td><td>${x?.toFixed(1)??'—'} %</td></tr>`}).join('')}</table></div>`}

function cmCheckExternal(o,kind){let errors=[],warnings=[],accepted=[],duplicates=[],seen=new Set();if(o?.formato!=='castellano-maestro-resultados'||o?.version!=='1.0'||o?.tipo!==kind||!Array.isArray(o.rendiciones))return {errors:['Formato, versión, tipo o lista de rendiciones no admitidos.'],warnings,accepted,duplicates};

  else{if(!course(r.curso_id)||s&&course(r.curso_id)?.plan_id!==s.plan_estudio)e.push('curso/plan inválido');if(![1,2].includes(Number(r.semestre_rendicion)))e.push('semestre inválido')}
  let keyScores=kind==='hito'?'puntajes_por_ra':'puntajes_por_ia', keyAchievements=kind==='hito'?'logro_por_ra':'logro_por_ia',keyDetails=kind==='hito'?'desglose_por_ra':'desglose_por_ia';
  for(let [label,map,mode] of [[keyScores,r[keyScores],'score'],[keyAchievements,r[keyAchievements],'percent'],[keyDetails,r[keyDetails],'detail']]){if(map===undefined)continue;if(!map||typeof map!=='object'||Array.isArray(map)){e.push(label+' debe ser objeto');continue}for(let [code,val] of Object.entries(map)){if(!valid.has(code))e.push('código desconocido '+code);if(mode==='percent'&&val!==null&&(!cmIsNum(val)||val<0||val>100))e.push('logro inválido '+code);if(mode==='score'&&val!==null&&!cmIsNum(val))e.push('puntaje inválido '+code);if(mode==='detail'&&(!Array.isArray(val)||val.some(v=>v!==null&&!cmIsNum(v))))e.push('desglose inválido '+code)}}

}

function cmNormName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim()}

function cmOpenPaste(kind){if(!cmColumns.length)return alert('Selecciona primero los RA/IA y sus columnas.');captureBatchDraft();modal(`<div class="row"><h3>Pegado flexible desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">Puedes copiar una tabla con RUT o con nombre y apellido, columnas en otro orden y encabezados como «RA 5.1 ítem 2». Identificaremos por RUT cuando exista; por nombre solo cuando sea inequívoco dentro del plan. Las filas ambiguas se deben resolver antes de aplicar. Los puntajes vacíos no equivalen a cero.</p><textarea id="cmPasteText" rows="10" style="width:100%;font-family:monospace" placeholder="Pega las celdas desde Excel (incluye encabezados para reconocer columnas)"></textarea><div class="bar">${button('Revisar e identificar',`cmPreviewPaste('${kind}')`,'primary')}</div><div id="cmPastePreview"></div>`)}

let scales=Object.fromEntries([...document.querySelectorAll('.cm-scale')].map(el=>[el.dataset.code,cmBounds(el.value)]));let rows=[],seen=new Set();for(let [idx,row] of grid.entries()){if(row.every(x=>!x))continue;let rawRut=rit>=0?cmPasteCleanRut(row[rit]):'',nm=[ape>=0?row[ape]:'',nam>=0?row[nam]:''].filter(Boolean).join(' ').trim();let rutMatch=rawRut?studentList().filter(z=>cmPasteCleanRut(z.rut)===rawRut&&z.plan_estudio===c.plan_id):[];let options=rawRut?rutMatch:cmIdentityCandidates(nm,c.plan_id);let chosen=options.length===1?options[0].rut:null;let vals=[];for(let [i,col] of cols.entries()){let cell=mapping[i]<0?'':(row[mapping[i]]||'').replace(',','.');if(!cell){vals.push(null);continue}let score=Number(cell),b=scales[col.code];if(!Number.isFinite(score)||!b||score<b.lo||score>b.hi){errs.push(`Fila ${idx+1}: ${col.label} (${cell}) fuera de escala`);vals.push(null)}else vals.push(score)}let id=chosen||rawRut||cmNormName(nm);if(chosen&&seen.has(chosen))errs.push(`Estudiante repetido: ${student(chosen)?.nombre_completo}`);if(chosen)seen.add(chosen);rows.push({name:nm||rawRut,rut:chosen,options:options.map(s=>({rut:s.rut,name:s.nombre_completo})),values:vals,source:idx+1});}

}

function cmStats(values){let a=values.filter(x=>Number.isFinite(x)).sort((a,b)=>a-b),n=a.length;if(!n)return null;let avg=a.reduce((x,y)=>x+y,0)/n;return {n,promedio:avg,desviacion_estandar:Math.sqrt(a.reduce((s,x)=>s+(x-avg)**2,0)/n),mediana:n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2,minimo:a[0],maximo:a[n-1],cumple_60:100*a.filter(x=>x>=60).length/n,cumple_70:100*a.filter(x=>x>=70).length/n}}

function cmExportHistoricalHito(){

 if(!rend.length)return alert('No hay rendiciones para los hitos y años seleccionados.');

function endParseNationals(text,kind){
 const lines=String(text||'').trim().split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(lines.length<2)throw Error('Pega encabezados y al menos una fila de promedios nacionales.');
 const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':null;
 if(!sep)throw Error('Se requieren columnas separadas por tabulaciones de Excel o punto y coma.');
 const parts=line=>line.split(sep).map(v=>v.trim().replace(/^"|"$/g,''));
 const headers=parts(lines[0]).map(endLabel),accepted=k=>endAllowed(kind,k);
 const result={},add=(code,raw)=>{
  code=endLabel(code);if(!accepted(code))return;
  const n=endNumber(raw);if(n===null)return;
  if(code!=='puntaje'&&(n<0||n>1))throw Error(code+': el promedio debe estar entre 0 y 1.');
  if(code==='puntaje'&&n<0)throw Error('El puntaje nacional no puede ser negativo.');
  if(Object.hasOwn(result,code)&&Math.abs(result[code]-n)>1e-9)throw Error('Valores distintos para '+code+' en el mismo pegado.');
  result[code]=n;
 };
 // Horizontal: puntaje, d1, d2, e1...; omit PCDD e7 and e8, which are not defined.
 const wide=headers.map((h,i)=>({h,i})).filter(x=>accepted(x.h));
 if(wide.length){
  if(lines.length!==2)throw Error('En formato horizontal usa una fila de encabezados y una fila de promedios nacionales.');
  const cells=parts(lines[1]);for(const {h,i} of wide)add(h,cells[i]);
 }else{
  const codeIndex=headers.findIndex(h=>['codigo','indicador','estandar','dimension','variable'].includes(h));
  const valueIndex=headers.findIndex(h=>['promedio','media','promedionacional','medianacional','valor'].includes(h));
  if(codeIndex<0||valueIndex<0)throw Error('Usa encabezados puntaje/d1/e1, o las columnas codigo y promedio.');
  for(const line of lines.slice(1)){const cells=parts(line);add(cells[codeIndex],cells[valueIndex]);}
 }
 if(!Object.keys(result).length)throw Error('No se encontraron promedios nacionales numéricos válidos.');
 return result;
}

 const values=endParseNationals(v('end_npaste'),kind),cat=endCatalogue(kind);
 endNationalPending={year,kind,values};
 $('#end_npreview').innerHTML=`<div class="notice">${kind} · ${year}: ${Object.keys(values).length} promedios nacionales identificados. No se guardará ningún dato personal.</div><div class="tablewrap"><table class="tbl"><tr><th>Indicador</th><th>Promedio nacional</th></tr>${Object.entries(values).sort(([a],[b])=>a.localeCompare(b,'es',{numeric:true})).map(([k,n])=>`<tr><td>${esc(cat[k]||k)} (${esc(k)})</td><td>${endFormat(n,3)}</td></tr>`).join('')}</table></div>${button('Guardar estos promedios nacionales','endSaveNationalsPaste()','primary')}`;
 }catch(e){endNationalPending=null;alert('No se pudo leer la tabla nacional: '+e.message)}
}
function endSaveNationalsPaste(){
 if(!endNationalPending)return;
 const {year,kind,values}=endNationalPending,store=endStore(),a=store.anualidades[year]||={};
 const r=a[kind]||={anio:Number(year),prueba:kind,modo_ingreso:'solo_referencia_nacional',metricas:{},categorias:{},n_filas_importadas:null};
 const old=r.promedios_nacionales||{};
 if(Object.keys(values).some(k=>k in old)&&!confirm('Ya existen promedios nacionales para algunos códigos. ¿Reemplazar solo esos códigos?'))return;
 r.promedios_nacionales||={};
 for(const [k,n] of Object.entries(values))r.promedios_nacionales[k]={promedio:n,unidad:k==='puntaje'?'puntaje':'proporcion',actualizado:new Date().toISOString()};
 a[kind]=r;logChange('END_nacional',kind+':'+year,`Pegado de ${Object.keys(values).length} promedios nacionales`);
 endNationalPending=null;cmEndPage();toast('Promedios nacionales guardados; exporta la Base Maestra.');
}
function endSetNationals(){try{

 if(!/^\d{4}$/.test(year)||!(/^(puntaje|d\d+|e\d+)$/.test(key))||x===null)throw Error('Indica año, código y promedio nacional válidos.');
 if(key!=='puntaje'&&(x<0||x>1))throw Error('El promedio de estándares/dominios debe estar entre 0 y 1.');
 let store=endStore(),a=store.anualidades[year]||={};let r=a[kind]||={anio:Number(year),prueba:kind,modo_ingreso:'solo_referencia_nacional',metricas:{},categorias:{},n_filas_importadas:null};
 (r.promedios_nacionales||={})[key]={promedio:x,unidad:key==='puntaje'?'puntaje':'proporcion',actualizado:new Date().toISOString()};
 a[kind]=r;logChange('END_nacional',kind+':'+year,`Promedio nacional ${key}`);cmEndPage();toast('Promedio nacional guardado. Exporta la Base Maestra.');
}catch(e){alert(e.message)}}

}
function endCompare(){
 let store=endStore(),kind=v('end_comparekind'),key=v('end_comparemetric'),names=endCatalogue(kind);
 let annual=store.anualidades||{};
 let rows=Object.entries(annual).sort(([a],[b])=>Number(a)-Number(b)).map(([year,tests])=>{
  let m=tests[kind]?.metricas?.[key],n=tests[kind]?.promedios_nacionales?.[key];
  let prev=annual[String(Number(year)-1)]?.[kind]?.metricas?.[key];
  let dif=Number.isFinite(m?.promedio)&&Number.isFinite(prev?.promedio)?m.promedio-prev.promedio:null;
  return [year,m,n,prev,dif];
 }).filter(([,m,n])=>m||n);
 $('#end_compare').innerHTML=`<p class="small">${esc(names[key]||key)} (${esc(key)}). Las diferencias interanuales se calculan respecto del año calendario inmediatamente anterior y con la misma prueba e indicador; si falta un año, no se interpola.</p><div class="tablewrap"><table class="tbl"><tr><th>Año</th><th>N</th><th>Media institucional</th><th>Media nacional</th><th>Dif. nacional</th><th>Media año anterior</th><th>Dif. año anterior</th><th>DE</th><th>Mediana</th><th>Mín.</th><th>Máx.</th></tr>${rows.map(([y,m,n,prev,dif])=>`<tr><td>${esc(y)}</td><td>${m?.n??'—'}</td><td>${endFormat(m?.promedio,3)}</td><td>${endFormat(n?.promedio,3)}</td><td>${endFormat(m&&n&&Number.isFinite(m.promedio)&&Number.isFinite(n.promedio)?m.promedio-n.promedio:null,3)}</td><td>${endFormat(prev?.promedio,3)}</td><td>${endFormat(dif,3)}</td><td>${endFormat(m?.desviacion_estandar,3)}</td><td>${endFormat(m?.mediana,3)}</td><td>${endFormat(m?.minimo,3)}</td><td>${endFormat(m?.maximo,3)}</td></tr>`).join('')||'<tr><td colspan="11">No hay datos comparables.</td></tr>'}</table></div>`;
}
