function acadTypeFields(rec={}){let type=v('ac_type');let f=type==='Artículo'?`${field('Título','ac_title',rec.titulo||'')}${field('Revista','ac_journal',rec.revista||'')}${field('Enlace o DOI','ac_link',rec.enlace||'')}${field('Indexación','ac_index',rec.indexacion||'OTRA','text',['WOS','SCOPUS','SCIELO','ERIHPLUS','OTRA'].map(x=>[x,x]))}${field('Otra indexación (si corresponde)','ac_other',rec.otra_indexacion||'')}`:type==='Libro'?`${field('Título','ac_title',rec.titulo||'')}${field('ISBN / DOI / enlace','ac_link',rec.enlace||'')}${field('Rol','ac_rol',rec.rol||'Autor','text',['Autor','Compilador','Coordinador','Editor'].map(x=>[x,x]))}${field('Revisión por pares','ac_peer',rec.revision_pares||'no_informado','text',[['no_informado','Sin informar'],['si','Sí'],['no','No']])}`:type==='Capítulo de libro'?`${field('Título','ac_title',rec.titulo||'')}${field('Libro','ac_book',rec.libro||'')}${field('Autores / editores / compiladores','ac_editors',rec.autores_editores||'')}${field('ISBN / DOI / enlace','ac_link',rec.enlace||'')}${field('Revisión por pares','ac_peer',rec.revision_pares||'no_informado','text',[['no_informado','Sin informar'],['si','Sí'],['no','No']])}`:['Ponencia','Conferencia'].includes(type)?`${field('Título','ac_title',rec.titulo||'')}${field('Congreso o evento académico','ac_event',rec.evento||'')}`:`${field('Título','ac_title',rec.titulo||'')}${field('Código','ac_code',rec.codigo||'')}${field('Financiamiento','ac_funding',rec.financiamiento||'externo','text',[['interno','Interno'],['externo','Externo']])}${field('Inicio','ac_start',rec.inicio||rec.anio||acadYear(),'number')}${field('Término (vacío si continúa)','ac_end',rec.termino??'','number')}<p class="notice">Para proyectos, el rol escogido para cada grupo se conserva en sus participaciones; puede afinarse individualmente en una edición posterior.</p>`;$('#ac_type_fields').innerHTML=f;if(type==='Artículo'){$('#ac_journal').setAttribute('list','acad_journals');$('#ac_type_fields').insertAdjacentHTML('beforeend',`<datalist id="acad_journals">${academicStore().revistas.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`)}}
function acadSave(){let p=academicStore(),kind=acadTab,arr=p[kind],old=arr.find(x=>x.id===acadEdit),type=kind==='investigacion'?v('ac_type'):kind==='docencia'?'Docencia':'Seminario';let rec={...(old||{}),id:acadEdit||acadId(),anio:Number(v('ac_year'))||null,tipo:type};if(kind==='investigacion'){Object.assign(rec,{titulo:v('ac_title'),profesores:acadCollect('ac_teachers'),estudiantes:acadCollect('ac_students'),palabras_clave:acadSplit(v('ac_keywords'))});for(let [k,id] of Object.entries({revista:'ac_journal',enlace:'ac_link',indexacion:'ac_index',otra_indexacion:'ac_other',rol:'ac_rol',revision_pares:'ac_peer',libro:'ac_book',autores_editores:'ac_editors',evento:'ac_event',codigo:'ac_code',financiamiento:'ac_funding'}))rec[k]=v(id)||null;if(type==='Proyecto'){rec.inicio=Number(v('ac_start'))||null;rec.termino=Number(v('ac_end'))||null;}if(rec.revista&&!p.revistas.includes(rec.revista))p.revistas.push(rec.revista)}else if(kind==='docencia'){Object.assign(rec,{profesores:acadCollect('doc_teachers'),estudiantes:acadCollect('doc_students'),descripcion:v('ac_description'),mefid:v('ac_mefid'),enlace:v('ac_link')})}else{Object.assign(rec,{titulo:v('ac_title'),estudiantes:acadCollect('sem_authors'),guias:acadCollect('sem_guides'),informantes:acadCollect('sem_readers'),titulo_provisorio:$('#ac_provisional').checked,pendiente_entrega:$('#ac_pending').checked})}if(!old)arr.push(rec);else Object.assign(old,rec);logChange('producto_academico',rec.id,kind);acadMode='visualizar';academicPage();toast('Producto guardado. Exporta la Base Maestra para conservarlo.');}
function acadPending(r){if(r.tipo==='Docencia')return !r.descripcion||!r.profesores?.length&&!r.estudiantes?.length;if(r.tipo==='Seminario')return r.titulo_provisorio||r.pendiente_entrega||!r.titulo||!r.estudiantes?.length||!r.guias?.length;return !r.titulo||(r.tipo==='Artículo'&&(!r.revista||!r.enlace||!r.indexacion))||(r.tipo==='Libro'&&!r.enlace)||(r.tipo==='Capítulo de libro'&&(!r.libro||!r.enlace))||(['Ponencia','Conferencia'].includes(r.tipo)&&!r.evento)||(r.tipo==='Proyecto'&&(!r.codigo||!r.inicio||!r.financiamiento))}
function acadText(r){return [r.titulo||r.descripcion||'(Sin título)',r.tipo, r.revista||r.libro||r.evento||'',r.enlace||'',(r.profesores||[]).map(x=>x.nombre).join(', '),(r.estudiantes||[]).map(x=>x.nombre).join(', ')].filter(Boolean).join(' — ')}
function acadFiltered(){let q=v('acad_q').toLocaleLowerCase('es'),y=v('acad_year'),typ=v('acad_filtertype'),teach=v('acad_teacher'),students=$('#acad_students')?.checked,pending=$('#acad_pending')?.checked,active=$('#acad_active')?.checked;return (academicStore()[acadTab]||[]).filter(r=>(!q||acadText(r).toLocaleLowerCase('es').includes(q))&&(!y||String(r.anio)===y)&&(!typ||r.tipo===typ)&&(!teach||(r.profesores||r.guias||[]).concat(r.informantes||[]).some(p=>p.id===teach))&&(!students||(r.estudiantes||[]).length)&&(!pending||acadPending(r))&&(!active||(r.tipo==='Proyecto'&&(!y||((!r.inicio||r.inicio<=Number(y))&&(!r.termino||r.termino>=Number(y))))))).sort((a,b)=>(b.anio||0)-(a.anio||0)||acadText(a).localeCompare(acadText(b),'es'))}
function acadTypeOptions(){return [['','Todos'],...(acadTab==='investigacion'?acadTypes:(acadTab==='docencia'?['Docencia']:['Seminario'])).map(x=>[x,x])]}
function acadListing(){let arr=academicStore()[acadTab],years=[...new Set(arr.map(x=>x.anio).filter(Boolean))].sort((a,b)=>b-a);$('#academicBody').innerHTML=`<div class="card"><div class="row"><h3>${acadTab==='investigacion'?'Productos de investigación':acadTab==='docencia'?'Productos de docencia (beta)':'Seminarios de grado'} (${arr.length})</h3>${button('Agregar nuevo',"acadChangeMode('agregar')",'primary')}</div><div class="columns">${field('Buscar','acad_q','')}${field('Año','acad_year','','text',[['','Todos'],...years.map(x=>[x,x])])}${field('Tipo','acad_filtertype','','text',acadTypeOptions())}${field('Profesor/a','acad_teacher','','text',[['','Todos'],...acadTeacherOptions()])}</div><div class="bar"><label><input id="acad_students" type="checkbox"> Solo con estudiantes</label><label><input id="acad_pending" type="checkbox"> Ver pendientes</label> <label><input id="acad_active" type="checkbox"> Proyectos vigentes en el año seleccionado</label></div><div class="bar">${button('Exportar Excel',"acadExportExcel()")}${button('Exportar texto plano',"acadExportText()")}${acadTab!=='docencia'?button('Pegar masivamente desde Excel',"acadBulkOpen()") :''}</div><div id="acad_results"></div></div>`;['acad_q','acad_year','acad_filtertype','acad_teacher','acad_students','acad_pending','acad_active'].forEach(id=>$('#'+id).addEventListener('input',acadDrawList));acadDrawList()}
function acadDrawList(){let rows=acadFiltered();$('#acad_results').innerHTML=`<p class="small muted">${rows.length} productos · ${rows.filter(acadPending).length} pendientes en selección</p>${rows.map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.titulo||r.descripcion||'Sin título')}</strong> <span class="tag">${esc(r.tipo)}</span> <span class="tag">${esc(r.anio||'Sin año')}</span> ${acadPending(r)?'<span class="tag">Pendiente de completar</span>':''}<div class="small muted">${esc([...(r.profesores||[]),...(r.guias||[]),...(r.informantes||[])].map(x=>x.nombre).join(', '))}</div><div class="small muted">${esc((r.estudiantes||[]).map(x=>x.nombre).join(', '))}</div>${r.tipo==='Proyecto'?`<p class="small">Vigencia: ${esc(r.inicio||'?')} – ${esc(r.termino||'En curso')}</p>`:''}</div>${button('Editar',`acadEditRecord('${r.id}')`,'small')}</div></div>`).join('')||'<p class="muted">Sin productos para esos filtros.</p>'}`}
function acadEditRecord(id){let rec=academicStore()[acadTab].find(x=>x.id===id);if(!rec)return;acadMode='agregar';academicPage();acadForm(rec)}
function acadExportExcel(){let rows=acadFiltered();cmExcelFile([['ID','Año','Tipo','Título/Descripción','Profesores','Estudiantes','Revista/Libro/Evento','Enlace','Inicio','Término','Pendiente','Palabras clave'],...rows.map(r=>[r.id,r.anio,r.tipo,r.titulo||r.descripcion||'',(r.profesores||r.guias||[]).concat(r.informantes||[]).map(x=>x.nombre).join('; '),(r.estudiantes||[]).map(x=>x.nombre).join('; '),r.revista||r.libro||r.evento||'',r.enlace||'',r.inicio||'',r.termino||'',acadPending(r)?'Sí':'No',(r.palabras_clave||[]).join('; ')])],`Castellano_Maestro_${acadTab}.xls`)}
function acadExportText(){let rows=acadFiltered();download(new Blob([rows.map(acadText).join('\n\n')],{type:'text/plain;charset=utf-8'}),`Castellano_Maestro_${acadTab}.txt`)}
function acadProfileForTeacher(id){let p=academicStore();return [['Investigación',p.investigacion],['Docencia',p.docencia],['Seminarios de grado',p.seminarios_grado]].map(([lab,arr])=>`<div class="card"><h4>${lab}</h4>${arr.filter(r=>[...(r.profesores||[]),...(r.guias||[]),...(r.informantes||[])].some(x=>x.id===id)).map(r=>`<p>${esc(r.anio)} · ${esc(r.titulo||r.descripcion||'Sin título')} (${esc(r.tipo)})</p>`).join('')||'<p class="muted">Sin registros.</p>'}</div>`).join('')}
function acadOpenTeacher(id){let t=teachers().find(x=>x.id===id);if(!t)return;$('#screen').innerHTML=`<div class="bar">${button('← Profesores',"teachersPage()")}${button('Editar',`editTeacher('${id}')`)}</div><div class="card"><h3>${esc(t.nombre_completo)}</h3><p>${esc(t.correo||'')} · RUT: ${esc(t.rut||'pendiente')}</p></div>${acadProfileForTeacher(id)}`}
function acadStudentResults(r){let h=db.resultados_hito.rendiciones.filter(x=>x.estudiante_ref===r),e=db.resultados_eif.rendiciones.filter(x=>x.estudiante_ref===r);return `<div class="card"><h3>Resultados individuales detallados</h3>${[['HITO',h,'hito'],['EIF',e,'eif']].map(([label,arr,kind])=>`<h4>${label}</h4>${arr.map(x=>`<details><summary>${esc(x.tipo_hito||x.curso_id)} · ${esc(x.anio_rendicion)} ${x.semestre_rendicion?'· S'+esc(x.semestre_rendicion):''}</summary><div class="tablewrap"><table class="tbl"><tr><th>RA/IA</th><th>Puntajes desagregados</th><th>Escala</th><th>Promedio</th><th>Nivel de logro</th></tr>${Object.entries(cmScores(x,kind)).map(([code,vals])=>{let sc=cmScale(x,code),m=cmMean(vals),pct=cmPct(m,sc);return `<tr><td>${esc(code)}</td><td>${esc(vals.join('; '))}</td><td>${esc(sc)}</td><td>${m===null?'—':esc(m.toFixed(2))}</td><td>${pct===null?'—':esc(pct.toFixed(1))+' %'}</td></tr>`}).join('')}</table></div></details>`).join('')||'<p class="muted">Sin resultados.</p>'}`).join('')}</div>`}
function acadBulkOpen(){modal(`<h3>Pegar productos desde Excel</h3><p>Admite columnas como año, tipo, título, revista, enlace/DOI, profesores, estudiantes, palabras clave, ISBN, libro, evento, rol, inicio, término, guía e informantes. Participantes se identifican por nombre completo cuando la coincidencia es única; los demás quedan como participantes externos. La vista previa no modifica la base.</p><textarea id="acad_bulk_text" rows="10" placeholder="Pega tabla con encabezados y filas"></textarea><div class="bar">${button('Revisar importación',"acadBulkPreview()",'primary')}${button('Cerrar',"closeModal()")}</div><div id="acad_bulk_preview"></div>`)}
function acadKey(k){return String(k).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function acadBulkRows(text){let ls=text.trim().split(/\r?\n/).filter(Boolean);if(ls.length<2)throw Error('Incluye encabezados y filas');let sep=ls[0].includes('\t')?'\t':';',heads=ls[0].split(sep).map(acadKey);return ls.slice(1).map(line=>{let cols=line.split(sep),o={};heads.forEach((k,i)=>o[k]=(cols[i]||'').trim().replace(/^"|"$/g,''));return o}).filter(o=>Object.values(o).some(Boolean))}
function acadMapPeople(text,which){return acadSplit(text?.replace(/,\s*(?=[A-ZÁÉÍÓÚÑ][a-záéíóúñ])/g,';')||'').map(name=>{let search=acadKey(name),pool=which==='teacher'?teachers():studentList(),hits=pool.filter(x=>acadKey(x.nombre_completo)===search||acadKey(x.apellidos+' '+x.nombres)===search);return hits.length===1?{id:which==='teacher'?hits[0].id:hits[0].rut,nombre:hits[0].nombre_completo}:{id:null,nombre}})}
let acadBulkDraft=[];
function acadBulkPreview(){try{acadBulkDraft=acadBulkRows(v('acad_bulk_text')).map(o=>{let get=(...ks)=>ks.map(k=>o[acadKey(k)]).find(x=>x!==undefined&&x!=='')||'',sem=acadTab==='seminarios_grado',type=sem?'Seminario':get('tipo','tipo producto')||'Artículo';return {id:acadId(),anio:Number(get('anio','año'))||null,tipo:type,titulo:get('titulo','título'),descripcion:get('descripcion'),revista:get('revista'),libro:get('libro'),evento:get('evento','congreso'),enlace:get('doi','url','enlace','link','isbn'),indexacion:get('indexacion'),rol:get('rol'),codigo:get('codigo'),financiamiento:get('financiamiento'),inicio:Number(get('inicio','año inicio'))||null,termino:Number(get('termino','año termino'))||null,palabras_clave:acadSplit(get('palabras clave','keywords')),estudiantes:acadMapPeople(get('estudiantes','autores estudiantes','autores'), 'student'),profesores:acadMapPeople(get('profesores','docentes'),'teacher'),guias:acadMapPeople(get('guia','profesor guia'),'teacher'),informantes:acadMapPeople(get('informantes','profesores informantes'),'teacher'),titulo_provisorio:/si|sí|true|1/i.test(get('provisorio')),pendiente_entrega:/si|sí|true|1/i.test(get('pendiente'))}});$('#acad_bulk_preview').innerHTML=`<p>${acadBulkDraft.length} filas reconocidas.</p><div class="scroll">${acadBulkDraft.slice(0,25).map(r=>`<p>${esc(r.anio)} · ${esc(r.tipo)} · ${esc(r.titulo||'(sin título)')}</p>`).join('')}</div>${button('Importar las '+acadBulkDraft.length+' filas',"acadBulkApply()",'primary')}`}catch(e){alert(e.message)}}
function acadBulkApply(){if(!acadBulkDraft.length)return;academicStore()[acadTab].push(...acadBulkDraft);logChange('importacion_productos',acadTab,acadBulkDraft.length+' productos desde Excel');acadBulkDraft=[];closeModal();acadMode='visualizar';academicPage()}


/* Castellano Maestro v17 — participación END anual: identificadores de quienes rindieron, sin puntajes individuales. */
function cmEndRosterStore(){let st=endStore();st.participacion_estudiantil ||= {por_anio:{},descripcion:'Nóminas de participación END por año. No contiene resultados individuales ni vinculación entre puntajes y estudiantes.'};st.participacion_estudiantil.por_anio ||= {};return st.participacion_estudiantil.por_anio}
function cmEndRoster(year){return cmEndRosterStore()[String(year)]||{anio:Number(year),estudiantes:[]}}
function cmEndRUTs(year){return cmEndRoster(year).estudiantes||[]}
function cmEndYears(){let a=Object.keys(cmEndRosterStore());return [...new Set([...a,...Object.keys(endStore().anualidades||{})])].sort((x,y)=>Number(y)-Number(x))}
function cmEndStudentHTML(r){let records=Object.values(cmEndRosterStore()).filter(x=>(x.estudiantes||[]).includes(r)).sort((a,b)=>b.anio-a.anio);return records.length?'<p>'+records.map(x=>`<span class="tag">END ${esc(x.anio)} · participación registrada</span>`).join(' ')+'</p>':'<p class="muted">No hay rendiciones END registradas para este estudiante. Esto no acredita que no haya rendido: puede faltar información histórica.</p>'}
function cmEndStudentEdit(r){let s=student(r),ys=cmEndYears(),year=ys[0]||new Date().getFullYear();modal(`<div class="row"><h3>Participación END · ${esc(s.nombre_completo)}</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted small">Se registra únicamente si integra la nómina de quienes rindieron la END en el año indicado, sin almacenar su puntaje.</p>${field('Año de rendición','cm_end_student_year',year,'number')}<label><input type="checkbox" id="cm_end_student_checked"> Rindió la END en este año</label><div class="bar">${button('Consultar año','cmEndStudentRefresh()')}${button('Guardar participación','cmEndStudentSave('+JSON.stringify(r)+')','primary')}</div>`);window.cmEndEditingRUT=r;cmEndStudentRefresh()}
function cmEndStudentRefresh(){let year=Number(v('cm_end_student_year'));$('#cm_end_student_checked').checked=cmEndRUTs(year).includes(window.cmEndEditingRUT)}
function cmEndStudentSave(r){let year=Number(v('cm_end_student_year'));if(!Number.isInteger(year)||year<2000||year>2200)return alert('Año inválido');let data=cmEndRoster(year),set=new Set(data.estudiantes||[]);if($('#cm_end_student_checked').checked)set.add(r);else set.delete(r);data.estudiantes=[...set].sort((a,b)=>(student(a)?.nombre_completo||a).localeCompare(student(b)?.nombre_completo||b,'es'));cmEndRosterStore()[String(year)]=data;logChange('END_nomina',String(year),'Actualización de participación END de un estudiante; sin puntajes individuales');closeModal();openStudent(r);toast('Participación END guardada en memoria; exporta la base')}
function cmEndRosterPanel(){let ys=cmEndYears(),year=ys[0]||new Date().getFullYear();return `<div class="card"><h3>Nómina de estudiantes que rindieron la END</h3><p class="muted small">Asocia cada año con los estudiantes participantes. No vincula resultados individuales ni altera los estadísticos de PCPG o PCDD. Puedes consultar aquí quiénes tienen rendición registrada y quiénes todavía no constan en la nómina.</p><div class="columns">${field('Año END','cm_end_roster_year',year,'number')}${field('Filtrar por nombre o RUT','cm_end_roster_q','')}${field('Plan de estudio','cm_end_roster_plan','','text',[['','Todos'],['B','Plan B'],['C','Plan C']])}${field('Año de ingreso','cm_end_roster_entry','','text',[['','Todos'],...[...new Set(studentList().map(s=>String(s.ingreso?.anio||'')).filter(Boolean))].sort().map(x=>[x,x])])}${field('Estado de participación','cm_end_roster_state','','text',[['','Todos'],['si','Rindieron'],['no','Sin registro']])}</div><div class="bar">${button('Consultar nómina','cmEndRosterDraw()')}${button('Marcar visibles como rindieron','cmEndRosterBulk(true)')}${button('Quitar marca a visibles','cmEndRosterBulk(false)')}${button('Guardar selección de END','cmEndRosterSave()','primary')}</div><p id="cm_end_roster_summary" class="small muted"></p><div id="cm_end_roster_cards" class="acadPeople" style="max-height:340px"></div></div>`}
let cmEndDraft=null;
function cmEndRosterDraw(){let year=Number(v('cm_end_roster_year'));if(!Number.isInteger(year)||year<2000||year>2200)return alert('Año inválido');if(!cmEndDraft||cmEndDraft.year!==year)cmEndDraft={year,selected:new Set(cmEndRUTs(year))};let q=v('cm_end_roster_q').trim().toLocaleLowerCase('es'),p=v('cm_end_roster_plan'),entry=v('cm_end_roster_entry'),status=v('cm_end_roster_state');let ss=studentList().filter(x=>(!p||x.plan_estudio===p)&&(!entry||String(x.ingreso?.anio)===entry)&&(!q||(x.nombre_completo+' '+x.rut).toLocaleLowerCase('es').includes(q))).sort((a,b)=>a.nombre_completo.localeCompare(b.nombre_completo,'es'));ss=ss.filter(x=>!status||(status==='si'?cmEndDraft.selected.has(x.rut):!cmEndDraft.selected.has(x.rut)));$('#cm_end_roster_cards').innerHTML=ss.map(x=>`<label class="acadPerson"><input type="checkbox" data-end-rut="${esc(x.rut)}" ${cmEndDraft.selected.has(x.rut)?'checked':''} onchange="cmEndToggle(this)"><span><b>${esc(x.nombre_completo)}</b><br><span class="muted small">${esc(x.rut)} · Plan ${esc(x.plan_estudio)} · Ingreso ${esc(x.ingreso?.anio||'—')}</span></span></label>`).join('')||'<p class="muted">Sin estudiantes para estos filtros.</p>';$('#cm_end_roster_summary').textContent=cmEndDraft.selected.size+' estudiantes seleccionados como participantes · '+ss.length+' fichas visibles'}
function cmEndToggle(el){let r=el.dataset.endRut;if(el.checked)cmEndDraft.selected.add(r);else cmEndDraft.selected.delete(r);$('#cm_end_roster_summary').textContent=cmEndDraft.selected.size+' estudiantes seleccionados como participantes'}
function cmEndRosterBulk(state){document.querySelectorAll('#cm_end_roster_cards input[data-end-rut]').forEach(el=>{el.checked=state;cmEndToggle(el)})}
function cmEndRosterSave(){if(!cmEndDraft)return alert('Consulta primero la nómina');let items=[...cmEndDraft.selected];if(items.some(r=>!student(r)))return alert('Hay estudiantes no identificados');let st=cmEndRosterStore();st[String(cmEndDraft.year)]={anio:cmEndDraft.year,estudiantes:items.sort((a,b)=>student(a).nombre_completo.localeCompare(student(b).nombre_completo,'es')),fecha_registro:date()};logChange('END_nomina',String(cmEndDraft.year),items.length+' estudiantes asociados a la rendición; sin microdatos');cmEndRosterDraw();toast('Nómina END guardada. Exporta la Base Maestra')}
const cmEndOriginalPage=cmEndPage;
cmEndPage=function(){cmEndOriginalPage();cmEndDraft=null;cmEndRosterDraw();for(let k of ['cm_end_roster_year','cm_end_roster_plan','cm_end_roster_entry','cm_end_roster_state'])$('#'+k).addEventListener('change',cmEndRosterDraw);$('#cm_end_roster_q').addEventListener('input',cmEndRosterDraw)};
</script></body></html>
