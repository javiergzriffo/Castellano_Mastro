function cm19Render(){let root=$('#screen');if(!db)return;let mode=cm19.mode,k=cm19.kind;let rec=cm19Available();let related=cm19.group?rec.filter(x=>x.group===cm19.group):rec;let years=[...new Set(related.map(x=>x.year).filter(Number.isFinite))].sort((a,b)=>b-a);if(!years.includes(Number(cm19.year)))cm19.year=years[0]??null;if(!years.includes(Number(cm19.year2))||cm19.year2===cm19.year)cm19.year2=years.find(x=>x!==cm19.year)??null;let groups=[...new Set(rec.map(x=>x.group))].sort();if(!groups.includes(cm19.group))cm19.group=groups[0]||'';years=[...new Set(rec.filter(x=>x.group===cm19.group).map(x=>x.year))].sort((a,b)=>b-a);if(!years.includes(Number(cm19.year)))cm19.year=years[0]??null;if(!years.includes(Number(cm19.year2))||cm19.year2===cm19.year)cm19.year2=years.find(x=>x!==cm19.year)??null;let sems=[...new Set(rec.filter(x=>x.group===cm19.group&&x.year===cm19.year).map(x=>x.sem).filter(Boolean))].sort();if(!sems.includes(cm19.sem))cm19.sem=sems[0]||'';let labels={hito:'Resultados HITO',eif:'Resultados EIF',end:'Resultados END'};root.innerHTML=`<div class="card"><h3>Centro de análisis y reportes</h3><p class="muted">Elige primero qué deseas analizar. Solo se ofrecen períodos con resultados guardados.</p>${cm19Cards([['global','Resultados globales'],['individual','Estudiantes y grupos']],mode,'cm19ChangeMode')}</div>${mode==='global'?`<div class="card"><h3>1. Fuente de resultados</h3>${cm19Cards(['hito','eif','end'].map(t=>[t,labels[t]]),k,'cm19ChangeKind')}<p class="small muted">EIF: datos agregados por curso · HITO: rendiciones por estudiante · END: estadísticas anuales institucionales y nacionales.</p></div><div class="card"><h3>2. Período y comparación</h3>${cm19Cards([['one','Un año'],['two','Comparar dos años'],['historical','Serie histórica']],cm19.scope,'cm19SetScope')}${years.length?`<p class="label">${cm19.scope==='two'?'Primer año':'Año de referencia'}</p>${cm19Cards(years.map(y=>[y,String(y)]),cm19.year,'cm19SetYear')}`:'<div class="notice">No hay resultados guardados para esta fuente.</div>'}${cm19.scope==='two'&&years.length>1?`<p class="label">Segundo año</p>${cm19Cards(years.filter(y=>y!==cm19.year).map(y=>[y,String(y)]),cm19.year2,'cm19SetYear2')}`:''}</div><div class="card"><h3>3. ${k==='end'?'Prueba':'Instrumento o asignatura'}</h3>${groups.length?cm19Cards(groups.map(g=>[g,k==='eif'?(course(g)?.nombre||g)+' · '+g:g.replace('HITO_','HITO ')]),cm19.group,'cm19SetGroup'):'<p class="muted">Todavía no hay instrumentos con datos en la selección.</p>'}${k==='eif'&&sems.length?`<p class="label">Semestre (si hay más de uno)</p>${cm19Cards(sems.map(s=>[s,'Semestre '+s]),cm19.sem,'cm19SetSem')}`:''}</div><div class="card"><h3>4. Métricas a mostrar</h3><div class="cm19Cards">${Object.entries(cm19Features).filter(([id])=>k==='end'? !['p60','p70'].includes(id):!['nat','prev'].includes(id)).map(([id,name])=>`<label class="cm19Check"><input type="checkbox" class="cm19Met" value="${id}" ${cm19.metrics.includes(id)?'checked':''} onchange="cm19SyncMetrics()">${esc(name)}</label>`).join('')}</div><p class="muted small">Los porcentajes ≥60 y ≥70 se muestran solamente para EIF y HITO. En END se presentan diferencias respecto del nacional y del año inmediatamente anterior.</p></div><div class="card"><h3>5. Consultar y exportar</h3><div class="columns">${field('Filtrar indicador (código o nombre)','cm19Code',cm19.filters.code||'')}${k==='hito'?field('Año de ingreso de estudiantes','cm19Cohort',cm19.filters.cohort||'','text',[['','Todas las cohortes'],...[...new Set(studentList().map(s=>s.ingreso?.anio).filter(Boolean))].sort().map(y=>[y,String(y)])]):''}</div><div class="bar">${button('Visualizar resultados','cm19Show()','primary')}${button('Descargar Excel','cm19ExportExcel()')}${button('Descargar PDF','cm19ExportPDF()')}</div></div>`:`<div class="card"><h3>Resultados de estudiantes o grupos</h3><p class="notice">Esta consulta utiliza únicamente HITO, que conserva resultados por estudiante. Las EIF y END no almacenan puntajes individuales: no sería posible calcularles cuartiles personales ni reconstruirlos.</p><div class="columns">${field('Buscar estudiante (nombre o RUT)','cm19Person','')}${field('Año de ingreso','cm19Entry','','text',[['','Todos'],...[...new Set(studentList().map(s=>s.ingreso?.anio).filter(Boolean))].sort().map(y=>[y,String(y)])])}${field('Plan de estudios','cm19Plan','','text',[['','Ambos planes'],['B','B'],['C','C']])}${field('Estudiantes que cursan','cm19Course','','text',[['','Todos los cursos'],...courseList().map(c=>[c.id,c.id+' · '+c.nombre])])}${field('HITO','cm19IndHito','','text',[['','Todos'],...[...new Set(cm19HITO().filter(r=>Object.keys(cmScores(r,'hito')).length).map(r=>r.tipo_hito))].map(k=>[k,k])])}${field('Año de rendición','cm19IndYear','','text',[['','Todos'],...[...new Set(cm19HITO().filter(r=>Object.keys(cmScores(r,'hito')).length).map(r=>r.anio_rendicion))].sort((a,b)=>b-a).map(y=>[String(y),String(y)])])}</div><p class="small muted">Los cuartiles se calculan para cada RA, HITO y año entre las personas con resultado válido en ese grupo de rendición. Q1 corresponde al tramo inferior y Q4 al superior; los empates reciben el mismo rango percentil.</p><div class="bar">${button('Visualizar estudiantes y resultados','cm19ShowIndividuals()','primary')}${button('Descargar Excel','cm19ExportExcel()')}${button('Descargar PDF','cm19ExportPDF()')}</div></div>`}<div id="cm19Output"></div>`;if(cm19.output.length)cm19Paint()}
function cm19SetScope(x){cm19.scope=x;cm19Render()}function cm19SetYear(x){cm19.year=Number(x);cm19Render()}function cm19SetYear2(x){cm19.year2=Number(x);cm19Render()}function cm19SetGroup(x){cm19.group=x;cm19.year=null;cm19.year2=null;cm19.sem='';cm19Render()}function cm19SetSem(x){cm19.sem=String(x);cm19Render()}
function cm19SyncMetrics(){cm19.metrics=[...document.querySelectorAll('.cm19Met:checked')].map(x=>x.value)}
function cm19Value(x){return Number.isFinite(x)?Math.round(x*1000)/1000:'—'}
function cm19Labels(kind,code){if(kind==='end')return endCatalogue(cm19.group)[code]||code;if(kind==='hito')return db.perfil_egreso?.resultados_aprendizaje?.[code]?.descripcion||code;return db.perfil_egreso?.indicadores_aprendizaje?.[code]?.descripcion||code}
function cm19MapStats(stats){return {mean:stats?.promedio,median:stats?.mediana,sd:stats?.desviacion_estandar,p60:stats?.cumple_60,p70:stats?.cumple_70}}
function cm19HitoStats(records){let m=new Map();for(let r of records){for(let [code,vals] of Object.entries(cmScores(r,'hito'))){let pct=r.logro_por_ra?.[code];if(!Number.isFinite(pct))pct=cmPct(cmMean(vals),cmScale(r,code));if(!Number.isFinite(pct))continue;let key=r.estudiante_ref+'|'+code,old=m.get(key);if(!old||Number(r.instancia||1)>=Number(old.instance))m.set(key,{code,value:pct,instance:r.instancia||1})}}let by={};for(let z of m.values())(by[z.code]||=[]).push(z.value);return Object.fromEntries(Object.entries(by).map(([key,vals])=>[key,cmStats(vals)]))}
function cm19Show(){cm19SyncMetrics();cm19.filters={code:v('cm19Code').trim(),cohort:v('cm19Cohort')};let rec=cm19Available().filter(x=>x.group===cm19.group);let scope=cm19.scope,years=scope==='historical'?[...new Set(rec.map(x=>x.year))].sort((a,b)=>a-b):scope==='two'?[cm19.year,cm19.year2].filter(Boolean):[cm19.year];let cols=['Año','Prueba / curso','Semestre','Indicador','Descripción','N',...cm19.metrics.map(id=>cm19Features[id])],rows=[];for(let year of years){let subset=rec.filter(x=>x.year===year&&(cm19.kind!=='eif'||String(x.sem)===cm19.sem||scope==='historical'));let computed={};if(cm19.kind==='hito'){let r=subset.map(x=>x.raw).filter(x=>!cm19.filters.cohort||String(student(x.estudiante_ref)?.ingreso?.anio)===cm19.filters.cohort);computed=cm19HitoStats(r)}else if(cm19.kind==='eif'){for(let x of subset)for(let [code,st] of Object.entries(x.raw.indicadores||{})){computed[code+'|'+x.sem]=st}}else{let end=subset[0]?.raw;computed={...(end?.metricas||{})};for(let code of Object.keys(end?.promedios_nacionales||{}))computed[code]||={}}
for(let [key,st] of Object.entries(computed).sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true}))){let [code,sem]=cm19.kind==='eif'?key.split('|'):[key,''];let name=cm19Labels(cm19.kind,code);if(cm19.filters.code&&!(`${code} ${name}`.toLowerCase().includes(cm19.filters.code.toLowerCase())))continue;let m=cm19MapStats(st);if(cm19.kind==='end'){let nat=subset[0]?.raw?.promedios_nacionales?.[code]?.promedio,prev=cm19END()[String(Number(year)-1)]?.[cm19.group]?.metricas?.[code]?.promedio;m.nat=Number.isFinite(st.promedio)&&Number.isFinite(nat)?st.promedio-nat:null;m.prev=Number.isFinite(st.promedio)&&Number.isFinite(prev)?st.promedio-prev:null}rows.push([year,cm19.group,sem,code,name,st?.n??'',...cm19.metrics.map(id=>cm19Value(m[id]))])}}
cm19.headers=cols;cm19.output=rows;cm19.label='Resultados '+cm19.kind.toUpperCase()+' · '+cm19.group;cm19Paint()}
function cm19ShowIndividuals(){let q=v('cm19Person').trim().toLowerCase(),entry=v('cm19Entry'),plan=v('cm19Plan'),cid=v('cm19Course'),target=v('cm19IndHito'),year=v('cm19IndYear');let allowed=new Set(studentList().filter(s=>(!q||(s.nombre_completo+' '+s.rut).toLowerCase().includes(q))&&(!entry||String(s.ingreso?.anio)===entry)&&(!plan||s.plan_estudio===plan)&&(!cid||s.avance_curricular?.[cid]?.estado==='en_curso')).map(s=>s.rut));let all=cm19HITO().filter(r=>Object.keys(cmScores(r,'hito')).length&&(!target||r.tipo_hito===target)&&(!year||String(r.anio_rendicion)===year));let groups=new Map(),current=new Map();for(let r of all){for(let [code,vals] of Object.entries(cmScores(r,'hito'))){let pct=r.logro_por_ra?.[code];if(!Number.isFinite(pct))pct=cmPct(cmMean(vals),cmScale(r,code));if(!Number.isFinite(pct))continue;let g=[r.tipo_hito,r.anio_rendicion,code].join('|'),id=g+'|'+r.estudiante_ref,prior=current.get(id);if(!prior||Number(r.instancia||1)>=Number(prior.instancia||1))current.set(id,{r,code,pct,group:g})}}for(let x of current.values())(groups.get(x.group)|| (groups.set(x.group,[]),groups.get(x.group))).push(x.pct);let rows=[];for(let x of current.values()){let r=x.r,s=student(r.estudiante_ref);if(!allowed.has(r.estudiante_ref))continue;let vals=groups.get(x.group).sort((a,b)=>a-b);let below=vals.filter(n=>n<x.pct).length,equal=vals.filter(n=>n===x.pct).length;let percentile=(below+equal/2)/vals.length,quartile=Math.min(4,Math.max(1,Math.ceil(percentile*4)));rows.push([s.nombre_completo,s.rut,s.plan_estudio,s.ingreso?.anio||'',r.tipo_hito,r.anio_rendicion,x.code,cm19Labels('hito',x.code),cm19Value(x.pct),quartile,vals.length])}rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'es')||Number(a[5])-Number(b[5]));cm19.headers=['Estudiante','RUT','Plan','Año de ingreso','HITO','Año rendición','RA','Resultado de aprendizaje','Logro (%)','Cuartil','N del grupo'];cm19.output=rows;cm19.label='Resultados individuales HITO y cuartiles';cm19Paint()}
function cm19Paint(){let el=$('#cm19Output');if(!el)return;let h=cm19.headers,r=cm19.output;el.innerHTML=`<div class="card"><div class="row"><h3>${esc(cm19.label)}</h3><span class="tag">${r.length} filas</span></div>${r.length?`<div class="tablewrap" style="max-height:60vh;overflow:auto"><table class="tbl"><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.slice(0,1000).map(x=>`<tr>${x.map(y=>`<td>${esc(y)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted small">${r.length>1000?'Se muestran 1.000 filas; las exportaciones contienen el conjunto completo.':'Puedes exportar la tabla completa.'}</p>`:'<p class="muted">No hay resultados que cumplan la selección.</p>'}</div>`}
function cm19ExportExcel(){if(!cm19.output.length)return alert('Primero pulsa Visualizar resultados.');cmExcelFile([cm19.headers,...cm19.output],`Informe_${cm19.mode}_${cm19.kind}_${date()}.xls`)}
// PDF autónomo: no requiere ventana de impresión ni librerías externas.
function cm19PdfBytes(lines){let pages=[],page=[],max=43;for(let line of lines){let str=String(line).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');for(let i=0;i<str.length;i+=108){page.push(str.slice(i,i+108));if(page.length>=max){pages.push(page);page=[]}}}if(page.length||!pages.length)pages.push(page);let objs=[null],add=s=>(objs.push(s),objs.length-1),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>'),pagesId=add('');let ids=[];for(let p of pages){let content=`BT /F1 8 Tf 38 790 Td 11 TL ${p.map((l,i)=>`${i?'T* ':''}(${l.replace(/[\\()]/g,'\\$&')}) Tj`).join('\n')} ET`,stream=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`),pg=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${stream} 0 R >>`);ids.push(pg)}objs[pagesId]=`<< /Type /Pages /Kids [${ids.map(id=>id+' 0 R').join(' ')}] /Count ${ids.length} >>`;let root=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`),out='%PDF-1.4\n',offsets=[0];for(let i=1;i<objs.length;i++){offsets.push(out.length);out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}let start=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;for(let i=1;i<objs.length;i++)out+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;out+=`trailer\n<< /Size ${objs.length} /Root ${root} 0 R >>\nstartxref\n${start}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
function cm19ExportPDF(){if(!cm19.output.length)return alert('Primero pulsa Visualizar resultados.');let lines=['CASTELLANO MAESTRO | '+cm19.label,'Fecha: '+date(),'Registros: '+cm19.output.length,'',...cm19.output.flatMap(row=>['-' .repeat(94),...cm19.headers.map((h,i)=>h+': '+String(row[i]??''))])];download(cm19PdfBytes(lines),`Informe_${cm19.mode}_${cm19.kind}_${date()}.pdf`);toast('PDF descargado directamente; no requiere impresión.')}

let cm20Type='',cm20Year=null,cm20List=[];
function cm20Rends(){return (db?.resultados_hito?.rendiciones||[]).filter(r=>/^HITO_(400|800|1000)$/.test(r.tipo_hito||'')&&r.estudiante_ref&&Object.keys(cmScores(r,'hito')).length)}
function cm20Value(r,code){let x=r.logro_por_ra?.[code];if(x!==undefined&&x!==null&&x!==''&&Number.isFinite(Number(x)))return Number(x);let y=cmMean(cmScores(r,'hito')[code]||[]);return y===null?null:cmPct(y,cmScale(r,code))}
function cm20Rows(r){return Object.keys(cmScores(r,'hito')).map(code=>({code,pct:cm20Value(r,code)})).filter(x=>Number.isFinite(x.pct))}
function cm20Latest(){let m=new Map();for(let r of cm20Rends()){let key=[r.estudiante_ref,r.tipo_hito,r.anio_rendicion].join('|'),prior=m.get(key);if(!prior||Number(r.instancia||1)>=Number(prior.instancia||1))m.set(key,r)}return [...m.values()].filter(r=>cm20Rows(r).length)}

function cm21Form(id=null){let r=cm21Rows().find(x=>x.id===id)||{},kind=r.tipo_fecha||'dia';cm21EditId=id;modal(`<div class="row"><h3>${id?'Editar':'Agregar'} entrada de Bitácora</h3>${button('Cerrar','closeModal()','small')}</div>${field('Título','cm21Title',r.titulo||'')}${field('Descripción breve','cm21Description',r.descripcion||'','textarea')}<div class="field"><span class="label">Tipo de fecha</span><div class="cm19Cards">${[['dia','Día específico'],['mes','Mes y año'],['intervalo','Intervalo de fechas']].map(([k,t])=>`<button class="cm19Choice ${kind===k?'on':''}" onclick="cm21SetDateMode('${k}')" data-cm21-mode="${k}">${t}</button>`).join('')}</div></div><input type="hidden" id="cm21DateMode" value="${kind}"><div id="cm21DateFields"></div>${field('Categoría','cm21Cat',r.categoria||'Comunidad','text',cm21Categories().map(x=>[x,x]))}${field('Nueva categoría (opcional)','cm21NewCat','')}${field('Anidar dentro de una circunstancia','cm22Parent',r.parent_id||'','text',[['','Evento independiente'],...cm21Rows().filter(x=>x.categoria==='Circunstancia'&&x.id!==id).map(x=>[x.id,x.titulo])])}<h4>Profesores participantes</h4><div class="cm21People">${teachers().map(t=>`<label><input class="cm21Teacher" type="checkbox" value="${esc(t.id)}" ${(r.profesores||[]).some(x=>x.id===t.id)?'checked':''}> ${esc(t.nombre_completo)}</label>`).join('')}</div><h4>Estudiantes participantes</h4>${field('Buscar estudiante','cm21SearchStudent','')}<div class="cm21People" id="cm21StudentPeople">${studentList().sort((a,b)=>a.nombre_completo.localeCompare(b.nombre_completo,'es')).map(s=>`<label data-name="${esc(s.nombre_completo.toLowerCase()+' '+s.rut)}"><input class="cm21Student" type="checkbox" value="${esc(s.rut)}" ${(r.estudiantes||[]).some(x=>x.id===s.rut)?'checked':''}> ${esc(s.nombre_completo)}</label>`).join('')}</div><div class="bar" style="margin-top:16px">${button('Guardar entrada','cm21Save()','primary')}${id?button('Eliminar entrada','cm21Delete()','danger'):''}</div>`);cm21DateFields(r);$('#cm21SearchStudent').oninput=()=>{let q=v('cm21SearchStudent').toLowerCase();document.querySelectorAll('#cm21StudentPeople label').forEach(x=>x.hidden=!x.dataset.name.includes(q))}}
function cm21SetDateMode(k){$('#cm21DateMode').value=k;document.querySelectorAll('[data-cm21-mode]').forEach(x=>x.classList.toggle('on',x.dataset.cm21Mode===k));cm21DateFields({})}
function cm21DateFields(r){let mode=v('cm21DateMode'),now=date();$('#cm21DateFields').innerHTML=mode==='mes'?`<div class="columns">${field('Año','cm21Y',r.anio||new Date().getFullYear(),'number')}${field('Mes','cm21M',r.mes||new Date().getMonth()+1,'text',cm21Months.map((x,i)=>[i+1,x]))}</div>`:mode==='intervalo'?`<div class="columns">${field('Fecha de inicio','cm21Start',r.inicio||now,'date')}${field('Fecha de término','cm21End',r.fin||now,'date')}</div>`:field('Fecha del acontecimiento','cm21Start',r.inicio||now,'date')}
function cm21Save(){let title=v('cm21Title').trim();if(!title)return alert('Escribe un título.');let cat=v('cm21NewCat').trim()||v('cm21Cat'),kind=v('cm21DateMode');let r={id:cm21EditId||'BIT-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),titulo:title,descripcion:v('cm21Description').trim(),categoria:cat,parent_id:v('cm22Parent')||null,tipo_fecha:kind,inicio:kind==='mes'?null:v('cm21Start')||null,fin:kind==='intervalo'?v('cm21End')||null:null,anio:kind==='mes'?Number(v('cm21Y')):null,mes:kind==='mes'?Number(v('cm21M')):null,profesores:[...document.querySelectorAll('.cm21Teacher:checked')].map(x=>({id:x.value,nombre:teachers().find(t=>t.id===x.value)?.nombre_completo||x.value})),estudiantes:[...document.querySelectorAll('.cm21Student:checked')].map(x=>({id:x.value,nombre:student(x.value)?.nombre_completo||x.value}))};if(kind==='mes'&&(!Number.isInteger(r.anio)||r.anio<1900||r.mes<1||r.mes>12))return alert('Indica un mes y año válidos.');if(!cm21ValidPeriod(r))return alert('Verifica el intervalo de fechas.');let arr=cm21Rows(),index=arr.findIndex(x=>x.id===r.id);if(index>=0)arr[index]=r;else arr.push(r);if(!db.bitacora.categorias.includes(cat))db.bitacora.categorias.push(cat);logChange('bitacora',r.id,index>=0?'Entrada actualizada':'Entrada registrada');closeModal();cm21Page();toast('Entrada guardada en la sesión. Exporta la Base Maestra para conservarla.')}
function cm21Delete(){if(!cm21EditId||!confirm('¿Eliminar esta entrada de la Bitácora y de la próxima exportación JSON? Los eventos hijos quedarán independientes.'))return;cm21Rows().forEach(x=>{if(x.parent_id===cm21EditId)x.parent_id=null});db.bitacora.entradas=cm21Rows().filter(x=>x.id!==cm21EditId);logChange('bitacora',cm21EditId,'Entrada eliminada');closeModal();cm21Page()}
function cm21Exports(){return cm21Filtered().map(r=>[cm21DateLabel(r),r.categoria,r.titulo,r.descripcion,(r.profesores||[]).map(x=>x.nombre).join('; '),(r.estudiantes||[]).map(x=>x.nombre).join('; '),cm21Rows().find(x=>x.id===r.parent_id)?.titulo||''])}
function cm21ExportExcel(){cmExcelFile([['Período','Categoría','Título','Descripción','Profesores','Estudiantes','Circunstancia principal'],...cm21Exports()],`Bitacora_Castellano_${date()}.xls`)}
function cm21ExportPDF(){let rows=cm21Exports(),lines=['BITACORA DE PEDAGOGIA EN CASTELLANO','Universidad Catolica Silva Henriquez','Fecha de generacion: '+date(),'Entradas: '+rows.length,'',...rows.flatMap(x=>['-'.repeat(75),'Periodo: '+x[0]+'  |  Categoria: '+x[1],'Titulo: '+x[2],'Descripcion: '+x[3],'Profesores: '+x[4],'Estudiantes: '+x[5],''])];download(cm19PdfBytes(lines),`Bitacora_Castellano_${date()}.pdf`)}
function cm21TeacherBitacora(id){let rows=cm21Rows().filter(r=>(r.profesores||[]).some(x=>x.id===id)).sort((a,b)=>cm21Range(b)[0].localeCompare(cm21Range(a)[0]));return `<div class="card"><h4>Bitácora (${rows.length})</h4>${rows.map(r=>`<div class="cm21Mini"><b>${esc(r.titulo)}</b> · ${esc(cm21DateLabel(r))}<p class="small muted">${esc(r.categoria)} · ${esc(r.descripcion||'')}</p></div>`).join('')||'<p class="muted">Sin entradas asociadas.</p>'}</div>`}
function cm21StudentBitacora(id){let rows=cm21Rows().filter(r=>(r.estudiantes||[]).some(x=>x.id===id)).sort((a,b)=>cm21Range(b)[0].localeCompare(cm21Range(a)[0]));return `<div class="card"><h4>Bitácora (${rows.length})</h4>${rows.map(r=>`<div class="cm21Mini"><b>${esc(r.titulo)}</b> · ${esc(cm21DateLabel(r))}<p class="small muted">${esc(r.categoria)} · ${esc(r.descripcion||'')}</p></div>`).join('')||'<p class="muted">Sin entradas asociadas.</p>'}</div>`}
const cm21Sections=[['investigacion','Investigación'],['docencia','Docencia'],['guia','Seminarios · Profesor/a guía'],['informante','Seminarios · Profesor/a informante'],['bitacora','Bitácora']];
let cm21ExportTeacher=null;
function cm21TeacherExportDialog(id){cm21ExportTeacher=id;modal(`<div class="row"><h3>Exportar perfil docente</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted">Selecciona las secciones que deseas incluir. Se distinguen los seminarios guiados de aquellos en que participó como informante.</p><label class="cm19Check"><input class="cm21Select" type="checkbox" value="datos" checked> Biodata, categoría académica y grados</label>${cm21Sections.map(([k,t])=>`<label class="cm19Check" style="margin:7px 0"><input class="cm21Select" type="checkbox" value="${k}" checked> ${t}</label>`).join('')}<div class="bar" style="margin-top:15px">${button('Descargar PDF',"cm21ExportTeacherFile('pdf')",'primary')}${button('Descargar Excel',"cm21ExportTeacherFile('xls')")}</div>`)}
function cm21TeacherData(id,sections){let p=academicStore(),arr=[];let teach=teachers().find(x=>x.id===id);if(sections.includes('datos')){arr.push(['Perfil','','Categoría académica',teach?.categoria_academica||'','']);if(teach?.biodata)arr.push(['Perfil','','Biodata',teach.biodata,'']);for(let g of cm22DegreeTypes)if(teach?.grados_academicos?.[g]?.descripcion)arr.push(['Formación','',g,teach.grados_academicos[g].descripcion,teach.grados_academicos[g].en_curso?'En curso':'']);}if(sections.includes('investigacion'))for(let r of p.investigacion||[])if((r.profesores||[]).some(x=>x.id===id))arr.push(['Investigación',r.anio||'',r.tipo||'',r.titulo||'', 'Participante']);if(sections.includes('docencia'))for(let r of p.docencia||[])if((r.profesores||[]).some(x=>x.id===id))arr.push(['Docencia',r.anio||'','Docencia',r.descripcion||'','Participante']);for(let [sec,key,role] of [['guia','guias','Profesor/a guía'],['informante','informantes','Profesor/a informante']])if(sections.includes(sec))for(let r of p.seminarios_grado||[])if((r[key]||[]).some(x=>x.id===id))arr.push(['Seminario de grado',r.anio||'','Seminario',r.titulo||'',role]);if(sections.includes('bitacora'))for(let r of cm21Rows())if((r.profesores||[]).some(x=>x.id===id))arr.push(['Bitácora',cm21DateLabel(r),r.categoria,r.titulo,r.descripcion||'']);return arr}
function cm21ExportTeacherFile(format){let id=cm21ExportTeacher,t=teachers().find(x=>x.id===id);if(!t)return;let sections=[...document.querySelectorAll('.cm21Select:checked')].map(x=>x.value);if(!sections.length)return alert('Selecciona al menos una sección.');let rows=cm21TeacherData(id,sections),headers=['Sección','Año / período','Tipo','Producto o acontecimiento','Rol / descripción'],base='Perfil_Docente_'+(t.nombre_completo||id).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_');if(format==='xls')cmExcelFile([headers,...rows],base+'.xls');else{let lines=['PERFIL ACADEMICO DOCENTE','Pedagogia en Castellano - UCSH','Docente: '+t.nombre_completo,'Fecha: '+date(),'Secciones: '+sections.map(x=>cm21Sections.find(s=>s[0]===x)?.[1]).join(', '),'',...rows.flatMap(x=>['-'.repeat(70),...x.map((v,i)=>headers[i]+': '+v)])];download(cm19PdfBytes(lines),base+'.pdf')}closeModal()}

// Castellano Maestro v23 additions
const cm22DegreeTypes=['Postdoctorado','Doctorado','Magíster','Título profesional','Licenciatura'];
function cm22TeacherExtra(t){return `<div class="card"><h3>Antecedentes académicos</h3>${t.categoria_academica?`<p><b>Categoría académica:</b> ${esc(t.categoria_academica)}</p>`:''}${t.biodata?`<p style="white-space:pre-wrap">${esc(t.biodata)}</p>`:''}${cm22DegreeTypes.filter(g=>t.grados_academicos?.[g]?.descripcion).map(g=>`<div class="cm21Mini"><b>${esc(g)}</b> ${t.grados_academicos[g].en_curso?'<span class="tag en_curso">En curso</span>':''} · ${esc(t.grados_academicos[g].descripcion)}</div>`).join('')||'<p class="muted">Sin formación registrada.</p>'}</div>`}
function cm22EditTeacherExtra(id){let t=teachers().find(x=>x.id===id);if(!t)return;modal(`<div class="row"><h3>Formación y biodata · ${esc(t.nombre_completo)}</h3>${button('Cerrar','closeModal()','small')}</div>${field('Categoría académica','cm22Category',t.categoria_academica||'')}${field('Biodata','cm22Biodata',t.biodata||'','textarea')}<h4>Grados académicos</h4><p class="small muted">Deja vacías las categorías que no correspondan. Las que estén en curso se identificarán en su ficha.</p>${cm22DegreeTypes.map((g,i)=>`<div class="card"><b>${esc(g)}</b>${field('Descripción / institución','cm22Degree'+i,t.grados_academicos?.[g]?.descripcion||'')}<label><input type="checkbox" id="cm22Ongoing${i}" ${t.grados_academicos?.[g]?.en_curso?'checked':''}> En curso</label></div>`).join('')}${button('Guardar datos',`cm22SaveTeacherExtra(${JSON.stringify(id)})`,'primary')}`)}
function cm22SaveTeacherExtra(id){let t=teachers().find(x=>x.id===id);t.categoria_academica=v('cm22Category').trim();t.biodata=v('cm22Biodata').trim();t.grados_academicos={};cm22DegreeTypes.forEach((g,i)=>{let desc=v('cm22Degree'+i).trim();if(desc)t.grados_academicos[g]={descripcion:desc,en_curso:!!document.getElementById('cm22Ongoing'+i)?.checked}});logChange('perfil_docente',id,'Biodata, categoría y formación');closeModal();acadOpenTeacher(id)}
function cm22Norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function cm22FindStudent(value){let k=cm22Norm(value);if(!k)return [];return studentList().filter(s=>cm22Norm(s.rut)===k||cm22Norm(s.nombre_completo)===k)}
function cm22Tabular(text){return String(text||'').trim().split(/\r?\n/).filter(Boolean).map(line=>line.split('\t').map(x=>x.trim()))}
let cm22CourseDraft=[];
function cm22BulkCourseDialog(mode='aprobado'){let state=mode==='reprobado'?'reprobado':'aprobado',title=state==='aprobado'?'Informar cursos aprobados':'Informar cursos reprobados';cm22CourseDraft=[];modal(`<div class="row"><h3>${title} · Pegado desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted">Pega las columnas <b>RUT o nombre del estudiante</b> y <b>código del curso</b>, en cualquier orden. Puedes incluir encabezados. Solo se actualizarán las filas identificadas sin ambigüedad; revisa la vista previa antes de confirmar.</p><div class="notice"><b>Estado que se asignará: ${state==='aprobado'?'APROBADO':'REPROBADO'}.</b> No se modificarán otras asignaturas del estudiante.</div><input type="hidden" id="cm22CourseState" value="${state}"><textarea id="cm22CoursePaste" rows="9" style="width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px" placeholder="RUT\tCódigo del curso\n12345678-9\tRPC502"></textarea><div class="bar">${button('Revisar coincidencias','cm22CoursePreview()','primary')}</div><div id="cm22CourseResult"></div>`)}
function cm22CourseMode(mode,el){$('#cm22CourseState').value=mode;document.querySelectorAll('.cm19Choice').forEach(x=>x.classList.toggle('on',x===el))}
function cm22CoursePreview(){let lines=cm22Tabular(v('cm22CoursePaste'));if(!lines.length)return alert('Pega filas desde Excel');let h=lines[0].map(cm22Norm),identifier=h.findIndex(x=>['rut','run','nombre','nombrecompleto','estudiante','alumno'].includes(x)),cidx=h.findIndex(x=>['curso','codigo','sigla','codigocurso','asignatura'].includes(x));let start=identifier>=0&&cidx>=0?1:0;if(start===0){identifier=0;cidx=1}cm22CourseDraft=lines.slice(start).map((cells,i)=>{let search=cells[identifier]||'',sigla=(cells[cidx]||'').toUpperCase(),matches=cm22FindStudent(search),s=matches.length===1?matches[0]:null,id=s?(sigla.includes(':')?sigla:s.plan_estudio+':'+sigla):null,c=course(id);return {line:i+start+1,search,sigla,s,id,c,ok:!!(s&&c),reason:matches.length!==1?(matches.length?'Nombre ambiguo':'Estudiante no encontrado'):'Asignatura no encontrada en su plan'}});$('#cm22CourseResult').innerHTML=`<p><b>${cm22CourseDraft.filter(x=>x.ok).length} filas listas</b> · ${cm22CourseDraft.filter(x=>!x.ok).length} por revisar</p><div class="tablewrap"><table class="tbl"><tr><th>Fila</th><th>Estudiante</th><th>Curso</th><th>Resultado</th></tr>${cm22CourseDraft.map(x=>`<tr><td>${x.line}</td><td>${esc(x.s?.nombre_completo||x.search)}</td><td>${esc(x.sigla)}</td><td>${x.ok?'Lista':esc(x.reason)}</td></tr>`).join('')}</table></div>${button('Aplicar filas válidas','cm22CourseApply()','primary')}`}
function cm22CourseApply(){let rows=cm22CourseDraft.filter(x=>x.ok),state=v('cm22CourseState');if(!rows.length)return alert('No hay filas válidas.');if(!confirm('Se marcarán '+rows.length+' asignaciones como '+state+'. ¿Continuar?'))return;for(let x of rows){let s=x.s,prev=s.avance_curricular?.[x.id]?.estado||null;s.avance_curricular||={};s.avance_curricular[x.id]={...(s.avance_curricular[x.id]||{}),estado:state,creditos:x.c.creditos};s.historial_avance||=[];s.historial_avance.push({curso_id:x.id,estado_anterior:prev,estado_nuevo:state,fecha:date(),origen:'carga_masiva'});s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=cmApprovedCredits(s);s.fecha_ultima_actualizacion=date()}logChange('avance_masivo',state,rows.length+' estados actualizados');closeModal();studentsPage();toast('Se actualizaron '+rows.length+' estados.')}
function cm22ResetDialog(){let count=studentList().reduce((n,s)=>n+Object.values(s.avance_curricular||{}).filter(x=>x.estado==='en_curso').length,0);modal(`<h3>Restablecer asignaturas en curso</h3><p>Se cambiará el estado <b>En curso</b> a <b>Pendiente</b>. No se eliminarán los registros históricos.</p><p>${count} inscripciones en curso actualmente.</p><label class="cm19Check"><input type="checkbox" id="cm22SkipEPC" checked> Excluir asignaturas EPC</label><label class="cm19Check"><input type="checkbox" id="cm22SkipCFG" checked> Excluir asignaturas CFG</label><div class="bar" style="margin-top:15px">${button('Aplicar cambios','cm22ResetApply()','primary')}${button('Cancelar','closeModal()')}</div>`)}
function cm22ResetApply(){let epc=$('#cm22SkipEPC').checked,cfg=$('#cm22SkipCFG').checked,changes=[];for(let s of studentList())for(let [id,r] of Object.entries(s.avance_curricular||{})){let code=id.split(':').at(-1);if(r.estado!=='en_curso'||(epc&&code.startsWith('EPC'))||(cfg&&code.startsWith('CFG')))continue;changes.push({s,id,r})}if(!confirm('Cambiar '+changes.length+' inscripciones a pendiente?'))return;for(let {s,id,r} of changes){r.estado='pendiente';s.historial_avance||=[];s.historial_avance.push({curso_id:id,estado_anterior:'en_curso',estado_nuevo:'pendiente',fecha:date(),origen:'restablecimiento_masivo'});s.resumen_estados=countStates(s)}logChange('avance_masivo','restablecer_en_curso',changes.length+' registros');closeModal();studentsPage();toast(changes.length+' cursos actualizados')}
const cm22PracticeTypes=['Práctica Inicial','Práctica Intermedia I','Práctica Intermedia II','Práctica profesional I','Práctica Profesional II'];
function cm22PracticeStore(){db.practicas||={periodos:{}};db.practicas.periodos||={};return db.practicas.periodos}
function cm22PracticeKey(y,s){return y+'-'+s}
let cm22PYear='',cm22PSem='',cm22PType='',cm22Group='profesor';
let cm23TeacherKey='';
function cm23TeacherName(t){return t.profesor_id?(teachers().find(x=>x.id===t.profesor_id)?.nombre_completo||t.profesor_manual||'Profesor sin ficha'):t.profesor_manual||'Profesor pendiente'}
function cm23TeacherConfigs(p,cat){p.guias_internos||={};p.guias_internos[cat]||=[];let list=p.guias_internos[cat];for(let r of (p.asignaciones||[]).filter(x=>x.categoria===cat)){let key=r.profesor_id?'id:'+r.profesor_id:r.profesor_manual?'manual:'+cm22Norm(r.profesor_manual):'';if(key&&!list.some(t=>t.key===key))list.push({key,profesor_id:r.profesor_id||null,profesor_manual:r.profesor_manual||null})}return list}
function cm23AddGuideDialog(){let p=cm22Period();if(!p||!cm22PType)return;modal(`<h3>Agregar profesor/a guía interno/a</h3><p class="muted small">Cada profesor tendrá su propia lista de estudiantes para ${esc(cm22PType)} (${esc(cm22PYear)} · semestre ${esc(cm22PSem)}).</p>${field('Profesor/a registrado/a','cm23GuideId','','text',[['','Seleccionar o ingresar manualmente'],...teachers().map(t=>[t.id,t.nombre_completo])])}${field('Nombre manual (si no está en la lista)','cm23GuideManual','')}<div class="bar">${button('Agregar profesor/a','cm23AddGuide()','primary')}${button('Cancelar','closeModal()')}</div>`)}
function cm23AddGuide(){let p=cm22Period(),id=v('cm23GuideId'),name=v('cm23GuideManual').trim(),t=id?teachers().find(x=>x.id===id):null;if(!t&&!name)return alert('Selecciona o escribe el nombre del profesor guía interno.');let key=t?'id:'+t.id:'manual:'+cm22Norm(name),arr=cm23TeacherConfigs(p,cm22PType);if(arr.some(x=>x.key===key))return alert('Ese profesor ya está configurado para esta categoría.');arr.push({key,profesor_id:t?.id||null,profesor_manual:t?null:name});cm23TeacherKey=key;logChange('practicas_guias',cm22PracticeKey(p.anio,p.semestre),'Profesor guía interno incorporado');closeModal();cm22PracticePaint()}
function cm23TeacherForKey(p,cat,key){return cm23TeacherConfigs(p,cat).find(t=>t.key===key)||null}
function cm23RecordTeacherKey(rec){return rec.profesor_id?'id:'+rec.profesor_id:rec.profesor_manual?'manual:'+cm22Norm(rec.profesor_manual):''}
function cm23RemoveGuide(key){let p=cm22Period(),list=cm23TeacherConfigs(p,cm22PType),t=list.find(x=>x.key===key);if(!t)return;let n=p.asignaciones.filter(r=>r.categoria===cm22PType&&cm23RecordTeacherKey(r)===key).length;if(n)return alert('Este profesor tiene '+n+' estudiantes asignados. Reasigna sus estudiantes antes de quitarlo.');if(!confirm('¿Quitar a este profesor de la categoría?'))return;p.guias_internos[cm22PType]=list.filter(x=>x.key!==key);cm23TeacherKey='';logChange('practicas_guias',key,'Profesor retirado');cm22PracticePaint()}
function cm22PracticePage(){let store=cm22PracticeStore(),years=[...new Set(Object.values(store).map(x=>String(x.anio)))].sort((a,b)=>b.localeCompare(a));cm22PYear=cm22PYear||years[0]||String(new Date().getFullYear());let semesters=[1,2].filter(t=>store[cm22PracticeKey(cm22PYear,t)]);cm22PSem=semesters.includes(Number(cm22PSem))?String(cm22PSem):String(semesters[0]||1);$('#screen').innerHTML=`<div class="card"><h3>Prácticas · seguimiento por período</h3><p class="muted">Selecciona año, semestre, categoría y profesor guía interno. Cada profesor tiene una nómina independiente y puede recibir estudiantes desde Excel.</p><div class="bar">${button('Crear período','cm22NewPracticePeriod()','primary')}${button('Colegios y estadísticas','cm22PracticeSchools()')}</div><div class="cm19Cards">${years.map(y=>`<button class="cm19Choice ${cm22PYear===y?'on':''}" onclick="cm22PYear='${y}';cm22PSem='';cm23TeacherKey='';cm22PracticePage()">${y}</button>`).join('')}</div><div class="cm19Cards">${[1,2].map(sem=>`<button class="cm19Choice ${cm22PSem===String(sem)?'on':''}" onclick="cm22PSem='${sem}';cm23TeacherKey='';cm22PracticePage()">Semestre ${sem}</button>`).join('')}</div></div><div id="cm22PracticeBody"></div>`;cm22PracticePaint()}
function cm22NewPracticePeriod(){modal(`<h3>Crear bolsa de prácticas</h3><div class="columns">${field('Año','cm22NewYear',new Date().getFullYear(),'number')}${field('Semestre','cm22NewSem','1','text',[['1','Primero'],['2','Segundo']])}</div><p>Selecciona las categorías habilitadas:</p>${cm22PracticeTypes.map(t=>`<label class="cm19Check"><input type="checkbox" class="cm22Enabled" value="${esc(t)}" checked> ${esc(t)}</label>`).join('')}${button('Crear período','cm22CreatePeriod()','primary')}`)}
function cm22CreatePeriod(){let y=+v('cm22NewYear'),sem=+v('cm22NewSem');if(!Number.isInteger(y)||y<2000||y>2200)return alert('Año inválido');let st=cm22PracticeStore(),key=cm22PracticeKey(y,sem);if(!st[key])st[key]={anio:y,semestre:sem,categorias:[],asignaciones:[]};st[key].categorias=[...new Set([...st[key].categorias,...[...document.querySelectorAll('.cm22Enabled:checked')].map(x=>x.value)])];cm22PYear=String(y);cm22PSem=String(sem);logChange('practicas',key,'Configuración de período');closeModal();cm22PracticePage()}
function cm22Period(){return cm22PracticeStore()[cm22PracticeKey(cm22PYear,cm22PSem)]}
function cm22PracticePaint(){let el=$('#cm22PracticeBody'),p=cm22Period();if(!p){el.innerHTML='<div class="card muted">Todavía no hay prácticas configuradas para este período. Crea primero una bolsa de prácticas.</div>';return}cm22PType=p.categorias.includes(cm22PType)?cm22PType:p.categorias[0]||'';let list=cm23TeacherConfigs(p,cm22PType),filtered=(p.asignaciones||[]).filter(x=>x.categoria===cm22PType);if(!list.some(t=>t.key===cm23TeacherKey))cm23TeacherKey=list[0]?.key||'';let guide=cm23TeacherForKey(p,cm22PType,cm23TeacherKey),records=filtered.filter(x=>cm23RecordTeacherKey(x)===cm23TeacherKey);let missing=records.filter(x=>!x.colegio).length;let groups={};for(let r of records){let group=cm22Group==='colegio'?(r.colegio||'Colegio pendiente'):'Nómina de '+cm23TeacherName(guide);(groups[group]||=[]).push(r)}el.innerHTML=`<div class="card"><h3>${esc(cm22PYear)} · Semestre ${esc(cm22PSem)}</h3><p class="small muted">1. Selecciona la categoría de práctica. 2. Selecciona o agrega profesores guía internos. 3. Agrega estudiantes individualmente o mediante Excel.</p><div class="cm19Cards">${p.categorias.map(t=>`<button class="cm19Choice ${cm22PType===t?'on':''}" onclick="cm22PType=${esc(JSON.stringify(t))};cm23TeacherKey='';cm22PracticePaint()">${esc(t)} · ${filtered.length&&t===cm22PType?filtered.length:(p.asignaciones||[]).filter(x=>x.categoria===t).length}</button>`).join('')}</div><div class="row" style="margin-top:16px"><h3>Profesores guía internos</h3>${button('+ Agregar profesor/a guía','cm23AddGuideDialog()','primary')}</div><div class="cm19Cards">${list.map(t=>`<button class="cm19Choice ${cm23TeacherKey===t.key?'on':''}" onclick="cm23TeacherKey=${esc(JSON.stringify(t.key))};cm22PracticePaint()"><b>${esc(cm23TeacherName(t))}</b><div class="small muted">${filtered.filter(r=>cm23RecordTeacherKey(r)===t.key).length} estudiantes</div></button>`).join('')||'<p class="muted">Agrega el primer profesor guía interno para esta categoría.</p>'}</div></div>${guide?`<div class="card"><div class="row"><div><h3>${esc(cm23TeacherName(guide))}</h3><p class="muted small">Profesor/a guía interno/a · ${esc(cm22PType)}</p></div><div class="bar">${button('Agregar estudiante','cm22PracticeEdit()','primary')}${button('Pegar estudiantes desde Excel','cm22PracticeBulkDialog()')}${button('Quitar profesor/a',`cm23RemoveGuide(${JSON.stringify(guide.key)})`,'small danger')}</div></div>${missing?`<div class="notice warning"><b>Datos pendientes:</b> ${missing} estudiante(s) todavía no tienen colegio informado. Puedes completar ese dato al abrir sus fichas.</div>`:''}<div class="cm19Cards">${[['profesor','Nómina del profesor'],['colegio','Agrupar por colegio']].map(([key,title])=>`<button class="cm19Choice ${cm22Group===key?'on':''}" onclick="cm22Group='${key}';cm22PracticePaint()">${title}</button>`).join('')}</div></div>${Object.entries(groups).map(([name,rr])=>`<div class="card"><h3>${esc(name)} <span class="tag">${rr.length}</span></h3><div class="grid">${rr.map(r=>`<button class="cm19Choice" style="border-left:5px solid ${r.colegio?'#2f759e':'#c38a35'}" onclick="cm22PracticeEdit(${esc(JSON.stringify(r.id))})"><b>${esc(student(r.estudiante_ref)?.nombre_completo||r.estudiante_nombre||'Estudiante sin identificar')}</b><div class="small muted">${esc(r.colegio||'⚠ Colegio pendiente')}</div></button>`).join('')}</div></div>`).join('')||'<div class="card muted">Este profesor todavía no tiene estudiantes asignados.</div>'}`:'<div class="notice">Selecciona un profesor guía interno para administrar su nómina.</div>'}`}
function cm22PracticeEdit(id=null){let p=cm22Period();if(!p)return;let r=p.asignaciones.find(x=>x.id===id)||{},key=id?cm23RecordTeacherKey(r):cm23TeacherKey,guide=cm23TeacherForKey(p,r.categoria||cm22PType,key);if(!guide)return alert('Primero selecciona un profesor guía interno para esta categoría.');modal(`<div class="row"><h3>${id?'Editar':'Agregar'} estudiante en práctica</h3>${button('Cerrar','closeModal()','small')}</div><p class="notice small"><b>${esc(r.categoria||cm22PType)}</b> · ${esc(cm23TeacherName(guide))} · ${esc(cm22PYear)} / semestre ${esc(cm22PSem)}</p>${field('Buscar estudiante por RUT o nombre','cm22PrSearch',r.estudiante_ref||r.estudiante_nombre||'')}<div id="cm22PrMatch" class="small muted"></div>${field('Colegio (opcional)','cm22PrSchool',r.colegio||'')}${field('Observaciones','cm22PrNotes',r.observaciones||'','textarea')}<p class="small muted">Cuando no se consigne colegio, la ficha mostrará «Colegio pendiente».</p><div class="bar">${button('Guardar asignación',`cm22PracticeSave(${JSON.stringify(id)},${JSON.stringify(guide.key)})`,'primary')}${id?button('Eliminar',`cm22PracticeDelete(${JSON.stringify(id)})`,'danger'):''}</div>`);$('#cm22PrSearch').oninput=()=>{let a=cm22LooseStudent(v('cm22PrSearch'));$('#cm22PrMatch').textContent=a.length===1?'Coincidencia: '+a[0].nombre_completo:a.length>1?'Nombre ambiguo: utiliza el RUT':'Sin coincidencia exacta; revisa la identificación.'};$('#cm22PrSearch').dispatchEvent(new Event('input'))}
function cm22LooseStudent(q){let norm=cm22Norm(q);return !norm?[]:studentList().filter(s=>cm22Norm(s.rut)===norm||cm22Norm(s.nombre_completo)===norm)}
function cm22PracticeSave(id,key){let p=cm22Period(),q=v('cm22PrSearch').trim(),matches=cm22LooseStudent(q);if(!q)return alert('Identifica al estudiante.');if(matches.length>1)return alert('Hay varios estudiantes con ese nombre. Utiliza el RUT.');let old=p.asignaciones.find(x=>x.id===id),cat=old?.categoria||cm22PType,guide=cm23TeacherForKey(p,cat,key);if(!guide)return alert('Profesor guía interno no encontrado.');let r=old||{id:'PRA-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)};Object.assign(r,{categoria:cat,estudiante_ref:matches[0]?.rut||null,estudiante_nombre:matches[0]?.nombre_completo||q,profesor_id:guide.profesor_id||null,profesor_manual:guide.profesor_manual||null,colegio:v('cm22PrSchool').trim()||null,observaciones:v('cm22PrNotes').trim()||null});if(!old)p.asignaciones.push(r);cm23TeacherKey=key;logChange('practicas',cm22PracticeKey(p.anio,p.semestre),'Estudiante asignado a profesor guía interno');closeModal();cm22PracticePaint()}
function cm22PracticeDelete(id){if(!confirm('¿Eliminar esta asignación?'))return;let p=cm22Period();p.asignaciones=p.asignaciones.filter(x=>x.id!==id);logChange('practicas',id,'Asignación eliminada');closeModal();cm22PracticePaint()}
let cm22PrDraft=[];
function cm22PracticeBulkDialog(){let p=cm22Period(),guide=p&&cm23TeacherForKey(p,cm22PType,cm23TeacherKey);if(!guide)return alert('Selecciona antes la categoría y el profesor guía interno.');modal(`<h3>Importar estudiantes desde Excel</h3><p class="notice small"><b>Destino de todas las filas:</b> ${esc(cm22PYear)} · Semestre ${esc(cm22PSem)} · ${esc(cm22PType)} · ${esc(cm23TeacherName(guide))}.</p><p class="small muted">Pega RUT o nombre, con o sin encabezados. Opcionalmente agrega una columna Colegio. También se admite una sola columna con RUT o nombre. Ningún profesor guía externo se registra.</p><textarea id="cm22PrPaste" style="width:100%;padding:12px" rows="10" placeholder="RUT\tColegio\n12345678-9\tColegio de ejemplo\n98765432-1"></textarea><div class="bar">${button('Previsualizar estudiantes','cm22PracticeBulkPreview()','primary')}${button('Cancelar','closeModal()')}</div><div id="cm22PrPreview"></div>`)}
function cm22PracticeBulkPreview(){let rows=cm22Tabular(v('cm22PrPaste'));if(!rows.length)return alert('Pega estudiantes desde Excel.');let hdr=rows[0].map(cm22Norm),studAliases=['rut','run','nombre','nombrecompleto','estudiante','alumno','alumna'],schoolAliases=['colegio','establecimiento','centropractica','institucion'];let si=hdr.findIndex(x=>studAliases.includes(x)),ci=hdr.findIndex(x=>schoolAliases.includes(x)),head=si>=0;if(!head){si=0;ci=1}let p=cm22Period(),guide=cm23TeacherForKey(p,cm22PType,cm23TeacherKey);if(!guide)return alert('Selecciona nuevamente un profesor guía.');cm22PrDraft=rows.slice(head?1:0).map((cells,i)=>{let q=(cells[si]||'').trim(),matches=cm22LooseStudent(q),school=ci>=0?(cells[ci]||'').trim():'';return {line:i+1+(head?1:0),q,studentRef:matches.length===1?matches[0].rut:null,studentName:matches.length===1?matches[0].nombre_completo:q,school,valid:!!q&&matches.length===1,issue:!q?'Sin identificación':matches.length>1?'Nombre ambiguo':matches.length===0?'Estudiante no encontrado en el JSON':''}});let good=cm22PrDraft.filter(x=>x.valid);$('#cm22PrPreview').innerHTML=`<p><b>${good.length} estudiantes identificados</b> · ${cm22PrDraft.length-good.length} filas por revisar</p><div class="tablewrap"><table class="tbl"><tr><th>Fila</th><th>Estudiante</th><th>Colegio</th><th>Estado</th></tr>${cm22PrDraft.map(x=>`<tr><td>${x.line}</td><td>${esc(x.studentName||'—')}</td><td>${esc(x.school||'Pendiente')}</td><td>${esc(x.issue||'Listo')}</td></tr>`).join('')}</table></div>${good.some(x=>!x.school)?'<div class="notice warning">Hay colegios pendientes. Podrás completarlos después en cada ficha.</div>':''}${button('Importar estudiantes identificados','cm22PracticeBulkApply()','primary')}`}
function cm22PracticeBulkApply(){let good=cm22PrDraft.filter(x=>x.valid),p=cm22Period(),guide=cm23TeacherForKey(p,cm22PType,cm23TeacherKey);if(!guide||!good.length)return alert('No hay estudiantes válidos o falta el profesor guía.');let added=0,updated=0;for(let x of good){let r=p.asignaciones.find(a=>a.categoria===cm22PType&&a.estudiante_ref===x.studentRef&&cm23RecordTeacherKey(a)===guide.key);if(!r){r={id:'PRA-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)};p.asignaciones.push(r);added++}else updated++;Object.assign(r,{categoria:cm22PType,estudiante_ref:x.studentRef,estudiante_nombre:x.studentName,profesor_id:guide.profesor_id||null,profesor_manual:guide.profesor_manual||null,colegio:x.school||r.colegio||null})}logChange('practicas','importacion_excel',added+' incorporados, '+updated+' actualizados');closeModal();cm22PracticePaint();toast(added+' estudiantes incorporados; '+updated+' actualizados.')}
function cm22PracticeSchools(){let all=Object.values(cm22PracticeStore()).flatMap(p=>(p.asignaciones||[]).map(r=>({...r,anio:p.anio,semestre:p.semestre}))),years=[...new Set(all.map(x=>String(x.anio)))].sort();modal(`<h3>Colegios de práctica · histórico</h3>${field('Filtrar año','cm22SchoolYear','','text',[['','Todos los años'],...years.map(y=>[y,y])])}<div id="cm22SchoolTable"></div>${button('Cerrar','closeModal()')}`);$('#cm22SchoolYear').onchange=cm22SchoolPaint;cm22SchoolPaint()}
function cm22SchoolPaint(){let y=v('cm22SchoolYear'),p=Object.values(cm22PracticeStore()),rows=p.flatMap(per=>(per.asignaciones||[]).map(r=>({anio:per.anio,semestre:per.semestre,colegio:r.colegio||'Sin colegio',id:r.estudiante_ref||r.estudiante_nombre}))).filter(r=>!y||String(r.anio)===y),g=new Map();for(let r of rows){let key=r.colegio+'|'+r.anio+'|'+r.semestre;if(!g.has(key))g.set(key,{...r,ids:new Set()});g.get(key).ids.add(r.id)}$('#cm22SchoolTable').innerHTML=`<table class="tbl"><tr><th>Colegio</th><th>Año</th><th>Semestre</th><th>Estudiantes</th></tr>${[...g.values()].sort((a,b)=>b.anio-a.anio||a.colegio.localeCompare(b.colegio)).map(x=>`<tr><td>${esc(x.colegio)}</td><td>${x.anio}</td><td>${x.semestre}</td><td>${x.ids.size}</td></tr>`).join('')}</table>`}
function cm22StudentPractice(rut){let rows=Object.values(cm22PracticeStore()).flatMap(p=>(p.asignaciones||[]).filter(a=>a.estudiante_ref===rut).map(a=>({...a,anio:p.anio,semestre:p.semestre})));return `<div class="card"><h4>Prácticas (${rows.length})</h4>${rows.map(r=>`<div class="cm21Mini"><b>${esc(r.categoria)}</b> · ${r.anio}-${r.semestre} · ${esc(r.colegio||'Colegio pendiente')}</div>`).join('')||'<p class="muted">Sin prácticas registradas.</p>'}</div>`}
function cm22TeacherPractice(id){let rows=Object.values(cm22PracticeStore()).flatMap(p=>(p.asignaciones||[]).filter(a=>a.profesor_id===id).map(a=>({...a,anio:p.anio,semestre:p.semestre})));return `<div class="card"><h4>Prácticas guiadas (${rows.length})</h4>${rows.map(r=>`<div class="cm21Mini"><b>${esc(r.categoria)}</b> · ${r.anio}-${r.semestre}<p class="small">${esc(student(r.estudiante_ref)?.nombre_completo||r.estudiante_nombre)} · ${esc(r.colegio||'Colegio pendiente')}</p></div>`).join('')||'<p class="muted">Sin prácticas asociadas.</p>'}</div>`}

</script></body></html>
