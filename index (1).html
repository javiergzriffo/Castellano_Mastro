function cm19Render(){let root=$('#screen');if(!db)return;let mode=cm19.mode,k=cm19.kind;let rec=cm19Available();let related=cm19.group?rec.filter(x=>x.group===cm19.group):rec;let years=[...new Set(related.map(x=>x.year).filter(Number.isFinite))].sort((a,b)=>b-a);if(!years.includes(Number(cm19.year)))cm19.year=years[0]??null;if(!years.includes(Number(cm19.year2))||cm19.year2===cm19.year)cm19.year2=years.find(x=>x!==cm19.year)??null;let groups=[...new Set(rec.map(x=>x.group))].sort();if(!groups.includes(cm19.group))cm19.group=groups[0]||'';years=[...new Set(rec.filter(x=>x.group===cm19.group).map(x=>x.year))].sort((a,b)=>b-a);if(!years.includes(Number(cm19.year)))cm19.year=years[0]??null;if(!years.includes(Number(cm19.year2))||cm19.year2===cm19.year)cm19.year2=years.find(x=>x!==cm19.year)??null;let sems=[...new Set(rec.filter(x=>x.group===cm19.group&&x.year===cm19.year).map(x=>x.sem).filter(Boolean))].sort();if(!sems.includes(cm19.sem))cm19.sem=sems[0]||'';let labels={hito:'Resultados HITO',eif:'Resultados EIF',end:'Resultados END'};root.innerHTML=`<div class="card"><h3>Centro de análisis y reportes</h3><p class="muted">Elige primero qué deseas analizar. Solo se ofrecen períodos con resultados guardados.</p><p class="label">¿Qué resultados deseas analizar?</p>${cm19Cards(['hito','eif','end'].map(t=>[t,labels[t]]),k,'cm19ChangeKind')}<div style="margin-top:15px">${cm19Cards([['global','Resultados globales'],['individual','Estudiantes y grupos']],mode,'cm19ChangeMode')}</div></div>${mode==='global'?`<div class="card"><h3>2. Período y comparación</h3>${cm19Cards([['one','Un año'],['two','Comparar dos años'],['historical','Serie histórica']],cm19.scope,'cm19SetScope')}${years.length?`<p class="label">${cm19.scope==='two'?'Primer año':'Año de referencia'}</p>${cm19Cards(years.map(y=>[y,String(y)]),cm19.year,'cm19SetYear')}`:'<div class="notice">No hay resultados guardados para esta fuente.</div>'}${cm19.scope==='two'&&years.length>1?`<p class="label">Segundo año</p>${cm19 function cm19Show(){cm19SyncMetrics();cm19.filters={code:v('cm19Code').trim(),cohort:v('cm19Cohort')};let rec=cm19Available().filter(x=>x.group===cm19.group);let scope=cm19.scope,years=scope==='historical'?[...new Set(rec.map(x=>x.year))].sort((a,b)=>a-b):scope==='two'?[cm19.year,cm19.year2].filter(Boolean):[cm19.year];let cols=['Año','Prueba / curso','Semestre','Indicador','Descripción','N',...cm19.metrics.map(id=>cm19Features[id])],rows=[];for(let year of years){let subset=rec.filter(x=>x.year===year&&(cm19.kind!=='eif'||String(x.sem)===cm19.sem||scope==='historical'));let computed={};if(cm19.kind==='hito'){let r=subset.map(x=>x.raw).filter(x=>!cm19.filters.cohort||String(student(x.estudiante_ref)?.ingreso?.anio)===cm19.filters.cohort);computed=cm19HitoStats(r)}else if(cm19.kind==='eif'){for(let x of subset)for(let [code,st] of Object.entries(x.raw.indicadores||{})){computed[code+'|'+x.sem]=st}}else{let end=subset[0]?.raw;computed={...(end?.metricas||{})};for(let code of Object.keys(end?.promedios_nacionales||{}))computed[code]||={}}
for(let [key,st] of Object.entries(computed).sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true}))){let [code,sem]=cm19.kind==='eif'?key.split('|'):[key,''];let name=cm19Labels(cm19.kind,code);if(cm19.filters.code&&!(`${code} ${name}`.toLowerCase().includes(cm19.filters.code.toLowerCase())))continue;let m=cm19MapStats(st);if(cm19.kind==='end'){let nat=subset[0]?.raw?.promedios_nacionales?.[code]?.promedio,prev=cm19END()[String(Number(year)-1)]?.[cm19.group]?.metricas?.[code]?.promedio;m.nat=Number.isFinite(st.promedio)&&Number.isFinite(nat)?st.promedio-nat:null;m.prev=Number.isFinite(st.promedio)&&Number.isFinite(prev)?st.promedio-prev:null}rows.push([year,cm19.group,sem,code,name,st?.n??'',...cm19.metrics.map(id=>cm19Value(m[id]))])}}

function cm19ShowIndividuals(){let q=v('cm19Person').trim().toLowerCase(),entry=v('cm19Entry'),plan=v('cm19Plan'),cid=v('cm19Course'),target=v('cm19IndHito'),year=v('cm19IndYear');let allowed=new Set(studentList().filter(s=>(!q||(s.nombre_completo+' '+s.rut).toLowerCase().includes(q))&&(!entry||String(s.ingreso?.anio)===entry)&&(!plan||s.plan_estudio===plan)&&(!cid||s.avance_curricular?.[cid]?.estado==='en_curso')).map(s=>s.rut));let all=cm19HITO().filter(r=>Object.keys(cmScores(r,'hito')).length&&(!target||r.tipo_hito===target)&&(!year||String(r.anio_rendicion)===year));let groups=new Map(),current=new Map();for(let r of all){for(let [code,vals] of Object.entries(cmScores(r,'hito'))){let pct=r.logro_por_ra?.[code];if(!Number.isFinite(pct))pct=cmPct(cmMean(vals),cmScale(r,code));if(!Number.isFinite(pct))continue;let g=[r.tipo_hito,r.anio_rendicion,code].join('|'),id=g+'|'+r.estudiante_ref,prior=current.get(id);if(!prior||Number(r.instancia||1)>=Number(prior.instancia||1))current.set(id,{r,code,pct,group:g})}}for(let x of current.values())(groups.get(x.group)|| (groups.set(x.group,[]),groups.get(x.group))).push(x.pct);let rows=[];for(let x of current.values()){let r=x.r,s=student(r.estudiante_ref);if(!allowed.has(r.estudiante_ref))continue;let vals=groups.get(x.group).sort((a,b)=>a-b);let below=vals.filter(n=>n<x.pct).length,equal=vals.filter(n=>n===x.pct).length;let percentile=(below+equal/2)/vals.length,quartile=Math.min(4,Math.max(1,Math.ceil(percentile*4)));rows.push([s.nombre_completo,s.rut,s.plan_estudio,s.ingreso?.anio||'',r.tipo_hito,r.anio_rendicion,x.code,cm19Labels('hito',x.code),cm19Value(x.pct),quartile,vals.length])}rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'es')||Number(a[5])-Number(b[5]));cm19.headers=['Estudiante','RUT','Plan','Año de ingreso','HITO','Año rendición','RA','Resultado de aprendizaje','Logro (%)','Cuartil','N del grupo'];cm19.output=rows;cm19.label='Resultados individuales HITO y cuartiles';cm19Paint()}

function cm19PdfBytes(lines){let pages=[],page=[],max=43;for(let line of lines){let str=String(line).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');for(let i=0;i<str.length;i+=108){page.push(str.slice(i,i+108));if(page.length>=max){pages.push(page);page=[]}}}if(page.length||!pages.length)pages.push(page);let objs=[null],add=s=>(objs.push(s),objs.length-1),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>'),pagesId=add('');let ids=[];for(let p of pages){let content=`BT /F1 8 Tf 38 790 Td 11 TL ${p.map((l,i)=>`${i?'T* ':''}(${l.replace(/[\\()]/g,'\\$&')}) Tj`).join('\n')} ET`,stream=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`),pg=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${stream} 0 R >>`);ids.push(pg)}objs[pagesId]=`<< /Type /Pages /Kids [${ids.map(id=>id+' 0 R').join(' ')}] /Count ${ids.length} >>`;let root=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`),out='%PDF-1.4\n',offsets=[0];for(let i=1;i<objs.length;i++){offsets.push(out.length);out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}let start=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;for(let i=1;i<objs.length;i++)out+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;out+=`trailer\n<< /Size ${objs.length} /Root ${root} 0 R >>\nstartxref\n${start}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
function cm19ExportPDF(){if(!cm19.output.length)return alert('Primero pulsa Visualizar resultados.');let lines=['CASTELLANO MAESTRO | '+cm19.label,'Fecha: '+date(),'Registros: '+cm19.output.length,'',...cm19.output.flatMap(row=>['-' .repeat(94),...cm19.headers.map((h,i)=>h+': '+String(row[i]??''))])];download(cm19PdfBytes(lines),`Informe_${cm19.mode}_${cm19.kind}_${date()}.pdf`);toast('PDF descargado directamente; no requiere impresión.')}

let cm20Type='',cm20Year=null,cm20List=[];
function cm20Rends(){return (db?.resultados_hito?.rendiciones||[]).filter(r=>/^HITO_(400|800|1000)$/.test(r.tipo_hito||'')&&r.estudiante_ref&&Object.keys(cmScores(r,'hito')).length)}
function cm20Value(r,code){let x=r.logro_por_ra?.[code];if(x!==undefined&&x!==null&&x!==''&&Number.isFinite(Number(x)))return Number(x);let y=cmMean(cmScores(r,'hito')[code]||[]);return y===null?null:cmPct(y,cmScale(r,code))}
function cm20Rows(r){return Object.keys(cmScores(r,'hito')).map(code=>({code,pct:cm20Value(r,code)})).filter(x=>Number.isFinite(x.pct))}
function cm20Latest(){let m=new Map();for(let r of cm20Rends()){let key=[r.estudiante_ref,r.tipo_hito,r.anio_rendicion].join('|'),prior=m.get(key);if(!prior||Number(r.instancia||1)>=Number(prior.instancia||1))m.set(key,r)}return [...m.values()].filter(r=>cm20Rows(r).length)}

function cm21Form(id=null){let r=cm21Rows().find(x=>x.id===id)||{},kind=r.tipo_fecha||'dia';cm21EditId=id;modal(`<div class="row"><h3>${id?'Editar':'Agregar'} entrada de Bitácora</h3>${button('Cerrar','closeModal()','small')}</div>${field('Título','cm21Title',r.titulo||'')}${field('Descripción breve','cm21Description',r.descripcion||'','textarea')}<div class="field"><span class="label">Tipo de fecha</span><div class="cm19Cards">${[['dia','Día específico'],['mes','Mes y año'],['intervalo','Intervalo de fechas']].map(([k,t])=>`<button class="cm19Choice ${kind===k?'on':''}" onclick="cm21SetDateMode('${k}')" data-cm21-mode="${k}">${t}</button>`).join('')}</div></div><input type="hidden" id="cm21DateMode" value="${kind}"><div id="cm21DateFields"></div>${field('Categoría','cm21Cat',r.categoria||'Comunidad','text',cm21Categories().map(x=>[x,x]))}${field('Nueva categoría (opcional)','cm21NewCat','')}${field('Anidar dentro de una circunstancia','cm22Parent',r.parent_id||'','text',[['','Evento independiente'],...cm21Rows().filter(x=>x.categoria==='Circunstancia'&&x.id!==id).map(x=>[x.id,x.titulo])])}<h4>Profesores participantes</h4><div class="cm21People">${teachers().map(t=>`<label><input class="cm21Teacher" type="checkbox" value="${esc(t.id)}" ${(r.profesores||[]).some(x=>x.id===t.id)?'checked':''}> ${esc(t.nombre_completo)}</label>`).join('')}</div><h4>Estudiantes participantes</h4>${field('Buscar estudiante','cm21SearchStudent','')}<div class="cm21People" id="cm21StudentPeople">${studentList().sort((a,b)=>a.nombre_completo.localeCompare(b.nombre_completo,'es')).map(s=>`<label data-name="${esc(s.nombre_completo.toLowerCase()+' '+s.rut)}"><input class="cm21Student" type="checkbox" value="${esc(s.rut)}" ${(r.estudiantes||[]).some(x=>x.id===s.rut)?'checked':''}> ${esc(s.nombre_completo)}</label>`).join('')}</div><div class="bar" style="margin-top:16px">${button('Guardar entrada','cm21Save()','primary')}${id?button('Eliminar entrada','cm21Delete()','danger'):''}</div>`);cm21DateFields(r);$('#cm21SearchStudent').oninput=()=>{let q=v('cm21SearchStudent').toLowerCase();document.querySelectorAll('#cm21StudentPeople label').forEach(x=>x.hidden=!x.dataset.name.includes(q))}}
function cm21SetDateMode(k){$('#cm21DateMode').value=k;document.querySelectorAll('[data-cm21-mode]').forEach(x=>x.classList.toggle('on',x.dataset.cm21Mode===k));cm21DateFields({})}
function cm21DateFields(r){let mode=v('cm21DateMode'),now=date();$('#cm21DateFields').innerHTML=mode==='mes'?`<div class="columns">${field('Año','cm21Y',r.anio||new Date().getFullYear(),'number')}${field('Mes','cm21M',r.mes||new Date().getMonth()+1,'text',cm21Months.map((x,i)=>[i+1,x]))}</div>`:mode==='intervalo'?`<div class="columns">${field('Fecha de inicio','cm21Start',r.inicio||now,'date')}${field('Fecha de término','cm21End',r.fin||now,'date')}</div>`:field('Fecha del acontecimiento','cm21Start',r.inicio||now,'date')}
function cm21Save(){let title=v('cm21Title').trim();if(!title)return alert('Escribe un título.');let cat=v('cm21NewCat').trim()||v('cm21Cat'),kind=v('cm21DateMode');let r={id:cm21EditId||'BIT-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),titulo:title,descripcion:v('cm21Description').trim(),categoria:cat,parent_id:v('cm22Parent')||null,tipo_fecha:kind,inicio:kind==='mes'?null:v('cm21Start')||null,fin:kind==='intervalo'?v('cm21End')||null:null,anio:kind==='mes'?Number(v('cm21Y')):null,mes:kind==='mes'?Number(v('cm21M')):null,profesores:[...document.querySelectorAll('.cm21Teacher:checked')].map(x=>({id:x.value,nombre:teachers().find(t=>t.id===x.value)?.nombre_completo||x.value})),estudiantes:[...document.querySelectorAll('.cm21Student:checked')].map(x=>({id:x.value,nombre:student(x.value)?.nombre_completo||x.value}))};if(kind==='mes'&&(!Number.isInteger(r.anio)||r.anio<1900||r.mes<1||r.mes>12))return alert('Indica un mes y año válidos.');if(!cm21ValidPeriod(r))return alert('Verifica el intervalo de fechas.');let arr=cm21Rows(),index=arr.findIndex(x=>x.id===r.id);if(index>=0)arr[index]=r;else arr.push(r);if(!db.bitacora.categorias.includes(cat))db.bitacora.categorias.push(cat);logChange('bitacora',r.id,index>=0?'Entrada actualizada':'Entrada registrada');closeModal();cm21Page();toast('Entrada guardada en la sesión. Exporta la Base Maestra para conservarla.')}
function cm21Delete(){if(!cm21EditId||!confirm('¿Eliminar esta entrada de la Bitácora y de la próxima exportación JSON? Los eventos hijos quedarán independientes.'))return;cm21Rows().forEach(x=>{if(x.parent_id===cm21EditId)x.parent_id=null});db.bitacora.entradas=cm21Rows().filter(x=>x.id!==cm21EditId);logChange('bitacora',cm21EditId,'Entrada eliminada');closeModal();cm21Page()}
function cm21Exports(){return cm21Filtered().map(r=>[cm21DateLabel(r),r.categoria,r.titulo,r.descripcion,(r.profesores||[]).map(x=>x.nombre).join('; '),(r.estudiantes||[]).map(x=>x.nombre).join('; '),cm21Rows().find(x=>x.id===r.parent_id)?.titulo||''])}
function cm21ExportExcel(){cmExcelFile([['Período','Categoría','Título','Descripción','Profesores','Estudiantes','Circunstancia principal'],...cm21Exports()],`Bitacora_Castellano_${date()}.xls`)}
function cm21ExportPDF(){let rows=cm21Exports(),lines=['BITACORA DE PEDAGOGIA EN CASTELLANO','Universidad Catolica Silva Henriquez','Fecha de generacion: '+date(),'Entradas: '+rows.length,'',...rows.flatMap(x=>['-'.repeat(75),'Periodo: '+x[0]+'  |  Categoria: '+x[1],'Titulo: '+x[2],'Descripcion: '+x[3],'Profesores: '+x[4],'Estudiantes: '+x[5],''])];download(cm19PdfBytes(lines),`Bitacora_Castellano_${date()}.pdf`)}
function cm21TeacherBitacora(id){let rows=cm21Rows().filter(r=>(r.profesores||[]).some(x=>x.id===id)).sort((a,b)=>cm21Range(b)[0].localeCompare(cm21Range(a)[0]));return `<div class="card"><h4>Bitácora (${rows.length})</h4>${rows.map(r=>`<div class="cm21Mini"><b>${esc(r.titulo)}</b> · ${esc(cm21DateLabel(r))}<p class="small muted">${esc(r.categoria)} · ${esc(r.descripcion||'')}</p></div>`).join('')||'<p class="muted">Sin entradas asociadas.</p>'}</div>`}
function cm21StudentBitacora(id){let rows=cm21Rows().filter(r=>(r.estudiantes||[]).some(x=>x.id===id)).sort((a,b)=>cm21Range(b)[0].localeCompare(cm21Range(a)[0]));return `<div class="card"><h4>Bitácora (${rows.length})</h4>${rows.map(r=>`<div class="cm21Mini"><b>${esc(r.titulo)}</b> · ${esc(cm21DateLabel(r))}<p class="small muted">${esc(r.categoria)} · ${esc(r.descripcion||'')}</p></div>`).join('')||'<p class="muted">Sin entradas asociadas.</p>'}</div>`}
const cm21Sections=[['investigacion','Investigación'],['docencia','Docencia'],['guia','Seminarios · Profesor/a guía'],['informante','Seminarios · Profesor/a informante'],['bitacora','Bitácora']];
let cm21ExportTeacher=null;
function cm21TeacherExportDialog(id){cm21ExportTeacher=id;modal(`<div class="row"><h3>Exportar perfil docente</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted">Selecciona las secciones que deseas incluir. Se distinguen los seminarios guiados de aquellos en que participó como informante.</p><label class="cm19Check"><input class="cm21Select" type="checkbox" value="datos" checked> Biodata, categoría académica y grados</label>${cm21Sections.map(([k,t])=>`<label class="cm19Check" style="margin:7px 0"><input class="cm21Select" type="checkbox" value="${k}" checked> ${t}</label>`).join('')}<div class="bar" style="margin-top:15px">${button('Descargar PDF',"cm21ExportTeacherFile('pdf')",'primary')}${button('Descargar Excel',"cm21ExportTeacherFile('xls')")}</div>`)}
function cm21TeacherData(id,sections){let p=academicStore(),arr=[];let teach=teachers().find(x=>x.id===id);if(sections.includes('datos')){arr.push(['Perfil','','Categoría académica',teach?.categoria_academica||'','']);if(teach?.biodata)arr.push(['Perfil','','Biodata',teach.biodata,'']);for(let g of cm22DegreeTypes)if(teach?.grados_academicos?.[g]?.descripcion)arr.push(['Formación','',g,teach.grados_academicos[g].descripcion,teach.grados_academicos[g].en_curso?'En curso':'']);}if(sections.includes('investigacion'))for(let r of p.investigacion||[])if((r.profesores||[]).some(x=>x.id===id))arr.push(['Investigación',r.anio||'',r.tipo||'',r.titulo||'', 'Participante']);if(sections.includes('docencia'))for(let r of p.docencia||[])if((r.profesores||[]).some(x=>x.id===id))arr.push(['Docencia',r.anio||'','Docencia',r.descripcion||'','Participante']);for(let [sec,key,role] of [['guia','guias','Profesor/a guía'],['informante','informantes','Profesor/a informante']])if(sections.includes(sec))for(let r of p.seminarios_grado||[])if((r[key]||[]).some(x=>x.id===id))arr.push(['Seminario de grado',r.anio||'','Seminario',r.titulo||'',role]);if(sections.includes('bitacora'))for(let r of cm21Rows())if((r.profesores||[]).some(x=>x.id===id))arr.push(['Bitácora',cm21DateLabel(r),r.categoria,r.titulo,r.descripcion||'']);return arr}
function cm21ExportTeacherFile(format){let id=cm21ExportTeacher,t=teachers().find(x=>x.id===id);if(!t)return;let sections=[...document.querySelectorAll('.cm21Select:checked')].map(x=>x.value);if(!sections.length)return alert('Selecciona al menos una sección.');let rows=cm21TeacherData(id,sections),headers=['Sección','Año / período','Tipo','Producto o acontecimiento','Rol / descripción'],base='Perfil_Docente_'+(t.nombre_completo||id).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_');if(format==='xls')cmExcelFile([headers,...rows],base+'.xls');else{let lines=['PERFIL ACADEMICO DOCENTE','Pedagogia en Castellano - UCSH','Docente: '+t.nombre_completo,'Fecha: '+date(),'Secciones: '+sections.map(x=>cm21Sections.find(s=>s[0]===x)?.[1]).join(', '),'',...rows.flatMap(x=>['-'.repeat(70),...x.map((v,i)=>headers[i]+': '+v)])];download(cm19PdfBytes(lines),base+'.pdf')}closeModal()}

// Gestor Maestro v23 additions
const cm22DegreeTypes=['Postdoctorado','Doctorado','Magíster','Título profesional','Licenciatura'];
function cm22TeacherExtra(t){return `<div class="card"><h3>Antecedentes académicos</h3>${t.categoria_academica?`<p><b>Categoría académica:</b> ${esc(t.categoria_academica)}</p>`:''}${t.biodata?`<p style="white-space:pre-wrap">${esc(t.biodata)}</p>`:''}${cm22DegreeTypes.filter(g=>t.grados_academicos?.[g]?.descripcion).map(g=>`<div class="cm21Mini"><b>${esc(g)}</b> ${t.grados_academicos[g].en_curso?'<span class="tag en_curso">En curso</span>':''} · ${esc(t.grados_academicos[g].descripcion)}</div>`).join('')||'<p class="muted">Sin formación registrada.</p>'}</div>`}
function cm22EditTeacherExtra(id){let t=teachers().find(x=>x.id===id);if(!t)return;modal(`<div class="row"><h3>Formación y biodata · ${esc(t.nombre_completo)}</h3>${button('Cerrar','closeModal()','small')}</div>${field('Categoría académica','cm22Category',t.categoria_academica||'')}${field('Biodata','cm22Biodata',t.biodata||'','textarea')}<h4>Grados académicos</h4><p class="small muted">Deja vacías las categorías que no correspondan. Las que estén en curso se identificarán en su ficha.</p>${cm22DegreeTypes.map((g,i)=>`<div class="card"><b>${esc(g)}</b>${field('Descripción / institución','cm22Degree'+i,t.grados_academicos?.[g]?.descripcion||'')}<label><input type="checkbox" id="cm22Ongoing${i}" ${t.grados_academicos?.[g]?.en_curso?'checked':''}> En curso</label></div>`).join('')}${button('Guardar datos',`cm22SaveTeacherExtra(${JSON.stringify(id)})`,'primary')}`)}
function cm22SaveTeacherExtra(id){let t=teachers().find(x=>x.id===id);t.categoria_academica=v('cm22Category').trim();t.biodata=v('cm22Biodata').trim();t.grados_academicos={};cm22DegreeTypes.forEach((g,i)=>{let desc=v('cm22Degree'+i).trim();if(desc)t.grados_academicos[g]={descripcion:desc,en_curso:!!document.getElementById('cm22Ongoing'+i)?.checked}});logChange('perfil_docente',id,'Biodata, categoría y formación');closeModal();acadOpenTeacher(id)}
function cm22Norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function cm22FindStudent(value){let k=cm22Norm(value);if(!k)return [];return studentList().filter(s=>cm22Norm(s.rut)===k||cm22Norm(s.nombre_completo)===k)}
function cm22Tabular(text){return String(text||'').trim().split(/\r?\n/).filter(Boolean).map(line=>line.split('\t').map(x=>x.trim()))}
let cm22CourseDraft=[];
function cm22BulkCourseDialog(mode='aprobado'){let state=mode==='reprobado'?'reprobado':'aprobado',title=state==='aprobado'?'Informar cursos aprobados':'Informar cursos reprobados';cm22CourseDraft=[];modal(`<div class="row"><h3>${title} · Pegado desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted">Pega las columnas <b>RUT o nombre del estudiante</b> y <b>código del curso</b>, en cualquier orden. Puedes incluir encabezados. Solo se actualizarán las filas identificadas sin ambigüedad; revisa la vista previa antes de confirmar.</p><div class="notice"><b>Estado que se asignará: ${state==='aprobado'?'APROBADO':'REPROBADO'}.</b> No se modificarán otras asignaturas del estudiante.</div><input type="hidden" id="cm22CourseState" value="${state}"><textarea id="cm22CoursePaste" rows="9" style="width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px" placeholder="RUT\tCódigo del curso\n12345678-9\tRPC502"></textarea><div class="bar">${button('Revisar coincidencias','cm22CoursePreview()','primary')}</div><div id="cm22CourseResult"></div>`)}
function cm22CourseMode(mode,el){$('#cm22CourseState').value=mode;document.querySelectorAll('.cm19Choice').forEach(x=>x.classList.toggle('on',x===el))}
function cm22CoursePreview(){let lines=cm22Tabular(v('cm22CoursePaste'));if(!lines.length)return alert('Pega filas desde Excel');let h=lines[0].map(cm22Norm),identifier=h.findIndex(x=>['rut','run','nombre','nombrecompleto','estudiante','alumno'].includes(x)),cidx=h.findIndex(x=>['curso','codigo','sigla','codigocurso','asignatura'].includes(x));let start=identifier>=0&&cidx>=0?1:0;if(start===0){identifier=0;cidx=1}cm22CourseDraft=lines.slice(start).map((cells,i)=>{let search=cells[identifier]||'',sigla=(cells[cidx]||'').toUpperCase(),matches=cm22FindStudent(search),s=matches.length===1?matches[0]:null,id=s?(sigla.includes(':')?sigla:s.plan_estudio+':'+sigla):null,c=course(id);return {line:i+start+1,search,sigla,s,id,c,ok:!!(s&&c),reason:matches.length!==1?(matches.length?'Nombre ambiguo':'Estudiante no encontrado'):'Asignatura no encontrada en su plan'}});$('#cm22CourseResult').innerHTML=`<p><b>${cm22CourseDraft.filter(x=>x.ok).length} filas listas</b> · ${cm22CourseDraft.filter(x=>!x.ok).length} por revisar</p><div class="tablewrap"><table class="tbl"><tr><th>Fila</th><th>Estudiante</th><th>Curso</th><th>Resultado</th></tr>${cm22CourseDraft.map(x=>`<tr><td>${x.line}</td><td>${esc(x.s?.nombre_completo||x.search)}</td><td>${esc(x.sigla)}</td><td>${x.ok?'Lista':esc(x.reason)}</td></tr>`).join('')}</table></div>${button('Aplicar filas válidas','cm22CourseApply()','primary')}`}
function cm22CourseApply(){let rows=cm22CourseDraft.filter(x=>x.ok),state=v('cm22CourseState');if(!rows.length)return alert('No hay filas válidas.');if(!confirm('Se marcarán '+rows.length+' asignaciones como '+state+'. ¿Continuar?'))return;for(let x of rows){let s=x.s,prev=s.avance_curricular?.[x.id]?.estado||null;s.avance_curricular||={};s.avance_curricular[x.id]={...(s.avance_curricular[x.id]||{}),estado:state,creditos:x.c.creditos};s.historial_avance||=[];s.historial_avance.push({curso_id:x.id,estado_anterior:prev,estado_nuevo:state,fecha:date(),origen:'carga_masiva'});s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=cmApprovedCredits(s);s.fecha_ultima_actualizacion=date()}logChange('avance_masivo',state,rows.length+' estados actualizados');closeModal();studentsPage();toast('Se actualizaron '+rows.length+' estados.')}
function cm22ResetDialog(){let count=studentList().reduce((n,s)=>n+Object.values(s.avance_curricular||{}).filter(x=>x.estado==='en_curso').length,0);modal(`<h3>Restablecer asignaturas en curso</h3><p>Se cambiará el estado <b>En curso</b> a <b>Pendiente</b>. No se eliminarán los registros históricos.</p><p>${count} inscripciones en curso actualmente.</p><label class="cm19Check"><input type="checkbox" id="cm22SkipEPC" checked> Excluir asignaturas EPC</label><label class="cm19Check"><input type="checkbox" id="cm22SkipCFG" checked> Excluir asignaturas CFG</label><div class="bar" style="margin-top:15px">${button('Aplicar cambios','cm22ResetApply()','primary')}${button('Cancelar','closeModal()')}</div>`)}

   if(!Number.isFinite(pct))continue;

   const key=[profile,type,year,code].join('|');

 for(const item of buckets.values()){

function cmICMetric(row,all){
 const prev=all.filter(r=>r.type===row.type&&r.code===row.code&&r.profile===row.profile&&r.year<row.year).sort((a,b)=>b.year-a.year).slice(0,2);
 const older=prev[0]||null;
 const delta=older?row.promedio-older.promedio:null;
 const gap=cmICClamp((60-row.promedio)/60);
 const coverage=100*(row.students.size?[...row.students.values()].filter(x=>x.pct>=60).length/row.students.size:0);
 const passRateGap=cmICClamp((70-coverage)/70);
 const meanFails=row.promedio<60,coverageFails=coverage<70;
 const disp=cmICClamp(row.desviacion_estandar/50);
 let hist=null,trend='Sin histórico';
 if(prev.length){
  const diffs=[delta];if(prev.length===2)diffs.push(prev[0].promedio-prev[1].promedio);
  const slope=diffs.reduce((a,b)=>a+b,0)/diffs.length;

  else if(slope>3)trend='Al alza';else if(slope< -3)trend='A la baja';else trend='Estancamiento';

 const ic=hist===null?cmICClamp((0.40*gap+0.40*passRateGap+0.10*disp)/0.90):cmICClamp(0.40*gap+0.40*passRateGap+0.10*disp+0.10*hist);

function cmICLevel(ic,row){

function cmICExplain(r){

 if(hasHistory)factors.push(['Componente histórico',r.hist,0.10]);

function cmICPanel(){

 return `<div class="card" id="cmICPanel"><div class="row"><div><h3>Índice de Criticidad (IC) · Hitos evaluativos</h3><p class="muted small">Priorización de resultados de aprendizaje a partir de la media, cobertura de logro ≥60 %, dispersión y los dos años anteriores disponibles del mismo HITO y perfil de egreso. Nunca se cruzan versiones de perfil distintas.</p></div><span class="tag">0 = menor criticidad · 1 = mayor criticidad</span></div>${all.length?`<div class="columns">${field('Hito evaluativo','ic_type',types[0],'text',types.map(t=>[t,t.replace('_',' ')]))}${field('Año de rendición','ic_year',String(years[0]),'text',years.map(y=>[String(y),String(y)]))}${field('Ordenar resultados','ic_sort','criticidad','text',[['criticidad','Mayor criticidad primero'],['ra','Código de RA']])}</div><div class="bar">${button('Exportar tabla a Excel','cmICExport()')}</div><div class="ic-method-note"><b>Cómo interpretar los resultados:</b> El <b>IC numérico (0 a 1)</b> expresa la <b>magnitud calculada de la criticidad</b>, mientras que la <b>categoría (baja, media o alta)</b> expresa su <b>prioridad para tomar decisiones pedagógicas</b>. Esta última aplica reglas explícitas sobre las dos metas prioritarias y no se determina únicamente por el valor del índice.<div class="small" style="margin-top:6px">Las alertas de <b>dispersión</b> y <b>tendencia</b> son señales complementarias: no sustituyen la categoría general de criticidad.</div></div><div id="cmICOutput"></div><details><summary>¿Cómo se calcula el IC?</summary><p class="small">Brecha de media (B) = máx(0, (60 − media)/60). Brecha de cobertura (C) = máx(0, (70 − % de estudiantes con logro ≥60 %)/70). Dispersión (D) = mín(1, desviación estándar/50). Componente histórico (H) = 0,60 × caída reciente normalizada + 0,40 × persistencia de logro bajo 60 %. Se utilizan, cuando existen, las dos anualidades anteriores disponibles para el mismo HITO y RA.</p><p class="small"><b>Con histórico:</b> IC = 0,40B + 0,40C + 0,10D + 0,10H. <b>Sin histórico:</b> IC = (0,40B + 0,40C + 0,10D)/0,90. Las bandas numéricas son baja (&lt; 0,35), media (0,35–0,64) y alta (≥ 0,65). La clasificación final aplica una regla prioritaria: incumplir ambos criterios implica criticidad alta; incumplir uno implica como mínimo criticidad media. La diferencia interanual compara con la anualidad anterior disponible, no necesariamente consecutiva.</p><p class="small muted">Indicador exploratorio para apoyo a decisiones; no equivale a una evaluación individual ni a un umbral institucional validado. El IC se calcula en pantalla y no altera el JSON.</p></details>`:'<p class="notice">No hay rendiciones HITO con niveles de logro válidos para calcular el índice.</p>'}</div>`;
}

/* v24.7: Índice de Prioridad Sugerida por Estándar (END).
   Las cifras d/e se almacenan como proporciones 0–1; delta=.02 (2 pp),
   divisores .20, .10 y .15. No se modifica la Base Maestra. */
function ipseClamp(x){return Math.max(0,Math.min(1,x))}
function ipseValue(x){const n=Number(x);return x===null||x===undefined||x===''||!Number.isFinite(n)?null:n}
function ipseMedian(xs){const a=xs.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function ipseF(x,d=1){return Number.isFinite(x)?(x*100).toLocaleString('es-CL',{maximumFractionDigits:d,minimumFractionDigits:d})+' %':'—'}
function ipseN(x,d=3){return Number.isFinite(x)?x.toLocaleString('es-CL',{maximumFractionDigits:d,minimumFractionDigits:d}):'—'}
function gmENDVersion(test,year){const annual=endStore().anualidades?.[String(year)];const rec=annual?.[test];return String(rec?.estandares_version_id||annual?.estandares_version_id||'estandares_2022')}
function ipseRecord(test,year,key,version){if(version&&gmENDVersion(test,year)!==version)return null;return endStore().anualidades?.[String(year)]?.[test]?.metricas?.[key]?.promedio}
function ipseNational(test,year,key,version){if(version&&gmENDVersion(test,year)!==version)return null;let x=endStore().anualidades?.[String(year)]?.[test]?.promedios_nacionales?.[key];return typeof x==='object'&&x!==null?x.promedio:x}
function ipseCalc(test,year,key){
 const standardVersion=gmENDVersion(test,year);
 const P0=ipseValue(ipseRecord(test,year,key,standardVersion)),P1=ipseValue(ipseRecord(test,year-1,key,standardVersion)),P2=ipseValue(ipseRecord(test,year-2,key,standardVersion));

 if(P0===null)return null;
 const history=[P1,P2].filter(x=>x!==null);

 const median=ipseMedian(thresholdBasis);
 const guard=N0===null?null:N0-.02;

 const R=T===null?null:ipseClamp(Math.max(0,T-P0)/.15);
 const W=.5;
 const parts=[{id:'tau',name:'Tendencia propia',weight:.45,value:tau},{id:'risk',name:'Riesgo interno',weight:.35,value:R},{id:'gap',name:'Brecha nacional',weight:.15,value:G},{id:'weight',name:'Centralidad curricular',weight:.05,value:W}];
 const available=parts.filter(x=>x.value!==null),total=available.reduce((a,b)=>a+b.weight,0);

}
function ipseLevel(x){return x>=.65?{name:'Alta',fg:'#a1293a',bg:'#fff0f1'}:x>=.35?{name:'Media',fg:'#8c5b12',bg:'#fff5e3'}:{name:'Baja',fg:'#226345',bg:'#eef8f1'}}
function ipseYears(){const e=endStore().anualidades||{};return Object.keys(e).filter(y=>['PCPG','PCDD'].some(t=>Object.keys(e[y]?.[t]?.metricas||{}).some(k=>/^e\d+$/.test(k)))).sort((a,b)=>Number(b)-Number(a))}
function ipsePanel(){const years=ipseYears();return `<div class="card" id="ipsePanel"><div class="row"><div><h3>Índice de Prioridad Sugerida por Estándar (IPSE) · END</h3><p class="muted small">Priorización por estándar de PCPG y PCDD. Solo compara años de una misma versión de estándares; los códigos coincidentes entre versiones distintas no se consideran equivalentes. Cálculo independiente del Índice de Criticidad HITO.</p></div><span class="tag">0 = menor prioridad · 1 = mayor prioridad</span></div><div class="ipse-intro"><b>Interpretación:</b> el IPSE orienta la <b>priorización de estándares</b> en el plan de acción. Privilegia la tendencia y el umbral propio del programa (80 % del peso), sin perder la comparación nacional (15 %) ni la centralidad curricular (5 %). <b>Un IPSE alto no equivale por sí solo a una evaluación causal.</b><div class="small" style="margin-top:5px">Fórmula: IPSE = 0,45 × tendencia + 0,35 × riesgo bajo umbral + 0,15 × brecha nacional + 0,05 × centralidad (W = 0,5). Umbral: T = máx{mediana(P−1, P−2, N−1); N0 − 2 puntos}.</div></div>${years.length?`<div class="columns">${field('Prueba','ipse_test','PCPG','text',[['PCPG','PCPG · Pedagógica'],['PCDD','PCDD · Disciplinar y didáctica']])}${field('Año de rendición','ipse_year',years[0],'text',years.map(y=>[y,y]))}${field('Orden','ipse_order','desc','text',[['desc','Mayor IPSE primero'],['code','Por código de estándar']])}</div><div class="bar">${button('Descargar resultados IPSE (Excel)','ipseExport()')}</div><div id="ipse_output"></div>`:'<div class="notice">Aún no hay promedios institucionales END por estándar. Regístralos en Resultados END para calcular el IPSE.</div>'}<details><summary>Notas metodológicas y manejo de años sin datos</summary><p class="small">El cálculo original requiere P₀, P₋₁, P₋₂, N₀ y N₋₁. Si faltan antecedentes, se calcula una versión parcial con los componentes disponibles, reajustando proporcionalmente sus pesos, y se identifica como <b>estimación parcial</b>. El umbral conserva la baranda nacional cuando N₀ existe. Si no hay referencia nacional ni umbral histórico, el riesgo queda sin cálculo. El puntaje institucional P₀ es imprescindible. La tendencia utiliza los años previos que estén disponibles, pero solo compara las pruebas y los códigos de estándar equivalentes. Sin equivalencia entre instrumentos, interpreta la comparación histórica con cautela.</p><p class="small">Puntajes END en proporciones: 0,02 = 2 puntos porcentuales. Divisores: brecha nacional 0,20; tendencia 0,10; riesgo interno 0,15. Categorías visuales exploratorias: baja &lt;0,35; media de 0,35 a &lt;0,65; alta ≥0,65. Los umbrales de clasificación se deben validar institucionalmente.</p></details></div>`}

function cm249OpenPaste(kind){captureBatchDraft();modal(`<h3>Pegar resultados desde Excel · ${esc(kind.toUpperCase())}</h3><div class="notice"><b>Formato:</b> encabezados «Estudiante» y/o «RUT», seguidos por una columna por ítem, identificada mediante el código de ${kind==='hito'?'RA':'IA'} y el número de ítem (ej.: «${kind==='hito'?'4.3':'3.1.1'} ítem 1»). <b>Primera fila de datos: PUNTAJE MÁXIMO</b>, con el máximo de cada columna. <b>Vacío significa pendiente; 0 significa puntaje cero.</b> Las columnas pegadas <b>reemplazan la configuración anterior</b>.</div><textarea id="cm249Paste" rows="12" style="width:100%;font-family:monospace" placeholder="Estudiante\tRUT\t4.3 ítem 1\t4.3 ítem 2\nPUNTAJE MÁXIMO\t\t5\t10\nPÉREZ ...\t12345678-9\t0\t"></textarea><div class="bar">${button('Revisar datos',`cm249Preview('${kind}')`,'primary')}${button('Cerrar','closeModal()')}</div><div id="cm249Preview"></div>`)}

function cm249Preview(kind){let lines=v('cm249Paste').replace(/\r/g,'').split('\n').filter(s=>s.trim()),grid=lines.map(l=>l.split('\t').map(s=>s.trim()));if(grid.length<2)return alert('Se requieren encabezados y la fila PUNTAJE MÁXIMO.');let head=grid.shift(),rutI=head.findIndex(h=>/^(rut|run)$/i.test(h)),nameI=head.findIndex(h=>/nombre|estudiante|alumno/i.test(h));if(rutI<0&&nameI<0)return alert('Incluye Estudiante y/o RUT.');let defs=head.map((h,i)=>({i,z:cm249ParseCode(h,kind)})).filter(o=>o.z);if(!defs.length)return alert('No se identificaron códigos válidos de '+(kind==='hito'?'RA':'IA')+'.');let maxrow=grid.shift();if(!/puntaje\s*m[aá]ximo/i.test(maxrow.join(' ')))return alert('La primera fila de datos debe decir PUNTAJE MÁXIMO.');let errors=[],mx={};defs.forEach(({i,z})=>{let m=Number(String(maxrow[i]||'').replace(',','.'));if(!Number.isFinite(m)||m<=0)errors.push(`Máximo inválido: ${head[i]}`);(mx[z.code] ||= {})[z.n]=m});let c=course(cmGetContext(kind).courseid),rows=[],used=new Set();grid.forEach((r,idx)=>{let rt=rutI>=0?r[rutI]:'';let nm=nameI>=0?r[nameI]:'';let opts=rt?studentList().filter(s=>cmPasteCleanRut(s.rut)===cmPasteCleanRut(rt)&&(!c||s.plan_estudio===c.plan_id)):(c?cmIdentityCandidates(nm,c.plan_id):studentList().filter(s=>cmNormName(s.nombre_completo)===cmNormName(nm)));let id=opts.length===1?opts[0].rut:'';if(!id)errors.push('Fila '+(idx+3)+': estudiante no identificado de forma inequívoca.');if(id&&used.has(id))errors.push('Estudiante repetido: '+id);used.add(id);let vals=defs.map(({i,z})=>{let raw=r[i];if(raw===''||raw===undefined)return '';let val=Number(raw.replace(',','.'));if(!Number.isFinite(val)||val<0||val>mx[z.code]?.[z.n])errors.push('Fila '+(idx+3)+': puntaje fuera de rango en '+head[i]);return String(val)});rows.push({id,name:nm||rt,values:vals})});cm249PasteDraft={kind,defs,max:mx,rows,errors};$('#cm249Preview').innerHTML=`<div class="notice ${errors.length?'warning':''}">${defs.length} columnas de ítems · ${rows.length} estudiantes · ${errors.length} observaciones.</div>${errors.map(e=>`<p class="small" style="color:#a33">${esc(e)}</p>`).join('')}<div class="tablewrap"><table class="tbl"><tr><th>Fila</th><th>Identificación</th><th>Coincidencia</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(student(r.id)?.nombre_completo||'Revisar')}</td></tr>`).join('')}</table></div>${!errors.length?button('Aplicar datos y reemplazar instrumento',`cm249ApplyPaste('${kind}')`,'primary'):''}`}
function cm249ApplyPaste(kind){let p=cm249PasteDraft;if(!p||p.kind!==kind||p.errors.length)return;captureBatchDraft();let cols=p.defs.map(({z})=>({...z}));if(new Set(cols.map(z=>z.code+'|'+z.n)).size!==cols.length)return alert('Hay encabezados de ítems repetidos.');cmColumns=cols;cm249Max={};for(let [code,nums] of Object.entries(p.max))cm249Max[code]=Array.from({length:Math.max(...cols.filter(z=>z.code===code).map(z=>z.n))},(_,i)=>nums[i+1]);batchDraft={};batchMembers=p.rows.map(r=>r.id);for(let r of p.rows)p.defs.forEach(({z},i)=>{batchDraft[r.id+'|'+z.code+'|'+z.n]=r.values[i]});cm249PasteDraft=null;cm249PasteOverwrites=true;closeModal();drawBatchTable(kind);cm249SaveConfig(kind);toast('Datos preparados. Pulsa «Guardar resultados» para registrarlos en el JSON.')}
function cm249SaveResults(kind){let x=cmGetContext(kind),scale=Object.fromEntries(cmColumns.map(z=>[z.code,'0-'+Math.max(...(cm249Max[z.code]||[7]))])),arr=cmSourceRows(kind),attempt=Number(v('batch_attempt'));captureBatchDraft();if(!cmColumns.length)return alert('Configura ítems o pega una planilla.');let count=0;for(let rut of batchMembers){let bycode={};for(let col of cmColumns){let raw=batchDraft[rut+'|'+col.code+'|'+col.n];if(raw===undefined||raw==='')continue;let max=cm249Max[col.code]?.[col.n-1]??cmBounds(scale[col.code])?.hi??7,num=Number(raw);if(!Number.isFinite(num)||num<0||num>max)return alert('Puntaje fuera de rango: '+col.code+' ítem '+col.n);let a=bycode[col.code] ||= [];a[col.n-1]=num}if(!Object.keys(bycode).length)continue;let r=arr.find(r=>r.estudiante_ref===rut&&r.anio_rendicion===x.year&&Number(r.instancia||1)===attempt&&(x.eif?r.curso_id===x.courseid&&Number(r.semestre_rendicion)===x.semester:r.tipo_hito===x.type&&String(r.curso_grupo_id||'')===String(x.courseid||'')));if(!r){r={id_rendicion:`${kind.toUpperCase()}-${Date.now()}-${Math.random().toString(36).slice(2)}`,estudiante_ref:rut,anio_rendicion:x.year,instancia:attempt};arr.push(r)}let multi=x.eif?'desglose_por_ia':'desglose_por_ra',sum=x.eif?'puntajes_por_ia':'puntajes_por_ra',ach=x.eif?'logro_por_ia':'logro_por_ra';if(cm249PasteOverwrites){r[multi]={};r[sum]={};r[ach]={};r.escalas_por_codigo={};r.maximos_por_item={}}else{r[multi] ||= {};r[sum] ||= {};r[ach] ||= {};r.escalas_por_codigo ||= {};r.maximos_por_item ||= {}}for(let [code,vals] of Object.entries(bycode)){let maxima=cm249Max[code]||Array(vals.length).fill(7);let clean=Array.from({length:cmColumns.filter(z=>z.code===code).length},(_,i)=>vals[i]??null),valid=clean.map((n,i)=>n===null?null:(n/maxima[i])*100).filter(n=>n!==null);r[multi][code]=clean;r[sum][code]=cmMean(clean);r[ach][code]=cmMean(valid);r.maximos_por_item[code]=maxima;r.escalas_por_codigo[code]='0-'+Math.max(...maxima)}if(x.eif){r.curso_id=x.courseid;r.semestre_rendici cmRefreshPreview=function(kind){document.querySelectorAll('.cm-preview').forEach(td=>{let cols=[...document.querySelectorAll('.batch-score')].filter(el=>el.dataset.student===td.dataset.student&&el.dataset.code===td.dataset.code&&el.value.trim()!=='');let val=cols.map(el=>{let mx=cm249Max[el.dataset.code]?.[Number(el.dataset.col)-1]??cmBounds([...document.querySelectorAll('.cm-scale')].find(s=>s.dataset.code===el.dataset.code)?.value||'0-7')?.hi??7;return 100*Number(el.value)/mx});let mean=cmMean(val);td.textContent=mean===null?'—':mean.toFixed(1)+' %';td.title=mean===null?'Sin puntajes':'Promedio del porcentaje alcanzado por ítem (máximos individuales)'})};

function gmAcademicApply(){for(let z of gmADraft){let s=student(z.rut);if(!s)continue;s.avance_curricular ||= {};s.avance_curricular[z.id]={...s.avance_curricular[z.id],estado:z.state,creditos:course(z.id)?.creditos||0};s.fecha_ultima_actualizacion=date();s.resumen_estados=countStates(s)}logChange('carga_academica','carga_excel',gmADraft.length+' estados actualizados');gmADraft=[];closeModal();studentsPage()}

// Mapa EIF: medias y cobertura por nivel y año, nunca por individuo.
function gmEIFRows(){let arr=db.resultados_eif?.rendiciones||[];let out=[];for(let r of arr){let c=course(r.curso_id),nivel=Number(r.nivel||c?.nivel||0),year=Number(r.anio_rendicion),sem=Number(r.semestre_rendicion||1);if(!nivel||!year)continue;let vals=r.porcentajes_por_ia||r.niveles_logro_por_ia||r.logros_por_ia||r.puntajes_por_ia||{};for(let [ia,raw] of Object.entries(vals)){let value=typeof raw==='number'?raw:typeof raw==='string'?Number(raw):raw?.porcentaje_logro??raw?.porcentaje??raw?.logro??raw?.nivel_logro??null;if(Array.isArray(raw))value=null;if(value!==null&&Number.isFinite(Number(value)))out.push({year,sem,nivel,ia,value:Number(value),course:r.curso_id,student:r.estudiante_ref||null})}}// Series agregadas de EIF existentes.
 let bags=db.resultados_eif?.agregados_por_periodo||[];for(let p of bags){let year=Number(p.anio_rendicion),sem=Number(p.semestre_rendicion||1),c=course(p.curso_id),nivel=Number(p.nivel||c?.nivel||0);if(!year||!nivel)continue;for(let [ia,z] of Object.entries(p.indicadores||{})){if(!z||typeof z!=='object')continue;let mean=Number(z.promedio),cov=Number(z.cumple_60),n=Number(z.n||0);if(Number.isFinite(mean))out.push({year,sem,nivel,ia,aggregate:true,mean,coverage:Number.isFinite(cov)?cov:null,n});}}let periodos=db.resultados_eif?.periodos||{};for(let p of Object.values(periodos)){if(!p||typeof p!=='object')continue;let year=Number(p.anio||p.anio_rendicion||p.year),sem=Number(p.semestre||p.semestre_rendicion||1),c=course(p.curso_id),nivel=Number(p.nivel||c?.nivel||0);if(!year||!nivel)continue;let stats=p.estadisticas_por_ia||p.resultados_por_ia||{};for(let [ia,s] of Object.entries(stats)){if(!s||typeof s!=='object')continue;let mean=s.media_nivel_logro??s.media??s.promedio??null,coverage=s.porcentaje_estudiantes_sobre_60??s.porcentaje_ge_60??s.pct_ge_60??null;if(Number.isFinite(Number(mean)))out.push({year,sem,nivel,ia,aggregate:true,mean:Number(mean),coverage:coverage===null?null:Number(coverage),n:Number(s.n||0)})}}return out}
function gmEIFMap(){let rows=gmEIFRows(),years=[...new Set(rows.map(x=>x.year))].sort((a,b)=>b-a),yr=Number(v('gmEY'))||years[0]||new Date().getFullYear(),sem=v('gmES')||'todos',data=rows.filter(x=>x.year===yr&&(sem==='todos'||x.sem===Number(sem)));let codes=[...new Set([...Object.keys(gmProfile()?.indicadores_aprendizaje||{}),...data.map(x=>x.ia)])].sort((a,b)=>a.localeCompare(b,'es',{numeric:true})),levels=[...new Set([...courseList().map(x=>Number(x.nivel)),...data.map(x=>x.nivel)].filter(Boolean))].sort((a,b)=>a-b);let show=(values)=>{if(!values.length)return '<span class="muted small">Sin resultados</span>';let value=values.reduce((a,b)=>a+b,0)/values.length;return value};const bar=(n,threshold,caption)=>Number.isFinite(n)?`<div style="border-radius:7px;padding:7px;background:${n>=threshold?'#dff4e8':'#fce5e5'};color:${n>=threshold?'#17643b':'#9b3131'}"><b>${n.toFixed(1)} %</b><div style="font-size:10px">${caption}</div></div>`:'<span class="muted small">—</span>';
 $('#screen').innerHTML=`<div class="card"><h3>Mapa de resultados EIF por nivel curricular</h3><p class="muted">Las filas corresponden a los IA y las columnas a los niveles de las asignaturas. Cada celda presenta media de logro y porcentaje de estudiantes que alcanzan al menos el 60 %. Verde: se cumple la meta (60 % de media; 70 % de cobertura). Rojo: no se cumple.</p><div class="columns">${field('Año calendario','gmEY',yr,'text',years.map(y=>[y,String(y)]))}${field('Período','gmES',sem,'text',[['todos','Año completo'],['1','Primer semestre'],['2','Segundo semestre']])}</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Indicador de aprendizaje (IA)</th>${levels.map(l=>`<th>Nivel ${l}</th>`).join('')}</tr></thead><tbody>${codes.map(ia=>`<tr><td><details><summary>${esc(ia)}</summary><div class="small">${esc((gmProfile()?.indicadores_aprendizaje||{})[ia]?.descripcion||'Descripción no disponible en el perfil activo')}</div></details></td>${levels.map(level=>{let a=data.filter(x=>x.ia===ia&&x.nivel===level),individual=a.filter(x=>!x.aggregate),agg=a.filter(x=>x.aggregate),means=agg.map(x=>x.mean),coverage=agg.map(x=>x.coverage).filter(Number.isFinite);if(!means.length&&individual.length){means=[individual.reduce((t,x)=>t+x.value,0)/individual.length];coverage=[individual.filter(x=>x.value>=60).length/individual.length*100]}return `<td style="min-width:142px">${bar(means.length?means.reduce((x,y)=>x+y,0)/means.length:NaN,60,'Nivel de logro')}${bar(coverage.length?coverage.reduce((x,y)=>x+y,0)/coverage.length:NaN,70,'Estudiantes ≥60 %')}</td>`}).join('')}</tr>`).join('')||'<tr><td colspan="11">No hay resultados EIF reconocibles para este período.</td></tr>'}</tbody></table></div></div>`;$('#gmEY').onchange=gmEIFMap;$('#gmES').onchange=gmEIFMap}

function gmPlannerPayload(){let project=db.horarios||{},curriculum=courseList().map(c=>({id:c.id,plan:c.plan_id||c.id?.split(':')[0],code:c.sigla||c.codigo||c.id?.split(':')[1]||'',name:c.nombre||'',credits:Number(c.creditos)||0,year:Number(c.anio)||Math.ceil(Number(c.nivel||100)/200),prereqs:c.prerrequisitos_ids||[],equivalent:(c.equivalencias||[])[0]||''}));let courses=curriculum.map(c=>({...c,level:c.year,special:/práctica (profesional|iii|iv)|seminario de grado/i.test(c.name),sections:0,manual_or_offer:false}));for(let c of project.courses||[])if(!courses.some(x=>x.id===c.id))courses.push(c);let teachers=teachersListGM();return {careerName:db.carrera?.nombre||'Carrera',semester:project.semester||'2027-1',courses,curriculum,teachers,sections:(project.sections||[]).filter(s=>courses.some(c=>c.id===s.courseId)),reserves:project.reserves||[],incompat:project.incompat||[],years:[...new Set(courses.map(c=>Number(c.level)).filter(x=>x>0))].sort((a,b)=>a-b),studentPlans:[]}}
function teachersListGM(){return teachers().map(t=>({id:String(t.id),name:t.nombre_completo||[t.apellidos,t.nombres].filter(Boolean).join(', '),availability:(db.horarios?.teachers||[]).find(x=>x.id===String(t.id))?.availability||{}}))}
function gmPlannerStudents(){return studentList().map(s=>({name:s.nombre_completo||'',rut:s.rut||'',plan:s.plan_estudio||'',passed:Object.entries(s.avance_curricular||{}).filter(([id,a])=>a.estado==='aprobado').map(([id])=>id),current:Object.entries(s.avance_curricular||{}).filter(([id,a])=>a.estado==='en_curso').map(([id])=>id),restrictions:s.observaciones_planificacion||[]}))}
function gmPlannerCounts(){let obj={};for(let c of courseList()){let plan=c.plan_id||c.id?.split(':')[0],passed=0,pending=0;for(let s of studentList().filter(s=>s.plan_estudio===plan&&s.situacion_academica!=='retiro_definitivo')){if(s.avance_curricular?.[c.id]?.estado==='aprobado')passed++;else pending++}obj[c.id]={approved:passed,pending}}return obj}
function gmBuildPlanner(){let panel=$('#screen');panel.innerHTML='<div class="notice small"><b>Planificador de horarios.</b> Los cursos, planes, docentes, avance y restricciones estudiantiles provienen de Gestor Maestro. El JSON maestro guarda solo la programación de horarios; los ejercicios individuales no se incorporan a la base.</div><div id="gmPlannerMount" style="min-height:85vh"></div>';let iframe=document.createElement('iframe');iframe.id='gmPlannerFrame';iframe.title='Planificador de horarios';iframe.style.cssText='display:block;width:100%;height:900px;min-height:75vh;border:1px solid #d9e2ed;border-radius:14px;background:#f3f6fa';panel.querySelector('#gmPlannerMount').append(iframe);let raw=new TextDecoder().decode(Uint8Array.from(atob(GM_PLANNER_B64),c=>c.charCodeAt(0)));raw=raw.replace('__GM_PROJECT__',JSON.stringify(gmPlannerPayload()).replace(/</g,'\u003c')).replace('__GM_STUDENTS__',JSON.stringify(gmPlannerStudents()).replace(/</g,'\u003c')).replace('__GM_COUNTS__',JSON.stringify(gmPlannerCounts()));iframe.srcdoc=raw;gmPlannerLoaded=true}
window.addEventListener('message',ev=>{if(ev.source!==document.getElementById('gmPlannerFrame')?.contentWindow||ev.data?.type!=='GM_HORARIO_SAVE'||!db)return;let o=ev.data.data||{};db.horarios={semester:o.semester,sections:o.sections||[],reserves:o.reserves||[],incompat:o.incompat||[],courses:(o.courses||[]),teachers:o.teachers||[]};mark()});

function gmStandardThemedPaste(){modal(`<h3>Incorporar temas y estándares</h3>${field('Tipo','gmSType','pedagogicos','text',[['pedagogicos','Pedagógicos'],['disciplinares','Disciplinares']])}<p class="muted">Puedes omitir los temas. Para organizarlos, escribe <b>T1 | Nombre del tema</b> y después <b>E1 | Descripción del estándar</b>. También se admiten filas tabuladas copiadas desde Excel con columnas Tema, Estándar, Descripción.</p><textarea id="gmSText" rows="14" style="width:100%" placeholder="T1 | Conocimientos profesionales\nE1 | Aprendizaje de estudiantes\nE2 | Planificación\nT2 | Enseñanza\nE3 | Interacciones"></textarea><div class="bar">${button('Incorporar temas y estándares','gmApplyStandardsThemed()','primary')}${button('Cerrar','closeModal()')}</div>`)}
function gmApplyStandardsThemed(){let type=v('gmSType'),raw=v('gmSText').trim();if(!raw)return alert('Pega los datos');let version=db.versiones_estandares[db.estandares_activos_id],bucket=type==='pedagogicos'?'dominios':'areas';version[type][bucket]||=[];let groups=version[type][bucket],current=null,added=0;for(let line of raw.split(/\r?\n/)){let parts=line.split('\t').map(x=>x.trim()),text=line.trim(),m=text.match(/^([tT]\d+)\s*[:|\-]\s*(.+)$/),std=text.match(/^(?:[eE]st[aá]ndar\s*)?([eE]\d+|[a-zA-Z]?\d+)\s*[:|\-]\s*(.+)$/);if(parts.length>=3&&/^(?:t\d+)?$/i.test(parts[0])&&/^(?:e\d+|[a-z]?\d+)$/i.test(parts[1])){let code=parts[0];if(code){if(!current||current.codigo_tema!==code){current=groups.find(x=>x.codigo_tema===code);if(!current){current={codigo_tema:code,nombre:code,estandares:[]};groups.push(current)}}}std=[parts[1],parts[1],parts.slice(2).join(' ')];}else if(m){current={codigo_tema:m[1].toUpperCase(),nombre:m[2],estandares:[]};groups.push(current);continue}if(std){if(!current){current={nombre:'Sin tema',estandares:[]};groups.push(current)}let id=std[1],description=std[2];current.estandares.push(type==='pedagogicos'?{codigo:id,nombre:'Estándar '+id+': '+description,focos:[]}:{codigo:id,label:id+'. '+description,descripcion:description,focos:[]});added++}}if(!added)return alert('No se reconocieron estándares');db.estandares_pedagogicos=version.pedagogicos;db.estandares_disciplinares=version.disciplinares;logChange('estandares',version.id,added+' estándares en temas opcionales');closeModal();standardsPage()}
gmStandardPaste=gmStandardThemedPaste;
