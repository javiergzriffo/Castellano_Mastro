</style><style>.ipse-intro{padding:17px 20px;background:#eaf1fa;border-left:5px solid #235585;border-radius:12px;margin:15px 0}.ipse-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:13px}.ipse-card{border:1px solid #dbe5ee;border-top:6px solid var(--ipse-accent);background:var(--ipse-bg);border-radius:13px;padding:17px}.ipse-number{font-size:29px;font-weight:850;color:var(--ipse-accent)}.ipse-terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.ipse-term{background:#ffffffb8;border:1px solid #d9e1eb;border-radius:8px;padding:9px;font-size:12px}.ipse-term b{display:block;font-size:16px}.ipse-muted{font-size:12px;color:#4b6175}.ipse-detail{background:white;border:1px solid #dde7ef;border-radius:9px;padding:11px;margin-top:10px}.ipse-detail table{width:100%;border-collapse:collapse;font-size:12px}.ipse-detail td,.ipse-detail th{padding:5px;border-bottom:1px solid #edf1f5;text-align:left}@media(max-width:650px){.ipse-terms{grid-template-columns:1fr}}</style><style>.cm248-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 20px}.cm248-choice{border:1px solid #d3deea;background:#fff;border-radius:14px;padding:19px 12px;text-align:left;box-shadow:0 2px 7px #142b450b;color:#23405d}.cm248-choice b{display:block;font-size:17px}.cm248-choice small{display:block;color:#677e94;font-size:12px;margin-top:7px;line-height:1.4}.cm248-choice.selected{background:#e9f3fd;border-color:#256296;box-shadow:inset 0 0 0 1px #256296}.cm248-best{background:#e4f6ec!important}.cm248-table td{min-width:220px;max-width:480px}.cm248-table td:last-child{min-width:170px}.cm248-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cm248-summary{display:flex;gap:12px;align-items:start;justify-content:space-between;padding:13px;margin-bottom:10px;border:1px solid #dbe5ee;border-left:5px solid #257653;border-radius:9px;background:#fbfefd}.cm248-summary.bad{border-left-color:#b65b3d;background:#fffafa}.cm248-summary p{margin:5px 0 7px}@media(max-width:800px){.cm248-choices,.cm248-summary-grid{grid-template-columns:1fr}}</style></head><body><div class="layout"><aside class="side"><div class="brand">Gestor Maestro</div><div class="subbrand">Pedagogía en Castellano · UCSH</div><nav class="navigation" id="navigation"></nav><div class="subbrand" style="margin-top:30px">Archivo local · Sin conexión a internet<br>Los cambios se exportan en un nuevo JSON.</div></aside><main class="main"><header class="top"><div><div class="heading" id="screenTitle">Inicio</div><div class="muted small" id="loadedLabel">Sin base cargada</div></div><div class="bar"><button class="btn" id="importBtn">Importar JSON</button><button class="btn primary" id="exportBtn" disabled>Exportar base actualizada</button><input type="file" id="upload" accept="application/json,.json"></div></header><div class="content" id="screen"><div class="empty">Importa la Base Maestra Curricular (JSON) para comenzar.</div></div></main></div><div id="toast"></div><div id="overlay"><div class="modal" id="modal"></div></div><script>
'use strict';
let db=null, dirty=false, current='inicio', selectedStudent=null, selectedTeacher=null, selectedCourse=null;
const names={inicio:'Resumen',bitacora:'Bitácora',estudiantes:'Estudiantes',profesores:'Profesores',academica:'Productividad Académica',cursos:'Planes y cursos',perfil:'Perfil de egreso',estandares:'Estándares',practicas:'Prácticas',eif:'Resultados EIF',hito:'Resultados HITO',end:'Resultados END',analisis:'Análisis consolidado',horarios:'Planificador de horarios',config:'Validación y exportación'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=id=>document.getElementById(id)?.value ?? '';
const field=(label,id,value='',type='text',opts=null)=>`<div class="field"><label class="label" for="${id}">${esc(label)}</label>${opts?`<select id="${id}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(value)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}">`}</div>`;
const button=(label,fn,cls='')=>`<button class="btn ${cls}" onclick="${esc(fn)}">${esc(label)}</button>`;
const row=(arr)=>`<div class="columns">${arr.join('')}</div>`;
const courseList=()=>Object.values(db?.planes_estudio||{}).flatMap(x=>Object.values(x.cursos||{}));
const course=id=>typeof id==='string'&&id.includes(':')?db?.planes_estudio?.[id.split(':')[0]]?.cursos?.[id]:null;
const studentList=()=>Object.values(db?.estudiantes?.por_rut||{});
const student=r=>db?.estudiantes?.por_rut?.[r];
const studentRef=(r)=>student(r)?.rut||r;
const teachers=()=>db?.profesores||[];
const entries=o=>Object.entries(o||{});
const date=()=>new Date().toISOString().slice(0,10);
function toast(msg){let x=$('#toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3700)}
function mark(){dirty=true;$('#exportBtn').disabled=false;updateLabel()}
function updateLabel(){$('#loadedLabel').textContent=db?`${db.carrera?.nombre||'Base Maestra'} · Versión ${db.metadatos?.version||'?'}${dirty?' · Cambios sin exportar':''}`:'Sin base cargada'}
function modal(html){$('#modal').innerHTML=html;$('#overlay').style.display='flex'}
function closeModal(){$('#overlay').style.display='none';$('#modal').innerHTML=''}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
function renderNav(){$('#navigation').innerHTML=entries(names).map(([k,n])=>`<button class="nav ${k===current?'active':''}" onclick="go('${k}')">${esc(n)}</button>`).join('')}
function go(k){current=k;renderNav();$('#screenTitle').textContent=names[k];if(!db){$('#screen').innerHTML=`<div class="card empty"><h3>Bienvenido a Gestor Maestro</h3><p>Importa la Base Maestra JSON v1.9 o una versión compatible para visualizar y alimentar los datos.</p>${button('Seleccionar archivo','document.getElementById("upload").click()','primary')}<p class="small">Por privacidad, la base de estudiantes no se incorpora dentro de este HTML.</p></div><div class="card" style="border-left:4px solid #2563eb"><h3>Base Maestra Curricular · Carpeta institucional</h3><p>La versión vigente del archivo JSON se encuentra en SharePoint. Accede a la carpeta, descarga la Base Maestra y luego utiliza <b>Importar JSON</b> para abrirla en Gestor Maestro.</p><p><a href="https://ucsh.sharepoint.com/:f:/s/EscueladeCastellanoUCSH/IgDNry809lF2Spk58SBjswG9Aesa6naC29Q138UY_AHhmhs?e=cr9pfn" target="_blank" rel="noopener noreferrer" style="font-weight:700;color:#1859b0;text-decoration:underline">Abrir carpeta de la Base Maestra en SharePoint ↗</a></p><p class="small muted">El enlace abre SharePoint en otra pestaña; la aplicación no descarga ni sincroniza automáticamente los datos. Puede requerirse acceso institucional.</p></div>`;return}render()}
$('#importBtn').onclick=()=>$('#upload').click();$('#upload').onchange=async(e)=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.planes_estudio||!obj.perfil_egreso||!obj.estudiantes||!obj.metadatos)throw Error('Este JSON no corresponde a una Base Maestra compatible.');if(db&&dirty&&!confirm('Hay cambios sin exportar. ¿Deseas reemplazar la base actual?'))return;if(obj.resultados_eif?.rendiciones?.length&&!confirm('Esta base contiene EIF individuales. Al importar se consolidarán en estadísticas por IA y período y se eliminarán los resultados individuales de la nueva versión exportada. Conserva el JSON original como respaldo. ¿Continuar?'))return;db=obj;db.profesores ||= [];db.resultados_eif ||= {rendiciones:[],catalogo_por_curso:{}};db.resultados_hito ||= {rendiciones:[],catalogo_hitos:{}};db.resultados_eif.rendiciones ||= [];db.resultados_hito.rendiciones ||= [];db.resultados_hito.instrumentos ||= [];db.historial_cambios ||= [];db.resultados_end ||= {periodicidad:'anual',unidad_analisis:'agregado_institucional',asociacion_estudiantes:false,asociacion_cohortes:false,anualidades:{},definiciones_indicadores:[],observaciones:'Estructura reservada; definir indicadores y escalas en una etapa posterior.'};db.historial_cambios ||= [];cmMigrateEIF();dirty=false;selectedStudent=null;selectedTeacher=null;$('#exportBtn').disabled=false;updateLabel();go('inicio');toast('Base importada correctamente')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function logChange(tipo,referencia,detalle){db.historial_cambios ||= [];db.historial_cambios.push({fecha:new Date().toISOString(),tipo,referencia,detalle});mark()}
function exportJSON(){if(!db)return;let result=validate();if(result.errors.length){if(!confirm(`Se detectaron ${result.errors.length} errores de integridad. ¿Deseas exportar de todas formas?`))return}let next=structuredClone(db);next.metadatos.version=increment(next.metadatos.version||'1.9');next.metadatos.fecha_ultima_actualizacion=date();next.metadatos.observacion_actualizacion='Actualizada desde Gestor Maestro';next.metadatos.historial_versiones ||= [];next.metadatos.historial_versiones.push({version:next.metadatos.version,fecha:date(),descripcion:'Exportación desde Gestor Maestro'});let blob=new Blob([JSON.stringify(next,null,2)],{type:'application/json'});download(blob,`BaseMaestraCastellano_${date().replaceAll('-','')}.json`);db=next;dirty=false;updateLabel();toast('Nueva versión exportada. Conserva este archivo para tu próxima sesión.')}
function increment(t){let p=t.split('.');p[p.length-1]=String((parseInt(p.at(-1))||0)+1);return p.join('.')}
function download(blob,n){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
$('#exportBtn').onclick=exportJSON;
function metric(title,num,sub=''){return `<div class="card"><div class="muted">${esc(title)}</div><div class="metric">${esc(num)}</div><div class="muted small">${esc(sub)}</div></div>`}

function home(){let ss=studentList(),cc=courseList(),e=db.resultados_eif.rendiciones,h=db.resultados_hito.rendiciones;$('#screen').innerHTML=`<div class="card" style="border-left:4px solid #2563eb"><h3>Base Maestra Curricular · Carpeta institucional</h3><p>La versión vigente del archivo JSON se encuentra en SharePoint. Accede a la carpeta, descarga la Base Maestra y luego utiliza <b>Importar JSON</b> para abrirla en Gestor Maestro.</p><p><a href="https://ucsh.sharepoint.com/:f:/s/EscueladeCastellanoUCSH/IgDNry809lF2Spk58SBjswG9Aesa6naC29Q138UY_AHhmhs?e=cr9pfn" target="_blank" rel="noopener noreferrer" style="font-weight:700;color:#1859b0;text-decoration:underline">Abrir carpeta de la Base Maestra en SharePoint ↗</a></p><p class="small muted">El enlace abre SharePoint en otra pestaña; la aplicación no descarga ni sincroniza automáticamente los datos. Puede requerirse acceso institucional.</p></div><div class="grid">${metric('Estudiantes',ss.length,'Plan B y Plan C')}${metric('Profesores',teachers().length)}${metric('Cursos',cc.length,'Con ficha curricular')}${metric('Rendiciones registradas',e.length+h.length,`${e.length} EIF · ${h.length} HITO`)}</div><div class="card"><h3>Consultar o actualizar información</h3><div class="grid">${entries(names).filter(([k])=>!['inicio','config'].includes(k)).map(([k,n])=>`<button class="btn" onclick="go('${k}')">${esc(n)} →</button>`).join('')}</div></div><div class="notice"><b>Uso local y confidencial.</b> Los datos permanecen en este navegador durante la sesión; nada se envía a un servidor. Los cambios no persisten hasta descargar la nueva Base Maestra. Evita trabajar con datos identificables en computadores compartidos.</div>`}

function saveStudent(old){let rut=v('se_rut').trim(),name=v('se_name').trim(),plan=v('se_plan');if(!rut||!name)return alert('RUT y nombre son obligatorios');if(student(rut)&&rut!==old)return alert('Ya existe un estudiante con ese RUT');let s=old?student(old):cmNewStudent(rut,name,plan);if(old&&s.plan_estudio!==plan&&!confirm('Cambiar el plan no convierte los avances curriculares existentes. ¿Continuar?'))return;if(old&&old!==rut){delete db.estudiantes.por_rut[old];for(let k of ['resultados_eif','resultados_hito'])for(let r of db[k].rendiciones||[])if(r.estudiante_ref===old)r.estudiante_ref=rut}s.rut=rut;s.nombre_completo=name;s.plan_estudio=plan;s.correo=v('se_email').trim()||null;s.ingreso={periodo:`${v('se_year')}-${v('se_sem')}`,anio:+v('se_year'),semestre:+v('se_sem')};s.fecha_ultima_actualizacion=v('se_date');db.estudiantes.por_rut[rut]=s;logChange('estudiante',rut,old?'Ficha modificada':'Ficha incorporada');closeModal();studentsPage();openStudent(rut)}

${JSON.stringify(id)})`,'small')}</td></tr>`).join('')}</tbody></table></div><div class="bar" style="margin-top:12px">${button('Agregar curso al avance',`editProgress(${JSON.stringify(r)})`)}</div></div><div class="card"><h3>Observaciones de planificación</h3>${obs.map((o,i)=>`<div class="row"><div><b>${esc(o.tipo||'Observación')}</b> · ${esc(o.texto||'')} <span class="muted small">${esc(o.vigencia_hasta||'Sin vencimiento')}</span></div>${button('Editar',`editObservation(${JSON.stringify(r)},${i})`,'small')}</div>`).join('')||'<p class="muted">Sin observaciones registradas.</p>'}</div><div class="card"><h3>Seguimiento del perfil de egreso</h3><p>${h.length} rendiciones HITO y ${e.length} EIF registradas.</p>${[...h.map(x=>`<div class="bullet">${esc(x.tipo_hito)} · ${esc(x.anio_rendicion)} · ${Object.keys(x.puntajes_por_ra||{}).length} RA</div>`),...e.map(x=>`<div class="bullet">EIF ${esc(x.curso_id)} · ${esc(x.anio_rendicion)}-${esc(x.semestre_rendicion)} · ${Object.keys(x.puntajes_por_ia||{}).length} IA</div>`)].join('')||'<p class="muted">Sin resultados todavía.</p>'}${acadStudentResults(r)}${cm21StudentBitacora(r)}${cm22StudentPractice(r)}<div class="card"><h4>Participación END</h4>${cmEndStudentHTML(r)}<div class="bar">${button('Registrar / modificar participación END',`cmEndStudentEdit(${JSON.stringify(r)})`,'small')}</div></div><div class="bar">${button('Añadir HITO',`newResult('hito',${JSON.stringify(r)})`)}${button('Añadir EIF',`newResult('eif',${JSON.stringify(r)})`)}</div></div>`}

function saveProgress(r,oldid){let id=oldid||v('pr_id'),s=student(r);if(!id||!id.startsWith(s.plan_estudio+':'))return alert('Selecciona un curso del plan del estudiante');let old=s.avance_curricular[id]?.estado||null,newstate=v('pr_state');s.avance_curricular[id]={...(s.avance_curricular[id]||{}),estado:newstate,creditos:s.avance_curricular[id]?.creditos??course(id)?.creditos??0};s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=entries(s.avance_curricular).filter(([id,a])=>a.estado==='aprobado').reduce((t,[id,a])=>t+(+a.creditos||0),0);s.fecha_ultima_actualizacion=v('pr_date');s.historial_avance ||= [];s.historial_avance.push({curso_id:id,estado_anterior:old,estado_nuevo:newstate,fecha:v('pr_date')});logChange('avance_curricular',r+' / '+id,`${old||'sin registro'} → ${newstate}`);closeModal();openStudent(r);toast('Avance actualizado')}

function saveObservation(r,i){if(!v('ob_texto').trim())return alert('Escribe la observación');let s=student(r);s.observaciones_planificacion ||= [];let o={tipo:v('ob_tipo'),texto:v('ob_texto').trim(),cursos_ids:v('ob_cursos').split(',').map(x=>x.trim()).filter(Boolean),vigencia_hasta:v('ob_fecha')||null,fecha_registro:date()};if(i===null)s.observaciones_planificacion.push(o);else s.observaciones_planificacion[i]=o;logChange('observacion_estudiante',r,'Observación guardada');closeModal();openStudent(r)}

function courseStudents(id){let c=course(id);if(!c)return;let ss=studentList().filter(s=>s.plan_estudio===c.plan_id&&cmSituationMatches(s,'activos')),groups={aprobado:[],en_curso:[],pendiente:[],reprobado:[]};for(let s of ss){let st=s.avance_curricular?.[id]?.estado||'pendiente';(groups[st]||groups.pendiente).push(s)}modal(`<div class="row"><h3>${esc(c.sigla)} · ${esc(c.nombre)} (Plan ${esc(c.plan_id)})</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted">Solamente estudiantes del Plan ${esc(c.plan_id)}. Pendiente incluye cursos sin estado registrado.</p><div class="grid">${Object.entries(groups).map(([k,v])=>metric(k.replace('_',' '),v.length)).join('')}</div>${Object.entries(groups).map(([k,v])=>`<details ${k==='en_curso'?'open':''}><summary>${esc(k.replace('_',' '))} · ${v.length}</summary><div class="course-members"><table class="tbl">${v.map(s=>`<tr><td>${esc(s.nombre_completo)}</td><td>${button('Ver perfil',`closeModal();openStudent(${JSON.stringify(s.rut)})`,'small')}</td></tr>`).join('')||'<tr><td>Sin estudiantes</td></tr>'}</table></div></details>`).join('')}`)}

function saveCourse(id){let c=course(id),pr=v('c_pre').split(',').map(x=>x.trim()).filter(Boolean),eq=v('c_eq').split(',').map(x=>x.trim()).filter(Boolean),raw=v('c_mincredits').trim(),credits=raw===''?null:Number(raw);if(raw!==''&&(!Number.isInteger(credits)||credits<0))return alert('Los créditos mínimos deben ser un número entero no negativo');if([...pr,...eq].some(x=>!course(x)))return alert('Hay referencias a cursos que no existen en la base. Corrige antes de guardar.');Object.assign(c,{nombre:v('c_name').trim(),nivel:+v('c_level'),anio:+v('c_year'),creditos:+v('c_credits'),descriptor:v('c_desc').trim()||null,prerrequisitos_ids:pr,prerrequisito_creditos_aprobados:credits,equivalencias:eq});logChange('curso',id,'Datos curriculares y prerrequisitos por créditos actualizados');closeModal();coursesPage()}

function cmSituationDetails(s){let z=s.situacion_academica||'activo';if(z==='retiro_temporal')return 'Retiro temporal: '+(s.retiro_temporal_actual?.anio||'—')+' · semestre '+(s.retiro_temporal_actual?.semestre||'—')+'. Inscripciones suspendidas para ese período.';if(z==='retiro_definitivo')return 'Retiro definitivo: registro histórico conservado, excluido de listados activos.';if(z==='titulado')return 'Titulado'+(s.titulacion?.anio?' en '+s.titulacion.anio:'')+'. Plan marcado como aprobado; avance original respaldado. Los resultados HITO y EIF se conservan íntegros.';return ''}
function cmStatusDialog(r){let s=student(r);modal(`<div class="row"><h3>Situación académica · ${esc(s.nombre_completo)}</h3>${button('Cerrar','closeModal()','small')}</div>${field('Acción','st_action',s.situacion_academica||'activo','text',[['activo','Activo / Reincorporado'],['retiro_temporal','Retiro temporal'],['retiro_definitivo','Retiro definitivo'],['titulado','Titulado']])}${row([field('Año del retiro / titulación','st_year',s.retiro_temporal_actual?.anio||s.titulacion?.anio||new Date().getFullYear(),'number'),field('Semestre de retiro temporal','st_sem',s.retiro_temporal_actual?.semestre||1,'text',[['1','Primero'],['2','Segundo']])])}${field('Fecha de registro','st_date',date(),'date')}<p class="small muted">El retiro definitivo no borra la ficha. Al titularse, se marca completa la malla y se respalda el avance previo; se conservan íntegros los resultados individuales HITO y EIF, sin alterarlos.</p>${button('Aplicar cambio de situación',`cmApplyStatus(${JSON.stringify(r)})`,'primary')}`)}
function cmApprovedCredits(s){return Object.values(s.avance_curricular||{}).filter(x=>x.estado==='aprobado').reduce((a,b)=>a+(Number(b.creditos)||0),0)}
function cmApplyStatus(r){let s=student(r),z=v('st_action'),year=Number(v('st_year')),sem=Number(v('st_sem')),when=v('st_date');if(!Number.isInteger(year)||year<1900||year>2200)return alert('Ingresa un año válido');if(z==='titulado'&&!confirm('Se marcarán como aprobados todos los cursos de la malla de su plan y se respaldará el avance previo. ¿Continuar?'))return;if(z==='retiro_definitivo'&&!confirm('El estudiante dejará de aparecer como activo, pero su perfil e historial no se eliminarán. ¿Continuar?'))return;let previous=s.situacion_academica||'activo';s.situacion_academica=z;s.fecha_situacion_academica=when;s.historial_situaciones ||= [];s.historial_situaciones.push({situacion_anterior:previous,situacion:z,fecha:when,anio:year,semestre:z==='retiro_temporal'?sem:null});if(z==='retiro_temporal'){s.retiros ||= [];let o={tipo:'temporal',anio:year,semestre:sem,fecha_registro:when};s.retiros.push(o);s.retiro_temporal_actual=o;s.matricula_suspendida_periodos ||= [];if(!s.matricula_suspendida_periodos.some(p=>p.anio===year&&p.semestre===sem))s.matricula_suspendida_periodos.push({anio:year,semestre:sem});s.avance_antes_retiro_temporal ||= structuredClone(s.avance_curricular||{})}else if(z==='retiro_definitivo'){s.retiros ||= [];s.retiros.push({tipo:'definitivo',fecha_registro:when,anio:year});s.fecha_retiro_definitivo=when}else if(z==='titulado'){if(!s.avance_curricular_pre_titulacion)s.avance_curricular_pre_titulacion=structuredClone(s.avance_curricular||{});for(let c of courseList().filter(c=>c.plan_id===s.plan_estudio)){s.avance_curricular[c.id]={...(s.avance_curricular[c.id]||{}),estado:'aprobado',creditos:c.creditos}}for(let a of Object.values(s.avance_curricular||{}))a.estado='aprobado';s.titulacion={anio:year,fecha:when};}else if(z==='activo'){s.retiro_temporal_actual=null}s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=cmApprovedCredits(s);s.fecha_ultima_actualizacion=when;logChange('situacion_estudiante',r,previous+' → '+z);closeModal();openStudent(r);toast('Situación actualizada')}

function cmBulkGraduates(){modal(`<div class="row"><h3>Incorporar titulados desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">Pega la tabla con encabezados. Columnas admitidas: RUT, nombre, plan, año de ingreso, semestre de ingreso, año de titulación y correo. Cada estudiante debe identificarse con RUT. No se modifica ningún registro ya existente sin confirmación.</p><textarea id="grad_paste" rows="11" placeholder="rut\tnombre\tplan\tanio_ingreso\tsemestre_ingreso\tanio_titulacion\tcorreo"></textarea><div class="bar">${button('Revisar importación',`cmPreviewGraduates()`,'primary')}</div><div id="grad_preview"></div>`)}
let cmGradDraft=[];
function cmNormalizeHeader(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function cmGetColumn(h,choices){return h.findIndex(x=>choices.includes(cmNormalizeHeader(x)))}
function cmPreviewGraduates(){let t=v('grad_paste').trim();if(!t)return alert('Pega una tabla');let rows=t.split(/\r?\n/).map(r=>r.split('\t').map(s=>s.trim()));let h=rows.shift(),cols={rut:cmGetColumn(h,['rut','run','identificador']),name:cmGetColumn(h,['nombre','nombrecompleto','estudiante','alumno']),plan:cmGetColumn(h,['plan','planestudio']),ing:cmGetColumn(h,['anioingreso','anoingreso','ingreso']),sem:cmGetColumn(h,['semestreingreso','semestre']),grad:cmGetColumn(h,['aniotitulacion','anotitulacion','titulacion','anotitulado']),mail:cmGetColumn(h,['correo','email','correoelectronico'])};if(cols.rut<0||cols.name<0||cols.grad<0)return alert('Se requieren columnas de RUT, nombre y año de titulación');cmGradDraft=[];let errors=[];rows.forEach((r,i)=>{let rut=r[cols.rut]||'',name=r[cols.name]||'',grad=Number(r[cols.grad]);let plan=cols.plan>=0?(r[cols.plan]||'').toUpperCase():'';if(!rut||!name||!Number.isInteger(grad)||grad<1900||grad>2200||!['B','C'].includes(plan)){errors.push('Fila '+(i+2)+': falta RUT, nombre, plan B/C o año válido');return}if(cmGradDraft.some(x=>x.rut===rut)){errors.push('RUT repetido: '+rut);return}cmGradDraft.push({rut,name,grad,plan,ing:cols.ing>=0?Number(r[cols.ing])||null:null,sem:cols.sem>=0?Number(r[cols.sem])||1:1,mail:cols.mail>=0?r[cols.mail]:null,existing:!!student(rut)})});$('#grad_preview').innerHTML=`<p>${cmGradDraft.length} registros válidos · ${errors.length} observaciones</p>${errors.map(x=>`<p class="small" style="color:#b45309">${esc(x)}</p>`).join('')}<div class="tablewrap"><table class="tbl"><tr><th>RUT</th><th>Nombre</th><th>Plan</th><th>Año titulación</th><th>Estado</th></tr>${cmGradDraft.map(x=>`<tr><td>${esc(x.rut)}</td><td>${esc(x.name)}</td><td>${esc(x.plan)}</td><td>${x.grad}</td><td>${x.existing?'Ya existe':'Nuevo'}</td></tr>`).join('')}</table></div>${button('Incorporar registros revisados','cmImportGraduates()','primary')}`}
function cmImportGraduates(){let existing=cmGradDraft.filter(x=>x.existing);if(existing.length&&!confirm('Hay '+existing.length+' perfiles existentes. Se actualizará su condición a titulado sin modificar su nombre ni fecha de ingreso. ¿Continuar?'))return;for(let x of cmGradDraft){let s=student(x.rut);if(s&&s.plan_estudio!==x.plan){alert('Plan distinto para '+x.rut+'. No se efectuó ningún cambio de este registro.');continue}if(!s){s=cmNewStudent(x.rut,x.name,x.plan);s.ingreso={anio:x.ing,semestre:x.sem,periodo:x.ing?x.ing+'-'+x.sem:null};s.correo=x.mail||null;db.estudiantes.por_rut[x.rut]=s}if(!s.avance_curricular_pre_titulacion)s.avance_curricular_pre_titulacion=structuredClone(s.avance_curricular||{});for(let c of courseList().filter(c=>c.plan_id===s.plan_estudio))s.avance_curricular[c.id]={...(s.avance_curricular[c.id]||{}),estado:'aprobado',creditos:c.creditos};for(let a of Object.values(s.avance_curricular||{}))a.estado='aprobado';s.situacion_academica='titulado';s.titulacion={anio:x.grad,fecha:null};s.historial_situaciones ||= [];s.historial_situaciones.push({situacion:'titulado',anio:x.grad,fecha_registro:date(),origen:'importacion_masiva'});s.resumen_estados=countStates(s);s.creditos_aprobados_registrados=cmApprovedCredits(s)}logChange('titulados','carga_masiva',cmGradDraft.length+' registros importados');cmGradDraft=[];closeModal();studentsPage();toast('Titulados incorporados')}

let batchMembers=[],batchCodes=[],batchDraft={};
function resultPage(kind){let eif=kind==='eif',arr=db[eif?'resultados_eif':'resultados_hito'].rendiciones,opts=eif?courseList().map(c=>[c.id,`${c.id} · ${c.nombre}`]):[['HITO_400','HITO 400'],['HITO_800','HITO 800'],['HITO_1000','HITO 1000']];$('#screen').innerHTML=`<div class="card"><h3>Registro colectivo de ${eif?'EIF por asignatura y semestre':'HITO por año'}</h3><p class="muted small">Se recuperan los estudiantes con rendiciones previas del período y los que figuran «en curso». La selección múltiple permite filtrar por cohorte y estado. Los puntajes vacíos no se registran como cero.</p>${row([field(eif?'Asignatura':'HITO','batch_type',opts[0]?.[0]||'','text',opts),field('Año de rendición','batch_year',new Date().getFullYear(),'number'),eif?field('Semestre','batch_sem','1','text',[['1','Primero'],['2','Segundo']]):field('Curso para seleccionar estudiantes','batch_course','','text',[['','Seleccionar curso'],...courseList().map(c=>[c.id,c.id+' · '+c.nombre])])])}<div class="bar">${button('Preparar planilla',`prepareBatch('${kind}')`,'primary')}</div></div><div id="batchArea"></div><div class="card"><h3>Rendiciones históricas (${arr.length})</h3>${row([field('Filtrar año','r_filter_year',''),field('Buscar estudiante o curso','r_filter_text','')])}<div class="tablewrap"><table class="tbl"><thead><tr><th>Tipo / Curso</th><th>Año · Semestre</th><th>Estudiante</th><th>Puntajes</th><th>Instrumento</th><th></th></tr></thead><tbody id="resultRows"></tbody></table></div></div>`;$('#r_filter_year').oninput=()=>fillResults(kind);$('#r_filter_text').oninput=()=>fillResults(kind);fillResults(kind)}
function fillResults(kind){let arr=db[kind==='eif'?'resultados_eif':'resultados_hito'].rendiciones,y=v('r_filter_year'),q=v('r_filter_text').toLowerCase();$('#resultRows').innerHTML=arr.map((r,i)=>({...r,i})).filter(r=>(!y||String(r.anio_rendicion).includes(y))&&(!q||(r.estudiante_ref+' '+(r.curso_id||r.tipo_hito)+' '+(student(r.estudiante_ref)?.nombre_completo||'')).toLowerCase().includes(q))).map(r=>`<tr><td>${esc(r.curso_id||r.tipo_hito)}</td><td>${esc(r.anio_rendicion)} · ${esc(r.semestre_rendicion||'—')}</td><td>${esc(student(r.estudiante_ref)?.nombre_completo||r.estudiante_ref)}</td><td>${Object.keys(r.puntajes_por_ia||r.puntajes_por_ra||{}).length}</td><td>${esc(r.version_instrumento||'Sin versión')}</td><td>${button('Editar',`newResult('${kind}',null,${r.i})`,'small')}</td></tr>`).join('')||'<tr><td colspan="6">Sin resultados registrados</td></tr>'}
function prepareBatch(kind){let eif=kind==='eif',type=v('batch_type'),yr=+v('batch_year'),sem=eif?+v('batch_sem'):null,courseid=eif?type:v('batch_course');if(!Number.isInteger(yr)||yr<1900||yr>2200)return alert('Año inválido');if(!courseid)return alert('Selecciona un curso para identificar a los estudiantes');let c=course(courseid);if(!c)return alert('Curso no reconocido');batchDraft={};batchCodes=[];batchMembers=studentList().filter(s=>s.plan_estudio===c.plan_id&&s.avance_curricular?.[courseid]?.estado==='en_curso').map(s=>s.rut);renderBatch(kind)}
function renderBatch(kind){let eif=kind==='eif',type=v('batch_type'),yr=+v('batch_year'),sem=eif?+v('batch_sem'):null,courseid=eif?type:v('batch_course'),c=course(courseid);let codes=eif?(db.resultados_eif.catalogo_por_curso[type]?.ia_evaluables_ids||course(type)?.indicadores_aprendizaje_ids||[]):Object.keys(db.perfil_egreso.resultados_aprendizaje);let matches=db[eif?'resultados_eif':'resultados_hito'].rendiciones.filter(r=>(eif?r.curso_id===type:r.tipo_hito===type)&&r.anio_rendicion===yr&&(!eif||r.semestre_rendicion===sem));let existing=new Map(matches.map(r=>[r.estudiante_ref,r]));let eligible=studentList().filter(s=>s.plan_estudio===c.plan_id&&!batchMembers.includes(s.rut));$('#batchArea').innerHTML=`<div class="card"><div class="row"><h3>Planilla: ${esc(eif?c.nombre:type)} · ${yr}${eif?' / Semestre '+sem:''}</h3><span class="tag">${batchMembers.length} estudiantes</span></div><p class="muted small">${codes.length} ${eif?'IA':'RA'} posibles. Se mostrarán solamente las columnas seleccionadas, y los valores de rendiciones previas se precargarán cuando coincidan año, período y estudiante.</p><div class="bar">${field('Agregar estudiante del Plan '+c.plan_id,'batch_add','','text',[['','Seleccionar estudiante'],...eligible.map(s=>[s.rut,s.nombre_completo])])}${button('Incorporar',`addBatchMember('${kind}')`)}${button('Elegir RA/IA',`chooseBatchCodes('${kind}')`)}</div><div class="columns">${field('Escala de puntajes','batch_scale',matches[0]?.escala||'1-7')}${field('Versión del instrumento','batch_version',matches[0]?.version_instrumento||'')}${field('Instancia de rendición','batch_attempt','1','number')}</div><div id="batchTable"></div><div class="bar" style="margin-top:12px">${button('Guardar todos los resultados',`saveBatch('${kind}')`,'primary')}</div></div>`;batchCodes=batchCodes.length?batchCodes.filter(x=>codes.includes(x)):codes.slice();drawBatchTable(kind)}
function chooseBatchCodes(kind){captureBatchDraft();let eif=kind==='eif',codes=eif?(db.resultados_eif.catalogo_por_curso[v('batch_type')]?.ia_evaluables_ids||course(v('batch_type'))?.indicadores_aprendizaje_ids||[]):Object.keys(db.perfil_egreso.resultados_aprendizaje);modal(`<div class="row"><h3>Seleccionar ${eif?'IA':'RA'} a evaluar</h3>${button('Cerrar','closeModal()','small')}</div><div class="scroll">${codes.map(code=>`<label style="display:block;padding:8px"><input type="checkbox" class="batch-code" value="${esc(code)}" ${batchCodes.includes(code)?'checked':''}> <b>${esc(code)}</b> · ${esc((eif?db.perfil_egreso.indicadores_aprendizaje[code]:db.perfil_egreso.resultados_aprendizaje[code])?.descripcion||'')}</label>`).join('')}</div>${button('Aplicar selección',`applyBatchCodes('${kind}')`,'primary')}`)}
function applyBatchCodes(kind){batchCodes=[...document.querySelectorAll('.batch-code:checked')].map(x=>x.value);closeModal();drawBatchTable(kind)}
function captureBatchDraft(){document.querySelectorAll(".batch-score").forEach(el=>{batchDraft[el.dataset.student+"|"+el.dataset.code]=el.value})}
function addBatchMember(kind){captureBatchDraft();let rut=v('batch_add');if(!rut)return;let c=course(kind==='eif'?v('batch_type'):v('batch_course'));if(!rut.startsWith('SIN_FICHA_')&&student(rut)?.plan_estudio!==c.plan_id)return alert('Estudiante de otro plan');if(!batchMembers.includes(rut))batchMembers.push(rut);renderBatch(kind)}
function drawBatchTable(kind){let eif=kind==='eif',type=v('batch_type'),yr=+v('batch_year'),sem=eif?+v('batch_sem'):null,arr=db[eif?'resultados_eif':'resultados_hito'].rendiciones;let codes=batchCodes||[];let rows=batchMembers.map(rut=>{let r=arr.find(x=>x.estudiante_ref===rut&&(eif?x.curso_id===type&&x.semestre_rendicion===sem:x.tipo_hito===type)&&x.anio_rendicion===yr);let scores=r?.[eif?'puntajes_por_ia':'puntajes_por_ra']||{};return `<tr><td><b>${esc(student(rut)?.nombre_completo||rut)}</b><div class="small muted">${esc(rut)}</div></td>${codes.map(code=>`<td><input type="number" step="any" class="batch-score" data-student="${esc(rut)}" data-code="${esc(code)}" aria-label="${esc(code)} ${esc(rut)}" value="${esc(batchDraft[rut+"|"+code]??scores[code]??'')}"></td>`).join('')}<td>${button('Quitar',`removeBatchMember('${kind}',${JSON.stringify(rut)})`,'small')}</td></tr>`}).join('');$('#batchTable').innerHTML=codes.length?`<div class="sheet"><table><thead><tr><th>Estudiante</th>${codes.map(x=>`<th title="${esc((eif?db.perfil_egreso.indicadores_aprendizaje[x]:db.perfil_egreso.resultados_aprendizaje[x])?.descripcion||'')}">${esc(x)}</th>`).join('')}<th></th></tr></thead><tbody>${rows||'<tr><td>Sin estudiantes: incorpóralos con el selector superior.</td></tr>'}</tbody></table></div>`:'<div class="notice warning">Selecciona al menos un RA o IA para mostrar la planilla.</div>'}

function cmDrawStudents(){let ss=cmVisibleStudents();$('#cmCards').innerHTML=ss.map(s=>`<label class="cmStudent"><input type="checkbox" class="cmPick" data-rut="${esc(s.rut)}" ${cmChosen.has(s.rut)?'checked':''}><div><b>${esc(s.nombre_completo)}</b><div class="small muted">${esc(s.rut)} · Ingreso ${esc(s.ingreso?.anio||'—')} · ${esc(s.avance_curricular?.[cmGetContext(cmSelectorKind).courseid]?.estado||'sin registro')}</div></div></label>`).join('')||'<p class="muted">No se encontraron estudiantes.</p>';document.querySelectorAll('.cmPick').forEach(el=>el.onchange=()=>{el.checked?cmChosen.add(el.dataset.rut):cmChosen.delete(el.dataset.rut);cmUpdateCount()});cmUpdateCount()}

function chooseBatchCodes(kind){captureBatchDraft();let x=cmGetContext(kind),codes=x.eif?(db.resultados_eif.catalogo_por_curso[x.type]?.ia_evaluables_ids||course(x.type)?.indicadores_aprendizaje_ids||[]):Object.keys(db.perfil_egreso.resultados_aprendizaje);let selected=new Set(cmColumns.map(x=>x.code));modal(`<div class="row"><h3>Seleccionar ${x.eif?'IA':'RA'}</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">Cada código seleccionado se muestra al menos una vez. Puedes repetirlo desde «Añadir columna».</p><div class="scroll">${codes.map(code=>`<label style="display:block;padding:8px"><input class="batch-code" type="checkbox" value="${esc(code)}" ${selected.has(code)?'checked':''}> <b>${esc(code)}</b> · ${esc((x.eif?db.perfil_egreso.indicadores_aprendizaje[code]:db.perfil_egreso.resultados_aprendizaje[code])?.descripcion||'')}</label>`).join('')}</div>${button('Aplicar',`cmApplyCodes('${kind}')`,'primary')}`)}
function cmApplyCodes(kind){let chosen=new Set([...document.querySelectorAll('.batch-code:checked')].map(x=>x.value));cmColumns=cmColumns.filter(c=>chosen.has(c.code));for(let code of chosen)if(!cmColumns.some(c=>c.code===code))cmColumns.push({code,n:1});batchCodes=[...chosen];closeModal();drawBatchTable(kind)}
function cmOpenAddColumn(kind){captureBatchDraft();if(!cmColumns.length)return alert('Primero selecciona RA o IA');let codes=[...new Set(cmColumns.map(c=>c.code))];modal(`<h3>Añadir una columna</h3>${field('Resultado de aprendizaje / Indicador','cmAddCode',codes[0],'text',codes.map(x=>[x,x]))}<p>Se conservarán todas las columnas del mismo código y se calculará su promedio simple.</p><div class="bar">${button('Añadir',`cmAddColumn('${kind}')`,'primary')}${button('Cancelar','closeModal()')}</div>`)}

function captureBatchDraft(){document.querySelectorAll('.batch-score').forEach(el=>{batchDraft[el.dataset.student+'|'+el.dataset.code+'|'+el.dataset.col]=el.value})}
function cmColumnVal(r,kind,code,n,rut){let k=rut+'|'+code+'|'+n;if(Object.prototype.hasOwnProperty.call(batchDraft,k))return batchDraft[k];let vals=cmScores(r||{},kind)[code]||[];return vals[n-1]??''}
function drawBatchTable(kind){let x=cmGetContext(kind),rs=cmSourceRows(kind),codes=[...new Set(cmColumns.map(c=>c.code))],c=course(x.courseid);if(!$('#batchTable'))return;let matching=rs.filter(r=>r.anio_rendicion===x.year&&(x.eif?r.curso_id===x.courseid&&Number(r.semestre_rendicion)===x.semester:r.tipo_hito===x.type));let existing=new Map(matching.map(r=>[r.estudiante_ref,r]));let scalebox=$('#cmScales');let prior={};scalebox?.querySelectorAll('.cm-scale').forEach(el=>prior[el.dataset.code]=el.value);let fallback=matching[0]?.escala||v('batch_scale')||'1-7';scalebox.innerHTML='<h4>Escala por '+(x.eif?'IA':'RA')+' (una para todos los estudiantes)</h4><div class="cmScaleGrid">'+codes.map(code=>{let configured=!x.eif?cmInstrument(x)?.items?.find(z=>z.ra===code):null;let sc=prior[code]||(configured?'0-'+configured.maximo:null)||matching.find(r=>cmScale(r,code))?.escalas_por_codigo?.[code]||fallback;return `<label><b>${esc(code)}</b><input class="cm-scale" data-code="${esc(code)}" value="${esc(sc)}" placeholder="1-7"></label>`}).join('')+'</div><p class="small muted">Ejemplos: 1-7, 0-100, 0-4. El límite inferior representa 0% y el superior 100%.</p>';scalebox.querySelectorAll('.cm-scale').forEach(el=>el.oninput=()=>cmRefreshPreview(kind));let heads=cmColumns.map(col=>`<th><span>${esc(col.code)} · ${col.n}</span><div>${button('×',`cmDropColumn('${kind}',${JSON.stringify(col.code)},${col.n})`,'small')}</div></th>`).join('');let rows=batchMembers.map(rut=>{let r=existing.get(rut);return `<tr><td><b>${esc(student(rut)?.nombre_completo||rut)}</b><div class="small muted">${esc(rut)}</div></td>${cmColumns.map(col=>`<td><input class="batch-score" type="number" step="any" data-student="${esc(rut)}" data-code="${esc(col.code)}" data-col="${col.n}" value="${esc(cmColumnVal(r,kind,col.code,col.n,rut))}"></td>`).join('')}${codes.map(code=>`<td class="cm-preview" data-student="${esc(rut)}" data-code="${esc(code)}">—</td>`).join('')}</tr>`}).join('');$('#batchTable').innerHTML=cmColumns.length?`<div class="sheet"><table><thead><tr><th>Estudiante</th>${heads}${codes.map(c=>`<th>${esc(c)}<div>Logro %</div></th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="20">Selecciona estudiantes para comenzar.</td></tr>'}</tbody></table></div>`:'<div class="notice warning">Selecciona al menos un RA / IA.</div>';document.querySelectorAll('.batch-score').forEach(el=>el.addEventListener('input',()=>cmRefreshPreview(kind)));cmRefreshPreview(kind)}
function cmRefreshPreview(kind){let scales=Object.fromEntries([...document.querySelectorAll('.cm-scale')].map(el=>[el.dataset.code,el.value]));document.querySelectorAll('.cm-preview').forEach(td=>{let cells=[...document.querySelectorAll('.batch-score')].filter(el=>el.dataset.student===td.dataset.student&&el.dataset.code===td.dataset.code&&el.value.trim()!=='');let nums=cells.map(el=>Number(el.value)),mean=cmMean(nums),pct=mean===null?null:cmPct(mean,scales[td.dataset.code]);td.textContent=pct===null?'—':pct.toFixed(1)+' %';td.title=mean===null?'Sin datos':'Promedio: '+mean.toFixed(2)})}
function saveBatch(kind){if(kind==='hito')cmSaveInstrument();let x=cmGetContext(kind),c=course(x.courseid),scales={};for(let el of document.querySelectorAll('.cm-scale')){let b=cmBounds(el.value);if(!b)return alert('Escala inválida para '+el.dataset.code+'. Indica mínimo y máximo, por ejemplo 1-7');scales[el.dataset.code]=el.value.trim()}if(!cmColumns.length)return alert('Selecciona RA/IA');let attempt=Number(v('batch_attempt'));if(!Number.isInteger(attempt)||attempt<1)return alert('Instancia inválida');let records={};for(let el of document.querySelectorAll('.batch-score')){if(el.value.trim()==='')continue;let n=Number(el.value),b=cmBounds(scales[el.dataset.code]);if(!Number.isFinite(n)||n<b.lo||n>b.hi)return alert(`El puntaje de ${el.dataset.code} debe estar entre ${b.lo} y ${b.hi}`);let r=records[el.dataset.student] ||= {};let z=r[el.dataset.code] ||= [];z[Number(el.dataset.col)-1]=n}let ar=cmSourceRows(kind),count=0;for(let [rut,data] of Object.entries(records)){if(!rut.startsWith('SIN_FICHA_')&&student(rut)?.plan_estudio!==c.plan_id)return alert('Estudiante de otro plan');let existing=ar.find(r=>r.estudiante_ref===rut&&r.anio_rendicion===x.year&&Number(r.instancia||1)===attempt&&(x.eif?r.curso_id===x.courseid&&Number(r.semestre_rendicion)===x.semester:r.tipo_hito===x.type&&(!r.curso_grupo_id||r.curso_grupo_id===x.courseid)));let r=existing||{id_rendicion:`${x.eif?'EIF':'HITO'}-${Date.now()}-${Math.random().toString(36).slice(2)}`,estudiante_ref:rut,anio_rendicion:x.year,instancia:attempt};let multi=x.eif?'desglose_por_ia':'desglose_por_ra',summary=x.eif?'puntajes_por_ia':'puntajes_por_ra',ach=x.eif?'logro_por_ia':'logro_por_ra';r[multi] ||= {};r[summary] ||= {};r[ach] ||= {};r.escalas_por_codigo ||= {};for(let [code,vals] of Object.entries(data)){let fixed=Array.from({length:cmColumns.filter(z=>z.code===code).length},(_,i)=>vals[i]??null);let mean=cmMean(fixed);if(mean===null)continue;r[multi][code]=fixed;r[summary][code]=mean;r[ach][code]=cmPct(mean,scales[code]);r.escalas_por_codigo[code]=scales[code]}if(x.eif){r.curso_id=x.courseid;r.semestre_rendicion=x.semester;r.ia_evaluados_ids=Object.keys(r[summary])}else{r.tipo_hito=x.type;r.curso_grupo_id=x.courseid;r.semestre_rendicion=null;r.ra_evaluados_ids=Object.keys(r[summary])}r.version_instrumento=v('batch_version')||null;r.escala=v('batch_scale')||'1-7';r.fecha_registro=date();if(!existing)ar.push(r);count++}if(!count)return alert('Ingresa al menos un puntaje');logChange('lote_'+kind,x.type,`${count} estudiantes · ${x.year}`);resultPage(kind);toast(count+' rendiciones guardadas con desgloses y porcentajes de logro. Exporta la base.')}

function cmInstrument(ctx=cmGetContext('hito')){return (db.resultados_hito.instrumentos||[]).find(z=>z.tipo_hito===ctx.type&&Number(z.anio_rendicion)===ctx.year&&z.curso_grupo_id===ctx.courseid&&Number(z.instancia||1)===Number(v('batch_attempt')||1))}
function cmOpenInstrument(){captureBatchDraft();let ctx=cmGetContext('hito'),saved=cmInstrument(ctx),all=Object.keys(db.perfil_egreso.resultados_aprendizaje||{});let entries=(saved?.items?.length?saved.items: [...new Set(cmColumns.map(z=>z.code))].map(ra=>({ra,cantidad:cmColumns.filter(z=>z.code===ra).length,maximo:Number(cmBounds(document.querySelector(`.cm-scale[data-code="${ra}"]`)?.value||'0-7')?.hi||7)})));let prev=new Map(entries.map(z=>[z.ra,z]));modal(`<div class="row"><h3>Configurar instrumento ${esc(ctx.type)} · ${ctx.year}</h3>${button('Cerrar','closeModal()','small')}</div><p class="muted small">Selecciona los RA que evalúa el instrumento, número de ítems por RA y puntaje máximo de <b>cada ítem</b>. No necesitas registrar resultados para guardar esta configuración.</p><div class="columns">${field('Nombre o versión del instrumento','ins_version',saved?.version_instrumento||v('batch_version')||'')}${field('Instancia de rendición','ins_attempt',saved?.instancia||v('batch_attempt')||1,'number')}</div><div class="scroll"><table class="tbl"><thead><tr><th>RA</th><th>Evaluar</th><th>N.º de ítems</th><th>Máximo por ítem</th></tr></thead><tbody>${all.map(ra=>{let z=prev.get(ra);return `<tr><td><b>${esc(ra)}</b></td><td><input type="checkbox" class="ins-on" data-ra="${esc(ra)}" ${z?'checked':''}></td><td><input type="number" min="1" max="50" value="${z?.cantidad||1}" class="ins-num" data-ra="${esc(ra)}" style="width:80px"></td><td><input type="number" min="0.01" step="any" value="${z?.maximo||7}" class="ins-max" data-ra="${esc(ra)}" style="width:95px"></td></tr>`}).join('')}</tbody></table></div><div class="bar" style="margin-top:12px">${button('Aplicar configuración', 'cmApplyInstrument()', 'primary')}${button('Cancelar','closeModal()')}</div>`)}
function cmApplyInstrument(){
 captureBatchDraft();let ctx=cmGetContext('hito'),attempt=Number(v('ins_attempt')),version=v('ins_version')||'';
 if(!Number.isInteger(attempt)||attempt<1)return alert('La instancia debe ser un entero positivo.');
 let items=[];document.querySelectorAll('.ins-on:checked').forEach(el=>{let ra=el.dataset.ra,n=Number(document.querySelector(`.ins-num[data-ra="${ra}"]`).value),max=Number(document.querySelector(`.ins-max[data-ra="${ra}"]`).value);items.push({ra,cantidad:n,maximo:max})});
 if(!items.length)return alert('Selecciona al menos un RA');
 if(items.some(z=>!Number.isInteger(z.cantidad)||z.cantidad<1||z.cantidad>50||!Number.isFinite(z.maximo)||z.maximo<=0))return alert('Revisa cantidades y máximos de los ítems.');
 let list=db.resultados_hito.instrumentos ||= [];
 let ins=list.find(z=>z.tipo_hito===ctx.type&&Number(z.anio_rendicion)===ctx.year&&z.curso_grupo_id===ctx.courseid&&Number(z.instancia||1)===attempt);
 if(!ins){ins={tipo_hito:ctx.type,anio_rendicion:ctx.year,curso_grupo_id:ctx.courseid,instancia:attempt};list.push(ins)}
 Object.assign(ins,{items,estudiantes:[...batchMembers],version_instrumento:version,fecha_actualizacion:date(),estado:'configurado_sin_puntajes_o_parcial'});
 $('#batch_attempt').value=String(attempt);$('#batch_version').value=version;
 cmColumns=items.flatMap(z=>Array.from({length:z.cantidad},(_,i)=>({code:z.ra,n:i+1})));
 closeModal();drawBatchTable('hito');items.forEach(z=>{let el=[...document.querySelectorAll('.cm-scale')].find(e=>e.dataset.code===z.ra);if(el)el.value='0-'+z.maximo});cmRefreshPreview('hito');
 logChange('instrumento_hito',ctx.type,`Instrumento ${ctx.year} · ${ctx.courseid} · instancia ${attempt}`);
 toast('Instrumento configurado y guardado en la sesión. Descarga la plantilla y exporta la Base Maestra para conservarlo.');
}
function cmSaveInstrument(){
 let x=cmGetContext('hito'),c=course(x.courseid);if(!c)return alert('Selecciona un curso');if(!cmColumns.length)return alert('Configura al menos un RA.');
 let attempt=Number(v('batch_attempt'));if(!Number.isInteger(attempt)||attempt<1)return alert('Instancia inválida');
 let items=[];for(let ra of [...new Set(cmColumns.map(z=>z.code))]){let cnt=cmColumns.filter(z=>z.code===ra).length,el=[...document.querySelectorAll('.cm-scale')].find(e=>e.dataset.code===ra),sc=el?.value||'0-7',b=cmBounds(sc);if(!b||b.lo!==0){alert('La escala del RA '+ra+' debe ir de 0 al puntaje máximo por ítem.');return false}items.push({ra,cantidad:cnt,maximo:b.hi})}
 let list=db.resultados_hito.instrumentos ||= [],inst=list.find(z=>z.tipo_hito===x.type&&Number(z.anio_rendicion)===x.year&&z.curso_grupo_id===x.courseid&&Number(z.instancia||1)===attempt);
 if(!inst){inst={tipo_hito:x.type,anio_rendicion:x.year,curso_grupo_id:x.courseid,instancia:attempt};list.push(inst)}
 Object.assign(inst,{items,estudiantes:[...batchMembers],version_instrumento:v('batch_version')||'',fecha_actualizacion:date(),estado:'configurado_sin_puntajes_o_parcial'});
 logChange('instrumento_hito',x.type,`Configuración ${x.year} · ${x.courseid} · ${batchMembers.length} estudiantes`);
 toast('Instrumento y nómina guardados en la sesión. Exporta la Base Maestra para conservarlos.');return true;
}
function cmInstrumentExcel(){
 let x=cmGetContext('hito');if(!cmColumns.length)return alert('Configura primero los RA y sus ítems.');
 if(cmSaveInstrument()!==true)return;
 let ins=cmInstrument(x);if(!ins)return alert('No se ha podido recuperar la configuración.');
 let cols=ins.items.flatMap(z=>Array.from({length:z.cantidad},(_,i)=>({code:z.ra,n:i+1,maximo:z.maximo})));
 let head=['Estudiante','RUT','Plan','Ingreso',...cols.map(z=>`${z.code} · Ítem ${z.n} (máx. ${z.maximo})`)];
 let max=['PUNTAJE MÁXIMO','','','',...cols.map(z=>z.maximo)];
 let rows=[head,max,...ins.estudiantes.map(rut=>{let stu=student(rut);return [stu?.nombre_completo||'',rut,stu?.plan_estudio||'',stu?.ingreso?.anio||'',...cols.map(()=> '')]})];
 cmExcelFile(rows,`Plantilla_${x.type}_${x.year}_${x.courseid.replace(':','_')}.xls`)
}
function cmPasteCleanRut(s){return String(s||'').replace(/[^0-9kK]/g,'').toUpperCase()}
function cmOpenPaste(kind){
 if(!cmColumns.length)return alert('Configura primero las columnas.');captureBatchDraft();
 modal(`<div class="row"><h3>Pegar resultados desde Excel</h3>${button('Cerrar','closeModal()','small')}</div><p class="small muted">En Excel, copia la tabla completa, incluidos encabezados y la fila PUNTAJE MÁXIMO. También se admite copiar solo las filas de estudiantes. Se coteja cada fila por RUT y cada columna por código e ítem, independientemente del orden. Las celdas vacías no se transforman en cero.</p><textarea id="cmPasteText" rows="9" style="width:100%;font-family:monospace" placeholder="Pega aquí las celdas copiadas desde Excel (Ctrl+V)"></textarea><div class="bar">${button('Revisar datos',`cmPreviewPaste('${kind}')`,'primary')}</div><div id="cmPastePreview"></div>`)
}
let cmPasteReady=[];
function cmPreviewPaste(kind){
 let raw=v('cmPasteText'),lines=raw.replace(/\r/g,'').split('\n').filter(q=>q.trim());
 if(!lines.length)return alert('Pega primero los datos copiados de Excel.');
 let grid=lines.map(line=>line.split('\t').map(t=>t.trim().replace(/^"|"$/g,'')));
 let first=grid[0].map(x=>x.toLowerCase()),hasHeader=first.some(x=>x.includes('rut'));
 let header=hasHeader?grid.shift():null;
 if(grid[0]?.[0]?.toUpperCase()==='PUNTAJE MÁXIMO')grid.shift();
 let cols=cmColumns.map(z=>({code:z.code,n:z.n,label:`${z.code} · Ítem ${z.n}`}));
 let keypos=header?header.findIndex(x=>/^rut$/i.test(x)):1;
 if(keypos<0)return alert('No se encuentra la columna RUT.');
 let mappings=[];
 if(header){for(let z of cols){let matching=header.map((h,i)=>({h,i})).filter(o=>o.h.includes(z.code)&&new RegExp('Ítem\\s*'+z.n+'(?:\\D|$)','i').test(o.h));if(matching.length!==1)return alert('No pude identificar inequívocamente la columna '+z.label+'; utiliza la plantilla descargada.');mappings.push(matching[0].i)}}else mappings=cols.map((_,i)=>i+4);
 let seen=new Set(),errors=[],valid=[];
 let context=cmGetContext(kind),c=course(context.courseid),scales=Object.fromEntries([...document.querySelectorAll('.cm-scale')].map(el=>[el.dataset.code,cmBounds(el.value)]));
 for(let [i,row] of grid.entries()){
  if(row.every(x=>x===''))continue;let rut=cmPasteCleanRut(row[keypos]),stu=studentList().find(s=>cmPasteCleanRut(s.rut)===rut);
  if(!rut){errors.push(`Fila ${i+1}: RUT vacío`);continue}if(seen.has(rut)){errors.push(`Fila ${i+1}: RUT repetido`);continue}seen.add(rut);
  if(!stu){errors.push(`Fila ${i+1}: RUT no encontrado`);continue}if(stu.plan_estudio!==c.plan_id){errors.push(`Fila ${i+1}: estudiante de otro plan`);continue}
  let values=[],bad=false;
  for(let [j,col] of cols.entries()){let val=(row[mappings[j]]||'').replace(',','.');if(val===''){values.push(null);continue}let num=Number(val),b=scales[col.code];if(!Number.isFinite(num)||!b||num<b.lo||num>b.hi){errors.push(`Fila ${i+1}, ${col.label}: puntaje ${val} fuera de escala`);bad=true;break}values.push(num)}
  if(!bad)valid.push({rut:stu.rut,nombre:stu.nombre_completo,values});
 }
 cmPasteReady=errors.length?[]:valid;
 $('#cmPastePreview').innerHTML=`<div class="notice ${errors.length?'warning':''}"><b>${valid.length} estudiantes listos</b> · ${errors.length} observaciones. ${errors.length?'Corrige antes de aplicar.':'Revisa antes de incorporar.'}</div>${errors.length?`<div class="scroll">${errors.map(e=>`<p>${esc(e)}</p>`).join('')}</div>`:''}<div class="tablewrap"><table class="tbl"><thead><tr><th>Estudiante</th><th>RUT</th><th>Valores válidos</th></tr></thead><tbody>${valid.slice(0,30).map(r=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.rut)}</td><td>${r.values.filter(x=>x!==null).length} / ${cols.length}</td></tr>`).join('')}</tbody></table></div>${!errors.length&&valid.length?button('Incorporar puntajes revisados',`cmApplyPaste('${kind}')`,'primary'):''}`;
}
function cmApplyPaste(kind){
 if(!cmPasteReady.length)return;
 captureBatchDraft();let add=cmPasteReady.filter(x=>!batchMembers.includes(x.rut)).map(x=>x.rut);
 batchMembers=[...batchMembers,...add].sort((a,b)=>(student(a)?.nombre_completo||'').localeCompare(student(b)?.nombre_completo||'','es'));
 for(let r of cmPasteReady)cmColumns.forEach((col,i)=>{if(r.values[i]!==null)batchDraft[r.rut+'|'+col.code+'|'+col.n]=String(r.values[i])});

function cmApplyFlexiblePaste(kind){

function cmGlobalDetailRows(q){

function endStore(){let e=db.resultados_end||={};e.periodicidad='anual';e.unidad_analisis='agregado_institucional';e.asociacion_estudiantes=false;e.asociacion_cohortes=false;e.almacenamiento='estadisticos_anonimizados';e.pruebas||={PCPG:{dimensiones:['Dominio 1','Dominio 2','Dominio 3','Dominio 4'],tipo:'pedagogica'},PCDD:{dimensiones:['Disciplinar','Didáctica'],tipo:'disciplinar_didactica'}};e.anualidades||={};for(const yr of Object.values(e.anualidades))for(const [test,result] of Object.entries(yr||{})){for(const m of Object.values(result?.metricas||{})){delete m.cumple_60;delete m.cumple_70;}if(test==='PCDD'){delete result?.metricas?.e7;delete result?.metricas?.e8;}}return e}
function endNumber(s){const v=String(s??'').trim().replace(/\s/g,'').replace(',','.');if(!v||v==='--'||v==='-')return null;let n=Number(v);return Number.isFinite(n)?n:null}
function endLabel(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s_-]+/g,'').replace(/[^a-z0-9]/g,'')}
function endAllowed(kind,key){return key==='puntaje'||(kind==='PCPG'?/^d[1-4]$/.test(key)||/^e(?:10|[1-9])$/.test(key):/^d[12]$/.test(key)||/^e[1-6]$/.test(key))}
function endCategoryName(key){return ({PA_CE:'Pregunta abierta · Comunicación escrita',PA_SP:'Pregunta abierta · Situación pedagógica',PA_PCDD:'Pregunta abierta de la PCDD',nivel_logro:'Nivel de logro',grupo_rendimiento:'Grupo de rendimiento'})[key]||key}
function endParse(text){let lines=String(text).trim().split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('Pega encabezados y al menos una fila.');let separator=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':null;if(!separator)throw Error('Copia una tabla de Excel con tabulaciones, o un CSV con punto y coma.');let head=lines[0].split(separator).map(x=>x.replace(/^"|"$/g,'').trim()),labels=head.map(endLabel);if(!labels.includes('puntaje'))throw Error('Falta columna de puntaje global.');let metrics=[];head.forEach((h,i)=>{let k=labels[i];if(k==='puntaje')metrics.push({i,key:'puntaje',label:'Puntaje global',range:null});else if(/^d[1-9]\d*$/.test(k)&&endAllowed(v('end_kind'),k))metrics.push({i,key:k,label:'Dimensión / dominio '+k.slice(1),range:[0,1]});else if(/^e[1-9]\d*$/.test(k)&&endAllowed(v('end_kind'),k))metrics.push({i,key:k,label:'Estándar '+k.slice(1),range:[0,1]})});if(!metrics.length)throw Error('No se reconocieron indicadores.');let categorical=[];head.forEach((h,i)=>{let k=labels[i];if(['nivellogro','gruporendimiento','pace','pasp','papcdd'].includes(k))categorical.push({i,key:k==='pace'?'PA_CE':k==='pasp'?'PA_SP':k==='papcdd'?'PA_PCDD':k==='nivellogro'?'nivel_logro':'grupo_rendimiento'})});let rows=[];for(let line of lines.slice(1)){let cells=line.split(separator).map(x=>x.trim().replace(/^"|"$/g,''));if(cells.every(x=>!x||x==='--'))continue;rows.push({metrics:Object.fromEntries(metrics.map(m=>[m.key,endNumber(cells[m.i])])),categories:Object.fromEntries(categorical.map(c=>[c.key,String(cells[c.i]||'').trim().toUpperCase()]))})}if(!rows.length)throw Error('No hay filas válidas.');return {rows,metrics,categorical,headers:head}}
function endSummary(nums,range){
 const values=nums.filter(Number.isFinite),n=values.length;
 if(!n)return {n:0,promedio:null,desviacion_estandar:null,mediana:null,minimo:null,maximo:null};
 const a=[...values].sort((x,y)=>x-y),mean=values.reduce((x,y)=>x+y,0)/n;
 const variance=values.reduce((x,y)=>x+(y-mean)**2,0)/n;
 return {n,promedio:mean,desviacion_estandar:Math.sqrt(variance),mediana:n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2,minimo:a[0],maximo:a[n-1]};
}

function endCatalogue(kind){
 const ped=db.estandares_pedagogicos?.dominios||[],dis=db.estandares_disciplinares?.areas||[];
 const out={puntaje:'Puntaje global'};
 if(kind==='PCPG'){
  ped.forEach((d,i)=>out['d'+(i+1)]=d.nombre||`Dominio ${'ABCD'[i]}`);
  ped.forEach(d=>(d.estandares||[]).forEach(st=>{let m=(st.nombre||'').match(/Estándar\s+(\d+)/i);if(m)out['e'+m[1]]=st.nombre}));
 }else{
  out.d1='Conocimiento disciplinar';out.d2='Conocimiento didáctico';
  dis.forEach((area,i)=>{
   const letter=String.fromCharCode(65+i);
   out['e'+(i+1)]=area.nombre||`Estándar ${letter}`;
  });
 }
 return out;
}

function endParseManual(text,kind){
 const lines=String(text||'').trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw Error('Pega encabezados y al menos una fila de estadísticos.');
 const sep=lines[0].includes('\t')?'\t':';',head=lines[0].split(sep).map(endLabel);
 const get=(cells,keys)=>{let i=head.findIndex(h=>keys.includes(h));return i<0?null:endNumber(cells[i])};
 const metrics={},cat=endCatalogue(kind);
 for(const line of lines.slice(1)){
  let cells=line.split(sep).map(x=>x.trim()),key=cells[0]?.toLowerCase().trim();if(!endAllowed(kind,key))throw Error('Código no contemplado para '+kind+': '+key);
  if(kind==='PCPG'&&/^d/.test(key)&&!/^d[1-4]$/.test(key))throw Error('PCPG admite d1–d4.');
  if(kind==='PCDD'&&/^d/.test(key)&&!/^d[1-2]$/.test(key))throw Error('PCDD admite d1–d2.');
  if(metrics[key])throw Error('Código duplicado: '+key);
  const n=get(cells,['n','cantidad']),mean=get(cells,['promedio','media']),sd=get(cells,['de','desviacionestandar']),median=get(cells,['mediana']),min=get(cells,['min','minimo']),max=get(cells,['max','maximo']);
  if(mean===null)throw Error('Falta promedio de '+key);if(key!=='puntaje'&&(mean<0||mean>1))throw Error('El promedio de '+key+' debe estar entre 0 y 1.');
  if([sd,min,max,median].some(x=>x!==null&&key!=='puntaje'&&(x<0||x>1)))throw Error('Algunos estadísticos de '+key+' están fuera de 0–1.');
  metrics[key]={n:n??null,promedio:mean,desviacion_estandar:sd,mediana:median,minimo:min,maximo:max,etiqueta:cat[key]||('Estándar '+key),unidad:key==='puntaje'?'puntaje':'proporcion',origen:'manual'};

function endParseNationals(text,kind){
 const lines=String(text||'').trim().split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(lines.length<2)throw Error('Pega encabezados y al menos una fila de promedios nacionales.');
 const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':null;
 if(!sep)throw Error('Se requieren columnas separadas por tabulaciones de Excel o punto y coma.');
 const parts=line=>line.split(sep).map(v=>v.trim().replace(/^"|"$/g,''));
 const headers=parts(lines[0]).map(endLabel),accepted=k=>endAllowed(kind,k);
 const result={},add=(code,raw)=>{
  code=endLabel(code);if(!accepted(code))return;
  const n=endNumber(raw);if(n===null)return;
  if(code!=='puntaje'&&(n<0||n>1))throw Error(code+': el promedio debe estar entre 0 y 1.');
  if(code==='puntaje'&&n<0)throw Error('El puntaje nacional no puede ser negativo.');
  if(Object.hasOwn(result,code)&&Math.abs(result[code]-n)>1e-9)throw Error('Valores distintos para '+code+' en el mismo pegado.');
  result[code]=n;
 };
 // Horizontal: puntaje, d1, d2, e1...; omit PCDD e7 and e8, which are not defined.
 const wide=headers.map((h,i)=>({h,i})).filter(x=>accepted(x.h));
 if(wide.length){
  if(lines.length!==2)throw Error('En formato horizontal usa una fila de encabezados y una fila de promedios nacionales.');
  const cells=parts(lines[1]);for(const {h,i} of wide)add(h,cells[i]);
 }else{
  const codeIndex=headers.findIndex(h=>['codigo','indicador','estandar','dimension','variable'].includes(h));
  const valueIndex=headers.findIndex(h=>['promedio','media','promedionacional','medianacional','valor'].includes(h));
  if(codeIndex<0||valueIndex<0)throw Error('Usa encabezados puntaje/d1/e1, o las columnas codigo y promedio.');
  for(const line of lines.slice(1)){const cells=parts(line);add(cells[codeIndex],cells[valueIndex]);}
 }

}

/* Productividad académica y seminarios: datos compatibles con bases anteriores */
function academicStore(){if(!db.productividad_academica)db.productividad_academica={investigacion:[],creacion:[],docencia:[],revistas:[],seminarios_grado:[]};let p=db.productividad_academica;for(let k of ['investigacion','creacion','docencia','revistas','seminarios_grado'])p[k] ||= [];return p}
const acadTypes=['Artículo','Libro','Capítulo de libro','Ponencia','Conferencia','Proyecto'];
let acadTab='investigacion',acadMode='visualizar',acadEdit=null;
function acadId(){return 'PA-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function acadYear(){return new Date().getFullYear()}
function acadTeacherOptions(){return teachers().map(t=>[t.id,t.nombre_completo])}
function acadStudentOptions(){return studentList().sort((a,b)=>a.nombre_completo.localeCompare(b.nombre_completo,'es')).map(t=>[t.rut,t.nombre_completo+' · '+t.rut])}
function acadTags(xs){return (xs||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')}
function acadSplit(x){return [...new Set(String(x||'').split(/[;\n]/).map(z=>z.trim()).filter(Boolean))]}
function acadParticipantsHTML(title,prefix,allowed,prior=[],roles=[]){let opts=allowed==='teacher'?acadTeacherOptions():acadStudentOptions(),selected=new Set(prior.filter(x=>x.id).map(x=>x.id));return `<div class="card" style="margin:8px 0"><h4>${esc(title)}</h4><p class="small muted">Selecciona varias fichas. Las personas externas se incorporan solo a este producto, no al directorio oficial.</p><input id="${prefix}_q" placeholder="Buscar participante..." oninput="acadFilterParticipants('${prefix}')"><div id="${prefix}_cards" class="acadPeople">${opts.map(([id,name])=>`<label class="acadPerson" data-name="${esc(name.toLowerCase())}"><input type="checkbox" class="${prefix}_pick" value="${esc(id)}" ${selected.has(id)?'checked':''}><span>${esc(name)}</span>${roles.length?`<select class="acad-role" data-id="${esc(id)}">${roles.map(rol=>`<option value="${esc(rol)}" ${(prior.find(x=>x.id===id)?.rol||roles[0])===rol?'selected':''}>${esc(rol)}</option>`).join('')}</select>`:''}</label>`).join('')}</div><div class="columns">${field('Participantes externos (separar por ;)',prefix+'_external',prior.filter(x=>!x.id).map(x=>x.nombre).join(';'))}${roles.length?field('Rol predeterminado',prefix+'_role',prior.find(x=>x.rol)?.rol||roles[0],'text',roles.map(x=>[x,x])):''}</div></div>`}
function acadFilterParticipants(pre){let q=v(pre+'_q').toLowerCase();document.querySelectorAll('#'+pre+'_cards .acadPerson').forEach(x=>x.hidden=!x.dataset.name.includes(q))}
function acadCollect(pre){let r=v(pre+'_role')||null,arr=[...document.querySelectorAll('.'+pre+'_pick:checked')].map(el=>({id:el.value,nombre:(pre==='ac_teachers'||pre==='doc_teachers'||pre==='sem_guides'||pre==='sem_readers'?teachers().find(x=>x.id===el.value)?.nombre_completo:student(el.value)?.nombre_completo)||el.value,...((el.closest('label')?.querySelector('.acad-role')?.value||r)?{rol:el.closest('label')?.querySelector('.acad-role')?.value||r}:{})}));return [...arr,...acadSplit(v(pre+'_external')).map(nombre=>({id:null,nombre,...(r?{rol:r}:{})}))]}
function academicPage(){let p=academicStore();$('#screen').innerHTML=`<div class="card"><h3>Productividad Académica</h3><p class="muted">Investigación, creación, docencia y seminarios de grado. Los registros se conservan en el JSON al exportar la Base Maestra.</p><div class="bar">${[['investigacion','Investigación'],['creacion','Creación'],['docencia','Docencia (beta)'],['seminarios_grado','Seminarios de grado']].map(([k,n])=>button(n,`acadChangeTab('${k}')`,acadTab===k?'primary':'' )).join('')}</div><div class="bar" style="margin-top:12px">${button('Visualizar',"acadChangeMode('visualizar')",acadMode==='visualizar'?'primary':'')}${button('Agregar',"acadChangeMode('agregar')",acadMode==='agregar'?'primary':'')}</div></div><div id="academicBody"></div>`;acadDraw()}
function acadChangeTab(k){acadTab=k;acadMode='visualizar';academicPage()}
function acadChangeMode(k){acadMode=k;academicPage()}
function acadDraw(){let el=$('#academicBody');if(acadTab==='creacion'){el.innerHTML='<div class="card"><h3>Productos de creación</h3><p class="notice">Agregar y visualizar (en construcción). Funciones deshabilitadas por ahora.</p><button class="btn" disabled>Agregar</button> <button class="btn" disabled>Visualizar</button></div>';return}if(acadMode==='agregar')return acadForm();acadListing()}
function acadCommon(t='Artículo',rec={}){return `<div class="columns">${field('Año','ac_year',rec.anio||acadYear(),'number')}${field('Tipo de producto','ac_type',rec.tipo||t,'text',acadTypes.map(x=>[x,x]))}</div>`}
function acadForm(rec=null){let isDoc=acadTab==='docencia',isSem=acadTab==='seminarios_grado';rec=rec||{};acadEdit=rec.id||null;let head=isDoc?'Producto de docencia':isSem?'Seminario de grado':'Producto de investigación';let html=`<div class="card"><h3>${acadEdit?'Editar':'Agregar'} · ${head}</h3>`;
if(isSem)html+=`${field('Año','ac_year',rec.anio||acadYear(),'number')}${field('Título','ac_title',rec.titulo||'')}<label><input type="checkbox" id="ac_provisional" ${rec.titulo_provisorio?'checked':''}> Título provisorio</label> <label><input type="checkbox" id="ac_pending" ${rec.pendiente_entrega?'checked':''}> Seminario pendiente de entrega</label>${acadParticipantsHTML('Estudiantes autores','sem_authors','student',rec.estudiantes||[])}${acadParticipantsHTML('Profesor/a guía','sem_guides','teacher',rec.guias||[])}${acadParticipantsHTML('Profesores/as informantes','sem_readers','teacher',rec.informantes||[])}`;
else if(isDoc)html+=`${field('Año','ac_year',rec.anio||acadYear(),'number')}${acadParticipantsHTML('Profesores','doc_teachers','teacher',rec.profesores||[])}${acadParticipantsHTML('Estudiantes','doc_students','student',rec.estudiantes||[])}<label class="label">Descripción del producto</label><textarea id="ac_description" rows="4">${esc(rec.descripcion||'')}</textarea><div class="columns">${field('Validación MEFID','ac_mefid',rec.mefid||'en_proceso','text',[['si','Sí'],['no','No'],['en_proceso','En proceso']])}${field('Enlace','ac_link',rec.enlace||'')}</div><p class="small muted">Módulo en formato beta.</p>`;
else {html+=acadCommon(rec.tipo||'Artículo',rec)+`<div id="ac_type_fields"></div>${acadParticipantsHTML('Profesores participantes','ac_teachers','teacher',rec.profesores||[],['IR','COI','Tesista','Asistente'])}${acadParticipantsHTML('Estudiantes participantes / coautores','ac_students','student',rec.estudiantes||[],['Personal técnico o de apoyo','Tesista','Otro'])}<label class="label">Palabras clave, separadas por punto y coma (;)</label><textarea id="ac_keywords" rows="2">${esc((rec.palabras_clave||[]).join('; '))}</textarea><div class="bar">${button('Agregar palabra clave',"acadAddKeyword()")}</div>`}
html+=`<div class="bar">${button('Guardar producto',"acadSave()",'primary')}${button('Cancelar',"acadChangeMode('visualizar')")}</div></div>`;$('#academicBody').innerHTML=html;if(!isDoc&&!isSem){$('#ac_type').onchange=()=>acadTypeFields({});acadTypeFields(rec)}}
function acadAddKeyword(){let w=prompt('Escribe una palabra clave');if(w)$('#ac_keywords').value+=(v('ac_keywords')?'; ':'')+w.trim()}
function acadTypeFields(rec={}){let type=v('ac_type');let f=type==='Artículo'?`${field('Título','ac_title',rec.titulo||'')}${field('Revista','ac_journal',rec.revista||'')}${field('Enlace o DOI','ac_link',rec.enlace||'')}${field('Indexación','ac_index',rec.indexacion||'OTRA','text',['WOS','SCOPUS','SCIELO','ERIHPLUS','OTRA'].map(x=>[x,x]))}${field('Otra indexación (si corresponde)','ac_other',rec.otra_indexacion||'')}`:type==='Libro'?`${field('Título','ac_title',rec.titulo||'')}${field('ISBN / DOI / enlace','ac_link',rec.enlace||'')}${field('Rol','ac_rol',rec.rol||'Autor','text',['Autor','Compilador','Coordinador','Editor'].map(x=>[x,x]))}${field('Revisión por pares','ac_peer',rec.revision_pares||'no_informado','text',[['no_informado','Sin informar'],['si','Sí'],['no','No']])}`:type==='Capítulo de libro'?`${field('Título','ac_title',rec.titulo||'')}${field('Libro','ac_book',rec.libro||'')}${field('Autores / editores / compiladores','ac_editors',rec.autores_editores||'')}${field('ISBN / DOI / enlace','ac_link',rec.enlace||'')}${field('Revisión por pares','ac_peer',rec.revision_pares||'no_informado','text',[['no_informado','Sin informar'],['si','Sí'],['no','No']])}`:['Ponencia','Conferencia'].includes(type)?`${field('Título','ac_title',rec.titulo||'')}${field('Congreso o evento académico','ac_event',rec.evento||'')}`:`${field('Título','ac_title',rec.titulo||'')}${field('Código','ac_code',rec.codigo||'')}${field('Financiamiento','ac_funding',rec.financiamiento||'externo','text',[['interno','Interno'],['externo','Externo']])}${field('Inicio','ac_start',rec.inicio||rec.anio||acadYear(),'number')}${field('Término (vacío si continúa)','ac_end',rec.termino??'','number')}<p class="notice">Para proyectos, el rol escogido para cada grupo se conserva en sus participaciones; puede afinarse individualmente en una edición posterior.</p>`;$('#ac_type_fields').innerHTML=f;if(type==='Artículo'){$('#ac_journal').setAttribute('list','acad_journals');$('#ac_type_fields').insertAdjacentHTML('beforeend',`<datalist id="acad_journals">${academicStore().revistas.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`)}}
function acadSave(){let p=academicStore(),kind=acadTab,arr=p[kind],old=arr.find(x=>x.id===acadEdit),type=kind==='investigacion'?v('ac_type'):kind==='docencia'?'Docencia':'Seminario';let rec={...(old||{}),id:acadEdit||acadId(),anio:Number(v('ac_year'))||null,tipo:type};if(kind==='investigacion'){Object.assign(rec,{titulo:v('ac_title'),profesores:acadCollect('ac_teachers'),estudiantes:acadCollect('ac_students'),palabras_clave:acadSplit(v('ac_keywords'))});for(let [k,id] of Object.entries({revista:'ac_journal',enlace:'ac_link',indexacion:'ac_index',otra_indexacion:'ac_other',rol:'ac_rol',revision_pares:'ac_peer',libro:'ac_book',autores_editores:'ac_editors',evento:'ac_event',codigo:'ac_code',financiamiento:'ac_funding'}))rec[k]=v(id)||null;if(type==='Proyecto'){rec.inicio=Number(v('ac_start'))||null;rec.termino=Number(v('ac_end'))||null;}if(rec.revista&&!p.revistas.includes(rec.revista))p.revistas.push(rec.revista)}else if(kind==='docencia'){Object.assign(rec,{profesores:acadCollect('doc_teachers'),estudiantes:acadCollect('doc_students'),descripcion:v('ac_description'),mefid:v('ac_mefid'),enlace:v('ac_link')})}else{Object.assign(rec,{titulo:v('ac_title'),estudiantes:acadCollect('sem_authors'),guias:acadCollect('sem_guides'),informantes:acadCollect('sem_readers'),titulo_provisorio:$('#ac_provisional').checked,pendiente_entrega:$('#ac_pending').checked})}if(!old)arr.push(rec);else Object.assign(old,rec);logChange('producto_academico',rec.id,kind);acadMode='visualizar';academicPage();toast('Producto guardado. Exporta la Base Maestra para conservarlo.');}
function acadPending(r){if(r.tipo==='Docencia')return !r.descripcion||!r.profesores?.length&&!r.estudiantes?.length;if(r.tipo==='Seminario')return r.titulo_provisorio||r.pendiente_entrega||!r.titulo||!r.estudiantes?.length||!r.guias?.length;return !r.titulo||(r.tipo==='Artículo'&&(!r.revista||!r.enlace||!r.indexacion))||(r.tipo==='Libro'&&!r.enlace)||(r.tipo==='Capítulo de libro'&&(!r.libro||!r.enlace))||(['Ponencia','Conferencia'].includes(r.tipo)&&!r.evento)||(r.tipo==='Proyecto'&&(!r.codigo||!r.inicio||!r.financiamiento))}
function acadText(r){return [r.titulo||r.descripcion||'(Sin título)',r.tipo, r.revista||r.libro||r.evento||'',r.enlace||'',(r.profesores||[]).map(x=>x.nombre).join(', '),(r.estudiantes||[]).map(x=>x.nombre).join(', ')].filter(Boolean).join(' — ')}
function acadFiltered(){let q=v('acad_q').toLocaleLowerCase('es'),y=v('acad_year'),typ=v('acad_filtertype'),teach=v('acad_teacher'),students=$('#acad_students')?.checked,pending=$('#acad_pending')?.checked,active=$('#acad_active')?.checked;return (academicStore()[acadTab]||[]).filter(r=>(!q||acadText(r).toLocaleLowerCase('es').includes(q))&&(!y||String(r.anio)===y)&&(!typ||r.tipo===typ)&&(!teach||(r.profesores||r.guias||[]).concat(r.informantes||[]).some(p=>p.id===teach))&&(!students||(r.estudiantes||[]).length)&&(!pending||acadPending(r))&&(!active||(r.tipo==='Proyecto'&&(!y||((!r.inicio||r.inicio<=Number(y))&&(!r.termino||r.termino>=Number(y))))))).sort((a,b)=>(b.anio||0)-(a.anio||0)||acadText(a).localeCompare(acadText(b),'es'))}
function acadTypeOptions(){return [['','Todos'],...(acadTab==='investigacion'?acadTypes:(acadTab==='docencia'?['Docencia']:['Seminario'])).map(x=>[x,x])]}
function acadListing(){let arr=academicStore()[acadTab],years=[...new Set(arr.map(x=>x.anio).filter(Boolean))].sort((a,b)=>b-a);$('#academicBody').innerHTML=`<div class="card"><div class="row"><h3>${acadTab==='investigacion'?'Productos de investigación':acadTab==='docencia'?'Productos de docencia (beta)':'Seminarios de grado'} (${arr.length})</h3>${button('Agregar nuevo',"acadChangeMode('agregar')",'primary')}</div><div class="columns">${field('Buscar','acad_q','')}${field('Año','acad_year','','text',[['','Todos'],...years.map(x=>[x,x])])}${field('Tipo','acad_filtertype','','text',acadTypeOptions())}${field('Profesor/a','acad_teacher','','text',[['','Todos'],...acadTeacherOptions()])}</div><div class="bar"><label><input id="acad_students" type="checkbox"> Solo con estudiantes</label><label><input id="acad_pending" type="checkbox"> Ver pendientes</label> <label><input id="acad_active" type="checkbox"> Proyectos vigentes en el año seleccionado</label></div><div class="bar">${button('Exportar Excel',"acadExportExcel()")}${button('Exportar texto plano',"acadExportText()")}${acadTab!=='docencia'?button('Pegar masivamente desde Excel',"acadBulkOpen()") :''}</div><div id="acad_results"></div></div>`;['acad_q','acad_year','acad_filtertype','acad_teacher','acad_students','acad_pending','acad_active'].forEach(id=>$('#'+id).addEventListener('input',acadDrawList));acadDrawList()}
function acadDrawList(){let rows=acadFiltered();$('#acad_results').innerHTML=`<p class="small muted">${rows.length} productos · ${rows.filter(acadPending).length} pendientes en selección</p>${rows.map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.titulo||r.descripcion||'Sin título')}</strong> <span class="tag">${esc(r.tipo)}</span> <span class="tag">${esc(r.anio||'Sin año')}</span> ${acadPending(r)?'<span class="tag">Pendiente de completar</span>':''}<div class="small muted">${esc([...(r.profesores||[]),...(r.guias||[]),...(r.informantes||[])].map(x=>x.nombre).join(', '))}</div><div class="small muted">${esc((r.estudiantes||[]).map(x=>x.nombre).join(', '))}</div>${r.tipo==='Proyecto'?`<p class="small">Vigencia: ${esc(r.inicio||'?')} – ${esc(r.termino||'En curso')}</p>`:''}</div>${button('Editar',`acadEditRecord('${r.id}')`,'small')}</div></div>`).join('')||'<p class="muted">Sin productos para esos filtros.</p>'}`}
function acadEditRecord(id){let rec=academicStore()[acadTab].find(x=>x.id===id);if(!rec)return;acadMode='agregar';academicPage();acadForm(rec)}
function acadExportExcel(){let rows=acadFiltered();cmExcelFile([['ID','Año','Tipo','Título/Descripción','Profesores','Estudiantes','Revista/Libro/Evento','Enlace','Inicio','Término','Pendiente','Palabras clave'],...rows.map(r=>[r.id,r.anio,r.tipo,r.titulo||r.descripcion||'',(r.profesores||r.guias||[]).concat(r.informantes||[]).map(x=>x.nombre).join('; '),(r.estudiantes||[]).map(x=>x.nombre).join('; '),r.revista||r.libro||r.evento||'',r.enlace||'',r.inicio||'',r.termino||'',acadPending(r)?'Sí':'No',(r.palabras_clave||[]).join('; ')])],`Castellano_Maestro_${acadTab}.xls`)}
function acadExportText(){let rows=acadFiltered();download(new Blob([rows.map(acadText).join('\n\n')],{type:'text/plain;charset=utf-8'}),`Castellano_Maestro_${acadTab}.txt`)}
function acadProfileForTeacher(id){let p=academicStore();let out='';for(let [lab,arr] of [['Investigación',p.investigacion],['Docencia',p.docencia]]){let hits=arr.filter(r=>(r.profesores||[]).some(x=>x.id===id));out+=`<div class="card"><h4>${lab}</h4>${hits.map(r=>`<p>${esc(r.anio||'—')} · ${esc(r.titulo||r.descripcion||'Sin título')} (${esc(r.tipo)})</p>`).join('')||'<p class="muted">Sin registros.</p>'}</div>`}let sem=p.seminarios_grado||[];for(let [lab,key] of [['Seminarios de grado · Profesor/a guía','guias'],['Seminarios de grado · Profesor/a informante','informantes']]){let hits=sem.filter(r=>(r[key]||[]).some(x=>x.id===id));out+=`<div class="card"><h4>${lab}</h4>${hits.map(r=>`<p>${esc(r.anio||'—')} · ${esc(r.titulo||'Sin título')}</p>`).join('')||'<p class="muted">Sin registros.</p>'}</div>`}return out}

/* Gestor Maestro v18: bolsas y EIF institucional agregada, sin microdatos permanentes */
function cmAggregateEIF(records){
 const groups=new Map();
 for(const r of records||[]){if(!r.curso_id||!r.anio_rendicion||!r.semestre_rendicion)continue;
  const key=[r.curso_id,r.anio_rendicion,r.semestre_rendicion].join('|');
  if(!groups.has(key))groups.set(key,{curso_id:r.curso_id,anio_rendicion:Number(r.anio_rendicion),semestre_rendicion:Number(r.semestre_rendicion),datos:{},personas:new Set()});
  const g=groups.get(key);if(r.estudiante_ref)g.personas.add(r.estudiante_ref);
  for(const [ia,vals] of Object.entries(cmScores(r,'eif'))){let avg=cmMean(vals),pct=r.logro_por_ia?.[ia];if(!Number.isFinite(pct))pct=cmPct(avg,cmScale(r,ia));if(Number.isFinite(pct)&&pct>=0&&pct<=100)(g.datos[ia]||=[]).push(pct)}
 }
 return [...groups.values()].map(g=>({curso_id:g.curso_id,anio_rendicion:g.anio_rendicion,semestre_rendicion:g.semestre_rendicion,n_estudiantes:g.personas.size,indicadores:Object.fromEntries(Object.entries(g.datos).map(([k,vals])=>[k,cmStats(vals)])),origen:'consolidacion_de_rendiciones',fecha_actualizacion:new Date().toISOString()}));
}
function cmMigrateEIF(){
 const e=db.resultados_eif||={};e.agregados_por_periodo ||= [];
 if(e.rendiciones?.length){let batches=cmAggregateEIF(e.rendiciones);
  for(let b of batches){let i=e.agregados_por_periodo.findIndex(z=>z.curso_id===b.curso_id&&Number(z.anio_rendicion)===b.anio_rendicion&&Number(z.semestre_rendicion)===b.semestre_rendicion);if(i<0)e.agregados_por_periodo.push(b);else e.agregados_por_periodo[i]=b}
  e.rendiciones=[];e.migracion='Los resultados individuales EIF anteriores fueron consolidados; no se preservan nombres ni puntajes individuales en EIF.';
 }
 e.modalidad='solo_agregados_por_curso_anio_semestre';e.almacenar_microdatos=false;
}

mallaHTML=function(s){
 const cc=courseList().filter(c=>c.plan_id===s.plan_estudio), byId=new Map(cc.map(c=>[c.id,c]));
 const missing=Object.keys(s.avance_curricular||{}).filter(id=>id.startsWith(s.plan_estudio+':')&&!byId.has(id));
 const draw=(c,id)=>{const st=s.avance_curricular?.[id]?.estado||'pendiente';let name=c?.nombre|| (id.includes(':CFG')?'CFG · Formación General':'Curso sin ficha en el catálogo');
  const sig=c?.sigla||id.split(':').slice(1).join(':');const cr=c?.creditos??s.avance_curricular?.[id]?.creditos;
  return `<button class="malla-course ${esc(st)}" onclick='editProgress(${JSON.stringify(s.rut)},${JSON.stringify(id)})'><b>${esc(sig)}${cr!=null?' · '+esc(cr)+' cr':''}</b><small>${esc(name)}</small><small>${esc(st)}</small></button>`;
 };
 let cols=[];for(let yr=1;yr<=5;yr++)for(let sem=1;sem<=2;sem++){
  const level=((yr-1)*2+sem)*100;
  const cards=cc.filter(c=>Number(c.nivel)===level).map(c=>draw(c,c.id)).join('');
  cols.push(`<div class="malla-col"><div class="malla-head">Año ${yr} · S${sem}</div>${cards||'<span class="small muted">Sin ficha</span>'}</div>`);
 }
 // No asignar arbitrariamente semestres a CFG ni cursos que no tienen ficha curricular.

 const unplaced=cc.filter(c=>![100,200,300,400,500,600,700,800,900,1000].includes(Number(c.nivel)));
 const extras=unplaced.length?`<div class="card"><h4>Cursos del catálogo sin nivel definido</h4><div class="grid">${unplaced.map(c=>draw(c,c.id)).join('')}</div></div>`:'';

};
